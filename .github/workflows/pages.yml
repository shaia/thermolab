# Build the whole site and publish it to GitHub Pages.
#
# Pull requests build and validate but do not deploy, so a broken page is caught before it can
# reach the published site. Pushes to master build, validate and deploy.
#
# The site is served from a path prefix on a project Pages site (https://<user>.github.io/<repo>/),
# so the build is told what that prefix is: actions/configure-pages reports it, and build_site.py
# turns it into BASE_URL=<prefix>/<lang> for each MyST project. Moving to a custom domain later
# changes the reported prefix to "/" and needs no change here.

name: Publish site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than publishing a half-uploaded site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The dev group carries jupyterlite, jupyterquiz and the bundled ffmpeg the animations
      # encode through, so it must not be skipped.
      - run: uv sync --locked

      # Rendering the animations is minutes of simulation, and build_site.py's own staleness
      # check cannot help here: actions/checkout stamps every file with the checkout time, so
      # the mtime comparison it relies on is meaningless. Cache the output against the code
      # that produces it instead, and pass the mode explicitly.
      - name: Cache rendered animations
        id: media
        uses: actions/cache@v4
        with:
          path: |
            content/en/media
            content/he/media
          key: media-${{ hashFiles('media/render/**/*.py', 'src/thermolab/**/*.py') }}

      - name: Build site
        env:
          # On a pull request configure-pages has not run; assume the project-site prefix so the
          # PR build exercises the same layout that will be deployed.
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}
        run: |
          uv run python scripts/build_site.py \
            ${{ steps.media.outputs.cache-hit == 'true' && '--no-media' || '--media' }}

      # After the build, not before: check_parity.py resolves every figure target on disk and the
      # module pages include generated quiz files — both are gitignored and only exist once the
      # build has produced them.
      #
      # No --fast here. It skips the notebook execution pass, which meant CI never ran a
      # notebook at all — not in the browser, not even on the desktop — while deploying the
      # bundle that contains them.
      - name: Validate
        run: uv run python scripts/validate_all.py

      # Actions deployments never run Jekyll, so this is only insurance against a future change
      # in how the artifact is served: the bundle contains _quiz/ path segments that Jekyll drops.
      - run: touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Only the JupyterLite bundle travels to the browser job: it navigates straight to
      # /lite/lab/index.html and never loads a MyST page, so the other 85 MB of _site would be
      # transferred for nothing.
      - name: Upload the laboratory bundle
        uses: actions/upload-artifact@v4
        with:
          name: lite-bundle
          path: _site/lite
          retention-days: 1

  # The one job that runs the artifact in the environment the artifact is for.
  #
  # Five browser-only failures have reached the published site — a wrong bootstrap cell, a
  # missing wheel, a requires-python ceiling that excluded Pyodide, a data file copied into one
  # language tree only, and a transitive import of scipy. Every one was invisible to the build
  # job above, because everything there runs on the desktop where the package is installed and
  # the files sit where the desktop expects them. Each was then patched with a bespoke
  # validator aimed at that one failure, which is why there were five.
  #
  # Split by language rather than run serially: 18 laboratories take about 29 minutes end to
  # end, and two parallel legs bring that back to about 15. fail-fast is off so a Hebrew-only
  # break still gets reported when English has already failed.
  browser:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [en, he]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Download the laboratory bundle
        uses: actions/download-artifact@v4
        with:
          name: lite-bundle
          path: _site/lite

      # --with-deps pulls the system libraries a headless browser needs on a bare runner.
      - name: Install browser
        run: uv run playwright install --with-deps chromium

      - name: Run the laboratories
        run: uv run python scripts/check_browser_labs.py --lang ${{ matrix.lang }}

  deploy:
    if: github.event_name != 'pull_request'
    # Gated on the browser job too: a bundle whose laboratories do not run is not deployable,
    # which is the whole point of measuring it before the upload rather than after.
    needs: [build, browser]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
