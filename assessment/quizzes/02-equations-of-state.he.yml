module: 02-equations-of-state
questions:
  - id: Q-02-1
    type: multiple-choice
    objectives: [OBJ-02-1]
    misconception: ideal-gas-law-universal
    prompt: >-
      תלמיד טוען שהחוק P V = N k_B T מתקיים בדיוק עבור כל גז בכל צפיפות. איזו תצפית מפריכה
      את הטענה הזו בצורה הישירה ביותר?
    choices:
      - text: >-
          גזים אמיתיים מתעבים לנוזל בטמפרטורה נמוכה, דבר שחוק הגזים האידיאליים -- שאין בו כל
          דרך להבחין בין חומר אחד למשנהו -- אינו יכול לחזות.
        correct: true
        feedback: >-
          נכון. חוק שאין בו קבועים ספציפיים לחומר אינו יכול לחזות שארגון מתעבה בטמפרטורה של
          87 קלווין בעוד הליום נותר גזי עד 4 קלווין. חייב להיות חסר משהו ספציפי לכל חומר.
      - text: חוק הגזים האידיאליים משתמש ב-k_B במקום ב-R.
        correct: false
        feedback: >-
          זהו רק הבדל בין ספירת חלקיקים N לספירת מולים n; שתי הצורות הן אותה הטענה עצמה,
          R = N_A k_B. הדבר אינו אומר דבר על הצפיפות.
      - text: חוק הגזים האידיאליים אינו חל על גזים שמורכבים ממולקולות של יותר מאטום אחד.
        correct: false
        feedback: >-
          הוא חל באותה מידה על כל גז דליל וקלאסי, אטומי או לא -- מספר האטומים בתוך מולקולה
          אינו רלוונטי לגזירה שבמודול 4.
      - text: חוק הגזים האידיאליים מחייב למדוד את N במולים ולא כספירת חלקיקים.
        correct: false
        feedback: >-
          שתי המוסכמות תקפות; קורס זה כותב בכוונה P V = N k_B T עם N כספירת חלקיקים פשוטה.
          אף אחת מהמוסכמות אינה אומרת דבר על היכן החוק נשבר.

  - id: Q-02-2
    type: multiple-choice
    objectives: [OBJ-02-2]
    misconception: attraction-raises-pressure
    prompt: >-
      מולקולות של גז אמיתי מושכות זו את זו בחולשה. בהשוואה לתחזית הגז האידיאלי
      N k_B T / V באותם N, V, T, האם המשיכה הזו מעלה או מורידה את הלחץ, ומדוע?
    choices:
      - text: >-
          היא מורידה את הלחץ -- מולקולה המתקרבת לדופן נמשכת אחורה על ידי השכנות שמאחוריה,
          ולכן היא מעבירה פחות תנע מכפי שהייתה מעבירה ללא כל משיכה.
        correct: true
        feedback: >-
          נכון. בעומק הגז המשיכה סימטרית ומתקזזת; רק סמוך לדופן, שם יש שכנות מצד אחד ואין
          כלל מהצד השני, יש למשיכה השפעה נטו -- וזו מכוונת הרחק מהדופן.
      - text: היא מעלה את הלחץ -- המשיכה מושכת יותר מולקולות לעבר הדופן, ולכן מתרחשות יותר התנגשויות.
        correct: false
        feedback: >-
          המשיכה אינה מגבירה את קצב ההתנגשויות; היא מקטינה את התנע שכל התנגשות סמוכה לדופן
          מעבירה, על ידי משיכת המולקולה הנכנסת אחורה.
      - text: היא מעלה את הלחץ -- מולקולות נמשכות נעות מהר יותר, ופוגעות בעוצמה רבה יותר.
        correct: false
        feedback: >-
          המשיכה מאטה מולקולה בהתקרבה לדופן (היא נמשכת בחזרה לעבר הגז שממנו הגיעה), ולא
          מאיצה אותה.
      - text: אין לה כל השפעה -- המשיכה משמעותית רק לאחר שהגז כבר התעבה לנוזל.
        correct: false
        feedback: >-
          התיקון קיים בכל צפיפות, אף שהוא קטן כאשר הגז דליל. בדיוק התיקון הקטן והנוכח בכל
          מקום הזה הוא שבסופו של דבר מצטבר למעבר התעבות בטמפרטורה נמוכה מספיק.

  - id: Q-02-3
    type: multiple-choice
    objectives: [OBJ-02-2]
    prompt: >-
      במשוואת ואן דר ואלס, הנפח V של חוק הגזים האידיאליים מוחלף ב-V - N b, כאשר b הוא הנפח
      המוחרג של מולקולה בודדת. מדוע זהו N b ולא b בלבד?
    choices:
      - text: >-
          כל אחד מ-N המולקולות מחריג באופן בלתי תלוי נפח b מהמרחב הזמין לאחרות, ולכן הנפח
          המוחרג הכולל גדל עם N.
        correct: true
        feedback: >-
          בדיוק -- הכפלת מספר המולקולות ב-b קבוע מכפילה את כמות המקום שהן תופסות יחד, ולכן
          התיקון חייב לגדול עם N ולא להישאר קבוע.
      - text: b כבר מתאר את הנפח שמוחרג על ידי כל מדגם הגז, יהיה N אשר יהיה.
        correct: false
        feedback: >-
          b מוגדר לכל מולקולה. אילו כבר סיכם על פני כל המדגם הוא היה צריך להיות תלוי ב-N, מה
          שהיה הופך אותו לתכונה של המדגם ולא של החומר.
      - text: יש לחלק את הנפח המוחרג בין N החלקיקים, ולקבל b/N.
        correct: false
        feedback: >-
          זהו כיוון הפוך: הוא היה גורם לתיקון הנפח המוחרג להצטמצם ככל שמוסיפים יותר מולקולות,
          בעוד שבפועל יותר מולקולות מחריגות נפח כולל גדול יותר.
      - text: אפשר להשמיט את הנפח המוחרג לחלוטין ממשוואת ואן דר ואלס.
        correct: false
        feedback: >-
          השמטתו מסירה בדיוק את האיבר שמונע מהלחץ להפוך לאינסופי ככל ש-V מצטמצם לעבר אפס --
          וכפי שהפרק המתקדם מראה, השמטתו גם מסירה את הנקודה הקריטית של המשוואה כליל.

  - id: Q-02-4
    type: numeric
    objectives: [OBJ-02-2]
    prompt: >-
      בעזרת P = N k_B T/(V - N b) - a N^2/V^2 עבור ארגון (a = 3.736e-49 Pa m^6,
      b = 5.317e-29 m^3, k_B = 1.381e-23 J/K) ב-N = 5.0e22, V = 2.0e-3 m^3, T = 300 K, הלחץ
      לפי ואן דר ואלס שונה מלחץ הגז האידיאלי N k_B T/V בכמה בקירוב? תנו שבר עשרוני עם סימן
      (שלילי אם לחץ הגז הממשי נמוך יותר).
    answer: -0.00092
    tolerance: 0.0005
    feedback: >-
      תיקון המשיכה (כ--234 Pa) גדול מעט בגודלו מתיקון הנפח המוחרג (כ-138+ Pa), כך ששניהם
      אינם מתקזזים: השינוי הנטו הוא כ--95 Pa מתוך כ-1.036e5 Pa, שבר קרוב ל--0.0009, כלומר
      כעשירית האחוז מתחת לאידיאלי.

  - id: Q-02-5
    type: multiple-choice
    objectives: [OBJ-02-3]
    prompt: >-
      יש לכם מדגם של גז ממשי ב-(N, V, T). אתם מכינים מדגם שני של אותו חומר עם 3N חלקיקים
      בנפח 3V, באותה טמפרטורה T. כיצד הלחץ שלו לפי ואן דר ואלס משתווה לזה של המדגם הראשון?
    choices:
      - text: >-
          שווה בדיוק -- הלחץ אינטנסיבי, וכל איבר במשוואת ואן דר ואלס אינו משתנה כאשר N ו-V
          נסקלים יחד בטמפרטורה קבועה.
        correct: true
        feedback: >-
          נכון. N/(V - N b) ו-N^2/V^2 הם כל אחד יחס בין גודל הפרופורציוני לגורם הסקלה לבין
          גודל הפרופורציוני לאותו גורם, כך שגורם הסקלה מצטמצם בדיוק -- עבור תיקון הגז הממשי
          בדיוק כמו עבור הגז האידיאלי.
      - text: משולש בדיוק, משום שהלחץ תלוי באופן ליניארי ב-N.
        correct: false
        feedback: >-
          הלחץ תלוי ב-N רק דרך ה*צפיפות* N/V, לא ב-N לבדו. הכפלת N פי שלושה תוך הכפלת V פי
          שלושה גם היא משאירה את הצפיפות הזו, ולכן גם את הלחץ, ללא שינוי.
      - text: שליש בדיוק, משום שהלחץ תלוי הפוכות ב-V.
        correct: false
        feedback: >-
          אותה טעות בכיוון ההפוך: גם V לבדו אינו קובע את הלחץ, רק היחס N/V קובע, והיחס הזה
          לא השתנה.
      - text: >-
          שווה בקירוב אך לא בדיוק -- תיקוני הנפח המוחרג והמשיכה נסקלים באופן שונה, ולכן נותר
          פער שיורי קטן.
        correct: false
        feedback: >-
          הם נסקלים באותו אופן כאשר N ו-V נסקלים יחד: שני התיקונים הומוגניים בדיוק מדרגה אפס
          ב-(N, V) בטמפרטורה קבועה, לא רק בקירוב.

  - id: Q-02-6
    type: multiple-choice
    objectives: [OBJ-02-4]
    prompt: >-
      בנקודה הקריטית של גז לפי ואן דר ואלס (T_c, P_c, V_c), מה מיוחד באיזותרם ה-P-V
      ב-T = T_c?
    choices:
      - text: >-
          גם השיפוע dP/dV וגם העקמומיות d^2P/dV^2 מתאפסים בו-זמנית ב-V = V_c -- לאיזותרם יש
          שם נקודת פיתול אופקית.
        correct: true
        feedback: >-
          נכון -- זה בדיוק הזוג של התנאים שבאמצעותם T_c, P_c ו-V_c מוגדרים ונגזרים.
      - text: הלחץ נמצא במקסימום המוחלט שלו על פני כל הנפחים.
        correct: false
        feedback: >-
          הנקודה הקריטית היא נקודת פיתול אופקית, לא מקסימום -- הלחץ ממשיך לרדת ככל ש-V גדל
          הרבה מעבר ל-V_c.
      - text: הגז מציית לחוק הגזים האידיאליים בדיוק באותה נקודה.
        correct: false
        feedback: >-
          ההפך קרוב יותר לאמת: הנקודה הקריטית היא היכן שתיקוני הגז הממשי משמעותיים ביותר,
          משום שזה היכן ש-V הקטן ביותר יחסית לנפח המוחרג N b.
      - text: הנפח V_c בלתי תלוי במספר החלקיקים N הנוכחים.
        correct: false
        feedback: >-
          V_c = 3 N b פרופורציוני ל-N -- הוא אקסטנסיבי, בשונה מ-T_c ו-P_c, התלויים רק
          בקבועי החומר a ו-b ולא בגודל המדגם.

  - id: Q-02-7
    type: multiple-choice
    objectives: [OBJ-02-5]
    prompt: >-
      מתחת לטמפרטורה הקריטית, איזותרם של ואן דר ואלס מפתח תחום שבו (dP/dV)_T > 0 -- הלחץ
      עולה עם הנפח. מה מסמן התחום הזה?
    choices:
      - text: >-
          התחום הזה אינו יציב מכנית ואינו ממומש אף פעם על ידי חומר אמיתי; האיזותרם האמיתי
          מחליף אותו במקטע ישר בעל לחץ קבוע, באמצעות בניית מקסוול.
        correct: true
        feedback: >-
          נכון -- תחום שבו הלחץ עולה עם הנפח היה קורס או מתפשט באופן ספונטני במקום לשבת
          בשיווי משקל, ולכן אף גז אמיתי אינו יושב שם.
      - text: התחום הזה מתאר את הגז הופך לעל-קריטי.
        correct: false
        feedback: >-
          התנהגות על-קריטית מופיעה מעל T_c, שם לא מופיע כלל שום עיקום -- העיקום הוא תופעה
          שמתחת ל-T_c בלבד.
      - text: התחום הזה הוא היכן שחוק הגזים האידיאליים הופך למדויק.
        correct: false
        feedback: >-
          העיקום הוא הסימן הברור ביותר לכך שהגז רחוק ביותר מהתנהגות אידיאלית, לא קרוב אליה.
      - text: התחום הזה מסמן שתיקון הנפח המוחרג הפך לשלילי.
        correct: false
        feedback: >-
          b עצמו אינו משנה סימן לעולם; העיקום נובע מהתחרות בין שני התיקונים בנפח הקרוב
          ל-N b, לא מהיפוך סימן של אחד מהם.

  - id: Q-02-8
    type: prediction
    objectives: [OBJ-02-2, OBJ-02-3, OBJ-02-4]
    prompt: >-
      לפני קריאת הגזירה: מיכל מכיל N חלקיקים של גז ממשי בנפח V ובטמפרטורה T. נבאו מה קורה
      ללחץ אם (א) מכפילים את N לבדו, ב-V ו-T קבועים; (ב) מכפילים גם את N וגם את V,
      ב-T קבוע; (ג) מחליפים את הגז באחד שמולקולותיו מושכות בחוזקה רבה יותר (a גדול יותר),
      באותם N, V, T.
    discussion: >-
      (א) הלחץ מוכפל בקירוב, אך לא בדיוק. בשונה מהגז האידיאלי -- שבו הכפלת N תמיד מכפילה
      את P בדיוק -- איבר הנפח המוחרג גדל מהר יותר מליניארית (גם המכנה V - N b מצטמצם) בעוד
      איבר המשיכה גדל כמו N^2 (מתרבע), כך שהכפלת N לבדו משנה את האיזון בין שני התיקונים.
      (ב) הלחץ אינו משתנה כלל -- זו אינווריאנטיות הסקלה האינטנסיבית שנגזרת בעמוד, והיא
      מתקיימת עבור שני התיקונים יחד, לא רק עבור האיבר האידיאלי. (ג) a גדול יותר מגדיל את
      איבר המשיכה a N^2/V^2, ודוחף את הלחץ הרחק יותר מתחת לערך המתוקן בנפח המוחרג; הוא גם
      מעלה את T_c, שכן k_B T_c = 8a/(27b) -- חומר שמושך בחוזקה רבה יותר מתעבה בטמפרטורה
      גבוהה יותר, וזו בדיוק הסיבה שגזים אמיתיים שונים מתנזלים בטמפרטורות כה שונות.
