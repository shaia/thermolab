module: 03-random-walks
questions:
  - id: Q-03-1
    type: numeric
    objectives: [OBJ-03-1]
    prompt: >-
      הולך מבצע 400 צעדים של 1+ או 1-, כששני הכיוונים שווי סבירות. באיזה מרחק טיפוסי מנקודת
      המוצא נמצא אותו, בערך? חשבו את המרחק הריבועי הממוצע, sigma_1 sqrt(t), ביחידות של צעדים.
    answer: 20
    tolerance: 1
    feedback: >-
      השונות מקיימת Var(x_t) = sigma_1^2 t כאשר sigma_1 = 1, ולכן המרחק הטיפוסי הוא
      sqrt(400) = 20 צעדים. לא אפס — ההילוך אכן מתפשט. ולא 400 — זה המרחק שהיה עובר לו כל
      הצעדים היו לאותו כיוון, והצעדים מבטלים זה את זה הרבה יותר פעמים משהם מצטרפים.

  - id: Q-03-2
    type: multiple-choice
    objectives: [OBJ-03-1, OBJ-03-6]
    misconception: walker-restoring-force
    prompt: >-
      לאחר 500 צעדים, הולך מסוים עומד בנקודה 30+. מהי התוחלת של ההעתק שלו מהמקום שבו הוא עומד
      עכשיו, במהלך 500 הצעדים הבאים?
    choices:
      - text: אפס — 500 הצעדים הבאים שלו נדגמים בדיוק מאותה התפלגות שממנה נדגמים הצעדים של כל אחד אחר.
        correct: true
        feedback: >-
          נכון. שום דבר במודל אינו מתייחס לראשית. התפלגות הצעדים אינה יודעת היכן ההולך נמצא,
          ולכן העתיד שלו סימטרי סביב מיקומו הנוכחי, עד כמה שהתרחק.
      - text: בערך 30-, כך שבממוצע הוא יחזור לראשית.
        correct: false
        feedback: >-
          זו תמונה של כוח מחזיר, ואין כאן כוח כלל. הולך בנקודה 30+ היה צריך לבדוק את מיקומו
          כדי לדעת לנוע שמאלה, ושום דבר במודל אינו מאפשר לו זאת. תוחלת המיקום של הצבר נשארת
          אפס משום שהולכים שסטו ימינה מאוזנים בהולכים שסטו שמאלה, ולא משום שמישהו מוחזר.
      - text: בערך 30- חלקי 500, כי החזרה מתפרשת על פני יתר הצעדים.
        correct: false
        feedback: >-
          אותו רעיון של כוח מחזיר, רק עם חשבון מסודר אחרת. כל תוחלת שאינה אפס הייתה מחייבת
          שהתפלגות הצעדים תהיה תלויה במיקום, והיא אינה תלויה בו.
      - text: בערך 30+, כי הולך שסטה ימינה הוא כנראה הולך שנוטה ימינה.
        correct: false
        feedback: >-
          הצעדים בלתי תלויים ובעלי אותה התפלגות, ולכן צעדים שכבר נעשו אינם נושאים שום מידע על
          הצעדים הבאים. אין במודל הזה דבר כזה "הולך שנוטה ימינה" — יש רק הולך שבמקרה יצאו לו
          עד כה יותר צעדים ימינה.

  - id: Q-03-3
    type: numeric
    objectives: [OBJ-03-2]
    prompt: >-
      עבור התפלגות בינומית עם n = 100 ניסויים ו-p = 1/2, חשבו את סטיית התקן של מספר ההצלחות,
      כלומר sqrt(n p (1-p)).
    answer: 5
    tolerance: 0.2
    feedback: >-
      sqrt(100 x 0.5 x 0.5) = sqrt(25) = 5. כלומר מספר ה"עץ" ב-100 הטלות נמצא בתחום 5 -/+ 50
      בכ-68 אחוזים מהמקרים. שימו לב שמיקום ההולך הוא x = 2k - n, ולכן הפיזור שלו הוא
      2 x 5 = 10 = sqrt(100), בהתאמה ל-sigma_1 sqrt(t).

  - id: Q-03-4
    type: multiple-choice
    objectives: [OBJ-03-3]
    prompt: >-
      איזו מהטענות הבאות אינה הנחה של משפט הגבול המרכזי כפי שנוסח במודול הזה?
    choices:
      - text: הצעדים עצמם חייבים להיות בעלי התפלגות גאוסית.
        correct: true
        feedback: >-
          נכון — וזה כל העניין שבמשפט. אילו הצעדים היו חייבים להיות גאוסיים מלכתחילה, התוצאה
          הייתה טריוויאלית. הצעדים יכולים להיות מטבעות, דגימות אחידות או כל דבר אחר בעל שונות
          סופית; הצורה הגאוסית מופיעה בסכום בכל מקרה.
      - text: הצעדים חייבים להיות בלתי תלויים זה בזה.
        correct: false
        feedback: >-
          זו אכן הנחה של המשפט, וזו ההנחה שההילוך המתמיד שבמודול מפר. היא זו שמאפשרת לשונויות
          להיסכם.
      - text: כל הצעדים חייבים להידגם מאותה התפלגות.
        correct: false
        feedback: >-
          זו אכן הנחה של הניסוח שהובא כאן. (קיימים ניסוחים חלשים יותר שמרפים אותה, אך אין הם
          מה שהמודול הזה טוען.)
      - text: להתפלגות הצעדים חייבת להיות שונות סופית.
        correct: false
        feedback: >-
          זו אכן הנחה של המשפט, ובעיה 8 בדף הבעיות בוחנת מה עושה להתפלגות קושי — שאין לה שונות
          סופית — למסקנה.

  - id: Q-03-5
    type: multiple-choice
    objectives: [OBJ-03-3]
    misconception: clt-always-applies
    prompt: >-
      הילוך חוזר על הצעד הקודם שלו בהסתברות 0.9, ואחרת דוגם צעד חדש של 1-/1+. הסכומים המתוקננים
      שלו, מחולקים ב-sigma_1 sqrt(n), מושווים להתפלגות גאוסית סטנדרטית עבור n גדל והולך. מה
      קורה, ומדוע?
    choices:
      - text: ההיסטוגרמה נשארת רחבה מדי בכל n, משום שאי-התלות מופרת והשונויות כבר אינן נסכמות פשוט.
        correct: true
        feedback: >-
          בדיוק. הצעדים עדיין בעלי אותה התפלגות ועדיין בעלי שונות סופית; רק אי-התלות נעלמה.
          השונות האמיתית היא t(1+q)/(1-q) = 19t ולא t, ולכן חלוקה ב-sigma_1 sqrt(n) מחמיצה את
          הרוחב בפקטור sqrt(19).
      - text: ההיסטוגרמה מתלכדת בכל זאת עם הגאוסית; דרושים רק עוד צעדים.
        correct: false
        feedback: >-
          היא אינה מתלכדת. זהו הרפלקס "כל סכום של הרבה גורמים מקריים הוא גאוסי", וההילוך
          המתמיד קיים כדי להפריך אותו. המרחק מההתפלגות הגאוסית הסטנדרטית מפסיק לרדת במקום
          להתכווץ אל רצפת הדגימה, ולא משנה כמה n גדל.
      - text: ההיסטוגרמה מאבדת את צורת הפעמון — מופיעים בה שני שיאים.
        correct: false
        feedback: >-
          לא הצורה היא שנשברת. בזמנים ארוכים ההילוך המתמיד עדיין גאוסי; מה שהנוסחה של צעדים
          בלתי תלויים טועה בו הוא ה*רוחב*. תקנון לפי השונות הנכונה מביא להתלכדות מושלמת.
      - text: דבר אינו משתנה, שהרי הצעדים עדיין 1-/1+ בהסתברויות שוות.
        correct: false
        feedback: >-
          ההתפלגות השולית של צעד בודד אכן אינה משתנה — וזה מה שהופך את דוגמת הנגד הזו לחדה.
          מה שהשתנה הוא ההתפלגות המשותפת, והמשפט הוא טענה על ההתפלגות המשותפת.

  - id: Q-03-6
    type: numeric
    objectives: [OBJ-03-4]
    prompt: >-
      השתמשו בקירוב של משפט דה-מואבר-לפלס כדי לאמוד את ההסתברות לקבל בדיוק 50 פעמים "עץ"
      ב-100 הטלות של מטבע הוגן. כלומר, חשבו את 1/sqrt(2 pi n p q) עבור n = 100 ו-p = q = 1/2.
    answer: 0.0798
    tolerance: 0.0005
    feedback: >-
      1/sqrt(2 pi x 100 x 0.25) = 1/sqrt(50 pi) = 0.0798. הערך הבינומי המדויק הוא 0.0796, כך
      שהקירוב שוגה בכרבע אחוז — בסביבת השיא. נסו את אותה השוואה עבור k = 90 והשגיאה היחסית
      תהיה עצומה: זו טענה על האזור המרכזי, לא על הזנבות.

  - id: Q-03-7
    type: multiple-choice
    objectives: [OBJ-03-5]
    misconception: spread-means-drift
    prompt: >-
      אתם צופים בענן של הולכים ללא הטיה ורואים אותו מתרחב בהתמדה. מה עושה מיקומו הממוצע?
    choices:
      - text: נשאר אפס, בתוך אי-ודאות מסדר גודל sqrt(t/N) שגדלה אף היא.
        correct: true
        feedback: >-
          נכון, והסייג חשוב. הממוצע נשאר אפס, אבל האומדן שלנו עבורו טוב רק עד כדי שגיאת התקן
          sigma_1 sqrt(t) / sqrt(N) — ולכן ההנפשה משרטטת סביב האפס רצועה אפורה מתרחבת ולא קו
          חשוף.
      - text: גדל, שהרי לענן רחב יותר חייב להיות מיקום ממוצע גדול יותר.
        correct: false
        feedback: >-
          הרוחב והממוצע הם שני גדלים נפרדים. הענן גדל בסימטריה: הולכים שנודדים ימינה מאוזנים
          בהולכים שנודדים שמאלה, ולכן הממוצע נשאר במקומו בעוד הפיזור גדל כ-sqrt(t). הילוך מוטה
          מדגים את הניגוד — שם הממוצע אכן צועד, ליניארית, בעוד הרוחב עדיין רק זוחל.
      - text: גדל כ-sqrt(t), כמו הרוחב.
        correct: false
        feedback: >-
          בהילוך ללא הטיה הממוצע אינו גדל כלל: התוחלת היא mu_1 t ו-mu_1 = 0. הגדילה כ-sqrt(t)
          שייכת לפיזור בלבד.
      - text: אי אפשר לדעת בלי לדעת מהי התפלגות הצעדים.
        correct: false
        feedback: >-
          התשובה נקבעת לחלוטין: התוחלת היא mu_1 t עבור כל התפלגות צעדים, ולכן "ללא הטיה"
          (כלומר mu_1 = 0) כבר קובע את התשובה אפס, יהיה מראה הצעדים אשר יהיה.

  - id: Q-03-8
    type: multiple-choice
    objectives: [OBJ-03-5]
    prompt: >-
      אתם מרבעים את מספר המדידות במדגם, מ-N ל-4N. מה קורה לסטיית התקן של הנתונים, ומה קורה
      לשגיאת התקן של הממוצע שלהם?
    choices:
      - text: סטיית התקן אינה משתנה; שגיאת התקן נחצית.
        correct: true
        feedback: >-
          נכון. סטיית התקן מתארת את האוכלוסייה ואינה מושפעת מכמה ממנה הסתכלתם. שגיאת התקן,
          sigma_1/sqrt(N), מתארת את אי-הוודאות שלכם לגבי הממוצע, ו-sqrt(4) = 2.
      - text: שתיהן נחצות.
        correct: false
        feedback: >-
          מדידה של חלק גדול יותר מאוכלוסייה אינה הופכת את האוכלוסייה לפחות מפוזרת. אילו כך
          היה, אפשר היה להפוך כל גודל למדויק פשוט על ידי מדידות רבות — והפיזור של הערכים
          הבודדים היה מצטמצם לעין, וזה אינו קורה.
      - text: שתיהן אינן משתנות.
        correct: false
        feedback: >-
          סטיית התקן אכן אינה משתנה, אבל כל תכליתו של המיצוע היא שהממוצע ייקבע טוב יותר. אילו
          שגיאת התקן לא הייתה מצטמצמת, לא הייתה שום סיבה לחזור על מדידה.
      - text: סטיית התקן נחצית; שגיאת התקן אינה משתנה.
        correct: false
        feedback: >-
          זו בדיוק ההחלפה בין שני הגדלים. כדאי לכתוב את שתי ההגדרות זו לצד זו: האחת היא תכונה
          של הנתונים, והשנייה תכונה של האומדן שלכם.

  - id: Q-03-9
    type: multiple-choice
    objectives: [OBJ-03-6]
    misconception: lln-compensation
    prompt: >-
      עשרת אלפים הולכים בלתי תלויים מייצרים היסטוגרמה חלקה בצורת פעמון, שחוזרת על עצמה בכל
      הרצה. איזה הסבר למקורו של הסדר הזה נכון?
    choices:
      - text: יש אין-ספור יותר סדרות צעדים שמגיעות לאמצע מאשר לקצוות, וכל סדרה שווה בסבירותה לכל אחרת.
        correct: true
        feedback: >-
          כן. הסדר הוא עובדת ספירה, לא עובדה דינמית. שום דבר אינו מכוון הולך כלשהו, ואף הולך
          אינו יודע על קיומם של האחרים; הצורה היא פשוט מה שמתקבל כשסופרים כמה מסלולים מגיעים
          לכל יעד.
      - text: הולכים שהתרחקו יתר על המידה נמשכים בחזרה, וכך ההתפלגות נשארת ממורכזת.
        correct: false
        feedback: >-
          אין מנגנון כזה, והמעבדה מפריכה אותו ישירות: מתנים על ההולכים שעומדים בנקודה 30+
          ומגלים שהתנועה שלהם מכאן ואילך סימטרית. ההתכנסות כאן פועלת בדילול, לעולם לא בתיקון.
      - text: הצעדים של כל הולך מתבטלים בממוצע, ולכן כל הולך מסיים בקרבת הראשית.
        correct: false
        feedback: >-
          כל הולך *אינו* מסיים בקרבת הראשית — המרחק הטיפוסי הוא sigma_1 sqrt(t), והוא גדל ללא
          גבול. מה שמתייצב הוא צורת הצבר, לא מיקומו של אף פרט.
      - text: כשיש מספיק הולכים, עודף בצד אחד מתקזז בהולכים מאוחרים יותר שנוחתים בצד השני.
        correct: false
        feedback: >-
          ההולכים בלתי תלויים, ולכן אף הולך אינו יכול לקזז אחר; להולך מאוחר אין שום דרך ללמוד
          מה עשו הקודמים. זו כשלת הקיזוז ממודול 0, מועתקת מציר הזמן אל הצבר.

  - id: Q-03-10
    type: numeric
    objectives: [OBJ-03-1, OBJ-03-5]
    prompt: >-
      הולך מבצע 400 צעדים של 1-/1+, אך המטבע מוטה: p = 0.6 לכיוון ימין. חשבו את תוחלת ההעתק
      שלו, mu_1 t, ביחידות של צעדים.
    answer: 80
    tolerance: 2
    feedback: >-
      mu_1 = (+1)(0.6) + (-1)(0.4) = 0.2, ולכן התוחלת היא 0.2 x 400 = 80 צעדים. השוו זאת
      לפיזור, sigma_1 sqrt(400) = sqrt(0.96) x 20 = 19.6 צעדים: ההיסט כבר עקף את הרוחב פי
      ארבעה, והפער ממשיך להיפתח משום שהאחד גדל כ-t והאחר רק כ-sqrt(t).
