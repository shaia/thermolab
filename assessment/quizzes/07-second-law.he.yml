module: 07-second-law
questions:
  - id: Q-07-1
    type: multiple-choice
    objectives: [OBJ-07-2]
    misconception: efficiency-is-engineering
    prompt: >-
      מנוע בולע 1000 ג'אול של חום מכבשן בכל מחזור ומספק 400 ג'אול של עבודה. מה מעמדם של 600
      הג'אול הנותרים?
    choices:
      - text: הם חייבים להיפלט אל מאגר חום קר יותר; שום תכנון אינו יכול להשיב את כולם.
        correct: true
        feedback: >-
          נכון. סביב מחזור השינוי באנרגיה הפנימית מתאפס, ולכן העבודה המסופקת היא Q_h - Q_c,
          והחוק השני מחייב Q_c גדול מאפס בכל מנוע מחזורי. החום הנפלט הוא דרישה מבנית ולא
          דליפה — גם המנוע הטוב ביותר שניתן להעלות על הדעת בין שני המאגרים האלה עדיין פולט
          את היחס Q_c/Q_h = T_c/T_h ממה שבלע.
      - text: הם אובדים לחיכוך ולדליפות חום, ותכנון טוב יותר היה משיב את רובם.
        correct: false
        feedback: >-
          זו הקריאה השגויה הנפוצה ביותר של החוק השני. חיכוך ודליפות אכן קיימים ואכן עולים
          ביוקר, אבל לא בהם עוסק החוק: מנוע נטול חיכוך לחלוטין, מבודד לחלוטין, שכל צעדיו
          הפיכים, עדיין פולט חום. אפסו כל אובדן והחסם 1 - T_c/T_h נשאר על כנו.
      - text: הם נאגרים בחומר העבודה ומשתחררים במחזור מאוחר יותר.
        correct: false
        feedback: >-
          מחזור מחזיר את חומר העבודה בדיוק למצב ההתחלתי שלו, ולכן האנרגיה הפנימית שלו זהה
          בסוף ובהתחלה. אין מקום שבו אנרגיה יכולה להצטבר — וזה בדיוק מה שהופך את המאזן
          W = Q_h - Q_c למדויק.
      - text: הם מעולם לא נבלעו באמת; הנתון 1000 ג'אול ודאי נובע משגיאת מדידה.
        correct: false
        feedback: >-
          החום הנמשך מהכבשן והעבודה המסופקת ניתנים למדידה בלתי תלויה, והם נבדלים זה מזה
          בפקטור כזה בדיוק באופן שגרתי. אין שום פגם במספרים; נצילות של 0.4 היא דבר רגיל.

  - id: Q-07-2
    type: multiple-choice
    objectives: [OBJ-07-3]
    misconception: carnot-depends-on-substance
    prompt: >-
      שני מנועים פועלים בין אותו כבשן ואותו נהר. האחד משתמש בקיטור והשני בהליום. את מי מהם
      אפשר לעשות נציל יותר?
    choices:
      - text: אף אחד מהם — הנצילות המרבית זהה, משום שהיא תלויה בשתי הטמפרטורות בלבד.
        correct: true
        feedback: >-
          נכון, וזהו חציו המפתיע של משפט קרנו. ההוכחה אינה פותחת אף אחד מהמנועים: היא נשענת
          רק על כך שהאחד מפיק עבודה משני מאגרי חום ושאת השני אפשר להפוך. מאחר שחומר העבודה
          אינו נכנס לטיעון כלל, הוא אינו יכול להופיע בתשובה.
      - text: קיטור, משום ששינוי המופע שלו מאפשר לו לבלוע הרבה יותר חום לכל קילוגרם.
        correct: false
        feedback: >-
          קיטור אכן נושא יותר חום לכל קילוגרם, ולעובדה הזו חשיבות עצומה לגודלו ולעלותו של
          מתקן. אבל נצילות היא יחס בין עבודה לבין החום הנבלע, והחום הנוסף מופיע גם במונה וגם
          במכנה. התקרה אינה זזה.
      - text: הליום, משום שלגז חד-אטומי אין מודים פנימיים לבזבז בהם אנרגיה.
        correct: false
        feedback: >-
          אנרגיה במודים סיבוביים או רטטיים אינה מבוזבזת — היא מוחזרת כשהגז נדחס בחזרה, משום
          שהמחזור נסגר. עברו על גזירת קרנו וראו כיצד גאמא מצטמצם: הנצילות יוצאת 1 - T_c/T_h
          עבור כל מספר דרגות חופש.
      - text: זה שקיבול החום שלו גדול יותר, משום שהוא מעביר יותר אנרגיה בכל מחזור.
        correct: false
        feedback: >-
          יותר אנרגיה במחזור פירושה מנוע חזק יותר, לא נציל יותר. אלו שאלות שונות, וכדאי
          להיזהר מערבובן — הספק ונצילות נסחרים זה כנגד זה בכל תכנון ממשי.

  - id: Q-07-3
    type: multiple-choice
    objectives: [OBJ-07-5]
    misconception: refrigerator-lowers-total-entropy
    prompt: >-
      מקרר מוריד את האנטרופיה של המזון שבתוכו. האם הדבר מפר את החוק השני?
    choices:
      - text: לא — האנטרופיה הנפלטת אל המטבח גדולה מן האנטרופיה שהוסרה מן החלל הפנימי.
        correct: true
        feedback: >-
          בדיוק. החוק השני מגביל את הסך הכולל, לא כל רכיב בנפרד. המקרר פולט את הסכום
          Q_c + W אל המטבח בטמפרטורה הגבוהה יותר, והמאזן הכולל יוצא אי-שלילי, עם שוויון רק
          במכונה הפיכה.
      - text: כן, אך במידה מזערית בלבד, ולמקררים ממשיים מותרת הפרה קטנה.
        correct: false
        feedback: >-
          החוק השני אינו מתיר הפרות, קטנות כגדולות. אין כאן דבר לתרץ: האנטרופיה הכוללת אכן
          גדלה, משום שהחום הנפלט אל המטבח החם נושא אנטרופיה רבה יותר מן החום שהוסר מן החלל
          הפנימי הקר.
      - text: לא, משום שאנטרופיה אינה חלה על עצמים יומיומיים כמו מזון.
        correct: false
        feedback: >-
          אנטרופיה מוגדרת עבור כל מערכת בשיווי משקל, ובכלל זה מזון. הפתרון אינו שהחוק אינו
          חל אלא שהגבול שורטט צר מדי — הביטו במקרר ובמטבח יחד.
      - text: כן, ולכן מקררים זקוקים לאספקת חשמל רציפה.
        correct: false
        feedback: >-
          החשמל אכן נחוץ, והאינטואיציה מצביעה על משהו אמיתי, אבל המסקנה הפוכה. הזנת העבודה
          היא מה שמאפשר למכונה לציית לניסוח קלאוזיוס, שכן העברת חום מקר לחם אסורה רק כתוצאה
          *יחידה*. התשלום עבורה הוא מה שהופך אותה למותרת.

  - id: Q-07-4
    type: numeric
    objectives: [OBJ-07-4]
    prompt: >-
      דוד הקיטור של תחנת כוח נמצא בטמפרטורה 811 קלווין והמעבה שלה בטמפרטורה 311 קלווין. חשבו
      את הנצילות המרבית האפשרית, כשבר עשרוני בין 0 ל-1.
    answer: 0.6165
    tolerance: 0.005
    feedback: >-
      הנצילות המרבית היא 1 - T_c/T_h = 1 - 311/811 = 0.6165. אם קיבלתם 0.3835 חישבתם את היחס
      T_c/T_h ושכחתם לחסר אותו מ-1. אם קיבלתם ערך בסביבות 0.93 השתמשתם בצלזיוס: יחס בין
      טמפרטורות הוא בעל משמעות רק בסולם מוחלט, וזו השגיאה היחידה היקרה ביותר במודול הזה.
      התחנה משיגה בפועל כ-0.40, והפער הזה הוא ברובו מכוון — ראו את נצילות ההספק המרבי.

  - id: Q-07-5
    type: multiple-choice
    objectives: [OBJ-07-1]
    prompt: >-
      איזו מן המכונות הבאות, לו נבנתה, הייתה מפרה את ניסוח קלווין של החוק השני?
    choices:
      - text: אונייה המושכת חום מן האוקיינוס וממירה אותו כולו להנעה, מחזור אחר מחזור, בלי לשנות דבר נוסף.
        correct: true
        feedback: >-
          נכון: זוהי מכונה מחזורית שתוצאתה היחידה היא חום הנמשך ממאגר חום יחיד ומופיע כעבודה.
          שני התנאים חשובים — היא חוזרת על עצמה, ודבר נוסף בשום מקום אינו משתנה. שימו לב
          שהאנרגיה נשמרת בשלמות, ולכן לחוק הראשון אין דבר לומר על כך.
      - text: גז המתפשט איזותרמית, בולע חום ומבצע עבודה השווה לו.
        correct: false
        feedback: >-
          זהו תהליך הממיר חום כולו לעבודה, בנצילות מלאה, והוא מותר לחלוטין — משום שאינו
          מחזורי. הגז נותר גדול יותר ולחצו נמוך יותר, ולכן אי אפשר לחזור על התרגיל בלי לשלם
          תחילה על דחיסתו בחזרה.
      - text: מקרר המעביר חום מן החלל הפנימי הקר שלו אל המטבח החם יותר.
        correct: false
        feedback: >-
          מותר, ועומד במטבח שלכם. ניסוח קלאוזיוס אוסר זאת רק כתוצאה *יחידה*; מקרר צורך גם
          חשמל, ולכן דבר נוסף אכן משתנה.
      - text: מנוע המשיג נצילות של 0.35 בין מאגרי חום בטמפרטורות 600 קלווין ו-300 קלווין.
        correct: false
        feedback: >-
          מותר לחלוטין: הערך 0.35 נמצא מתחת לחסם 1 - 300/600 = 0.50. החוק השני קובע תקרה,
          והמנוע הזה מתחתיה.

  - id: Q-07-6
    type: numeric
    objectives: [OBJ-07-5]
    prompt: >-
      משאבת חום מחממת בית בטמפרטורה 295 קלווין באמצעות אוויר חיצוני בטמפרטורה 273 קלווין.
      חשבו את מקדם הביצועים המרבי האפשרי שלה (חום מסופק ליחידת עבודה מושקעת).
    answer: 13.41
    tolerance: 0.2
    feedback: >-
      מקדם הביצועים של המשאבה הוא T_h/(T_h - T_c) = 295/22 = 13.41. אם קיבלתם 12.41 חישבתם
      את מקדם הביצועים של המקרר, T_c/(T_h - T_c) = 273/22, והשניים נבדלים בדיוק ב-1 — גם
      העבודה המושקעת מגיעה כחום אל הצד החם. ערך הגדול בהרבה מ-1 אינו שגיאה: דבר אינו מומר
      כאן, אנרגיה מועברת, והעברתה עולה פחות מן הכמות המועברת.

  - id: Q-07-7
    type: multiple-choice
    objectives: [OBJ-07-6]
    prompt: >-
      מדוע אפשר להשתמש ביחס החומים שמחליף מנוע הפיך כדי להגדיר סולם טמפרטורה?
    choices:
      - text: משום שמשפט קרנו קובע שהיחס הזה זהה בכל מנוע הפיך בין אותם שני מאגרי חום, יהיה עשוי ממה שיהיה.
        correct: true
        feedback: >-
          בדיוק. הגדרה אינה רשאית להיות תלויה במכשיר המשמש ליישומה, והיחס הזה אכן אינו תלוי
          בו, וניתן להוכיח זאת. קיבוע נקודת ייחוס אחת מקבע אז את הסולם כולו, והתוצאה אינה
          מתייחסת לשום חומר — וזו משמעות המילה מוחלט כאן.
      - text: משום שקל יותר למדוד חום בדיוק מאשר טמפרטורה.
        correct: false
        feedback: >-
          בדרך כלל ההפך הוא הנכון, ומכל מקום מנוע הפיך נמשך זמן אינסופי בכל מחזור ואי אפשר
          לבנותו. ערכה של ההגדרה הוא רעיוני: היא אומרת מהי טמפרטורה, ללא תלות בשום מדחום.
      - text: משום שמשוואת הגז האידאלי כבר קושרת לחץ וטמפרטורה בקשר ליניארי.
        correct: false
        feedback: >-
          זה נותן את סולם הגז האידאלי, שהוא מדחום אמפירי טוב בהחלט אך תלוי בכך שחומר מסוים
          יתנהג אידאלית. כל עניינה של ההגדרה התרמודינמית הוא לא להזדקק לשום חומר.
      - text: משום שאנטרופיה מוגדרת כחום חלקי טמפרטורה.
        correct: false
        feedback: >-
          זה הופך את סדר ההיגיון. יחס החומים ההפיך בא ראשון ומגדיר את סולם הטמפרטורה;
          האנטרופיה נבנית אחר כך מן החום חלקי אותה טמפרטורה. שימוש באנטרופיה כדי להגדיר את
          הטמפרטורה כאן היה מעגלי.

  - id: Q-07-8
    type: prediction
    objectives: [OBJ-07-7]
    prompt: >-
      לפני קריאת הפרק על אנטרופיה מיוצרת: למנוע הפועל בין מאגרי חום בטמפרטורות 600 קלווין
      ו-300 קלווין יש מחליפי חום לא מושלמים, ולכן הגז שלו נמצא בטמפרטורה 560 קלווין בעת הבליעה
      ובטמפרטורה 340 קלווין בעת הפליטה. כל צעד שהוא מבצע הפיך בפנים. חזו את (א) הנצילות שלו,
      (ב) האם אינטגרל המסילה של delta-Q חלקי טמפרטורת המאגר מתאפס או שלילי, ו-(ג) לאן הלכה
      העבודה שאינו מספק.
    discussion: >-
      (א) הנצילות נקבעת על ידי הטמפרטורות שביניהן פועל *הגז*, לא המאגרים: 1 - 340/560 = 0.393,
      מול חסם קרנו של 0.500. (ב) אינטגרל המסילה שלילי ממש, ושווה 0.357- ג'אול לקלווין לכל
      1000 ג'אול נבלעים, משום שהמכנים הם טמפרטורות המאגרים 600 ו-300 ולא 560 ו-340. חלוקה
      בטמפרטורת הגז עצמו נותנת אפס בדיוק עבור המחזור הזה של צעדים כמו-סטטיים ואינה מוכיחה
      דבר — כל אי-השוויון שוכן בפער שבין שתי הטמפרטורות. האנטרופיה המיוצרת בכל מחזור היא
      אפוא S_gen = 0.357 ג'אול לקלווין. (ג) העבודה האבודה היא 107 = 393 - 500 ג'אול, והיא שווה
      למכפלת T_c באנטרופיה המיוצרת: 107 = 0.357 * 300 ג'אול. עבודה אבודה ואנטרופיה מיוצרת הן
      גודל אחד הנראה משני צדדים. אם חזיתם את הנצילות מטמפרטורות המאגרים, שימו לב למה שהמנוע
      באמת "רואה": הוא נוגע אך ורק בגז שלו.

  - id: Q-07-9
    type: short-answer
    objectives: [OBJ-07-2]
    prompt: >-
      בשניים-שלושה משפטים, הסבירו מדוע מנוע חום מחזורי חייב לפלוט חום אל מאגר חום קר, באופן
      שאינו נסמך על חיכוך, על דליפות או על תכנון לקוי.
    discussion: >-
      תשובה טובה עוברת דרך תנאי המחזוריות: סגירת המחזור מאלצת את השינוי באנרגיה הפנימית
      להתאפס, ולכן העבודה המסופקת היא בדיוק Q_h - Q_c, וניסוח קלווין אוסר על Q_c = 0 במכונה
      מחזורית. תשובות חזקות יותר מוסיפות את הגרסה הכמותית — היחס Q_c/Q_h = T_c/T_h במנוע הפיך,
      שהוא חיובי משום שטמפרטורות מוחלטות חיוביות — ומציינות שזו הסיבה לכך שהחום הנפלט הוא
      מבני ולא בזבזני. תשובות הטוענות ש"תמיד אובדת קצת אנרגיה" לא הבחינו בין החוק השני לבין
      הנדסה רשלנית, וכדאי ללחוץ עליהן: שאלו מה עושה מנוע מושלם וחסר חיכוך.

  - id: Q-07-10
    type: multiple-choice
    objectives: [OBJ-07-8]
    misconception: slow-means-reversible
    prompt: >-
      כל אחד מן התהליכים האלה מתבצע באיטיות רבה מאוד. את איזה מהם אפשר לעשות הפיך?
    choices:
      - text: גז הנדחס על ידי בוכנה נטולת חיכוך בזמן שהוא במגע עם מאגר חום בטמפרטורה של הגז עצמו.
        correct: true
        feedback: >-
          נכון. התהליך כמו-סטטי, נטול חיכוך, והחום שהגז מוסר אינו חוצה שום הפרש טמפרטורות, ולכן
          כל התנאים מתקיימים: הריצו אותו לאחור, וגם הגז וגם המאגר חוזרים בדיוק למקום שבו היו.
      - text: גוש הנדחף לאט מאוד על פני שולחן מחוספס, כשהחיכוך שלו מחמם את השולחן.
        correct: false
        feedback: >-
          איטיות אינה מסלקת חיכוך. בעדינות רבה ככל שינוע הגוש, העבודה המושקעת כנגד החיכוך
          מסתיימת כחום בשולחן, והשבתה כעבודה בלי שום שינוי אחר הייתה מפרה את ניסוח קלווין.
          איטיות הכרחית להפיכות, אך לעולם אינה מספיקה.
      - text: חום הדולף לאט מאוד דרך קיר עבה מחדר ב-300 קלווין אל האוויר שבחוץ ב-270 קלווין.
        correct: false
        feedback: >-
          הדליפה איטית, אבל החום עדיין חוצה פער של 30 קלווין, ואיטיות אינה מקטינה את הפער.
          שליחת החום הזה בחזרה מ-270 קלווין ל-300 קלווין בלי ששום דבר אחר ישתנה היא בדיוק מה
          שניסוח קלאוזיוס אוסר.
      - text: גז הדולף לאט מאוד דרך חור זעיר אל תא ריק.
        correct: false
        feedback: >-
          זוהי התפשטות חופשית המתבצעת בהדרגה: דבר אינו דוחף בחזרה על הגז, שום עבודה אינה
          מופקת, והאנטרופיה של הגז עולה ב-N k_B ln(V_final/V_initial) בלי שום דבר שהתקבל
          שיסביר זאת. קצב הדליפה אינו משנה דבר מכל זה.

  - id: Q-07-11
    type: numeric
    objectives: [OBJ-07-7]
    prompt: >-
      1000 ג'אול של חום עוברים בהולכה דרך מוט מתכת ממאגר ב-800 קלווין אל מאגר ב-400 קלווין.
      המוט מסיים באותו מצב שבו התחיל. כמה אנטרופיה מיוצרת, בג'אול לקלווין?
    answer: 1.25
    tolerance: 0.02
    feedback: >-
      S_gen = 1000/400 - 1000/800 = 2.50 - 1.25 = 1.25 ג'אול לקלווין: המאגר הקר מרוויח יותר
      אנטרופיה ממה שהחם מפסיד, משום שאותו חום מחולק בטמפרטורה קטנה יותר. אם קיבלתם 1.25-
      החלפתם את הסימנים; אנטרופיה מיוצרת לעולם אינה שלילית. הכפילו ב-T_c ותקבלו את העבודה
      שהושלכה, 500 = 1.25 * 400 ג'אול - בדיוק מה שמנוע קרנו על פני אותו פער היה מספק מאותם
      1000 ג'אול.

  - id: Q-07-12
    type: multiple-choice
    objectives: [OBJ-07-4]
    prompt: >-
      למנוע בנזין (אוטו) מאודיאל אין חיכוך וכל אחד מארבעת הצעדים שלו הפיך, ובכל זאת נצילותו
      נמוכה בהרבה מ-1 - T_min/T_max, כאשר T_min ו-T_max הן הטמפרטורות הקרה והחמה ביותר שהגז
      שלו מגיע אליהן. מדוע?
    choices:
      - text: הוא קולט חום בזמן שהגז שלו עדיין מתחמם, מתחת ל-T_max, ופולט אותו בזמן שהוא מתקרר, מעל T_min.
        correct: true
        feedback: >-
          נכון. חסם קרנו מושג רק אם כל החום נכנס בטמפרטורה העליונה וכולו יוצא בתחתונה. חתכו את
          מחזור אוטו באדיאבטות, וכל פרוסה היא מנוע קרנו קטן הפועל על פני טווח צר יותר מ-T_max
          עד T_min, ולכן המנוע כולו נוחת ב-1 - r^(1-gamma).
      - text: חלק מן העבודה תמיד אובד לחיכוך בבוכנות.
        correct: false
        feedback: >-
          למנוע המאודיאל אין חיכוך מעצם הגדרתו, והוא בכל זאת נופל מן החסם. חיכוך מוריד מנועים
          ממשיים עוד יותר, אבל הוא אינו מה שמפריד בין מחזור אוטו המאודיאל לבין חסם קרנו.
      - text: אוויר אינו גז אידיאלי, ולכן נוסחת קרנו אינה חלה עליו.
        correct: false
        feedback: >-
          חסם קרנו חל על כל חומר עבודה - זו כל הנקודה של משפט קרנו. במודל המאודיאל מתייחסים
          לאוויר כאל גז אידיאלי בכל מקרה, והחוסר עדיין קיים.
      - text: יחס הדחיסה שלו נמוך מדי; ביחס גבוה מספיק הוא היה מגיע לחסם קרנו.
        correct: false
        feedback: >-
          העלאת יחס הדחיסה מעלה את הנצילות, אבל היא גם מעלה את הטמפרטורה שבה החום מתחיל
          להיכנס, והחום עדיין נכנס על פני טווח של טמפרטורות. בכל יחס סופי המנוע נשאר מתחת
          לחסם שבין הקצוות שלו עצמו.

  - id: Q-07-13
    type: numeric
    objectives: [OBJ-07-9]
    prompt: >-
      1.0e23 חלקיקים של גז אידיאלי מכפילים את נפחם בטמפרטורה קבועה של 300 קלווין. קחו
      k_B = 1.381e-23 ג'אול לקלווין. מהו שינוי האנטרופיה של הגז, בג'אול לקלווין?
    answer: 0.957
    tolerance: 0.01
    feedback: >-
      Delta S = N k_B ln 2 = (1.0e23)(1.381e-23)(0.6931) = 0.957 ג'אול לקלווין. הטמפרטורה אינה
      נכנסת, משום שהחום הנבלע הוא N k_B T ln 2 והוא מחולק באותו T. התשובה זהה אם הגז מכפיל את
      נפחו בהתפשטות חופשית אל תוך ריק, שבה לא נבלע חום כלל: אנטרופיה היא פונקציית מצב,
      והאיזותרמה ההפיכה היא רק המכשיר לחישובה.

  - id: Q-07-14
    type: multiple-choice
    objectives: [OBJ-07-9]
    misconception: subsystem-entropy-increase
    prompt: >-
      כוס קפה חם מתקררת על שולחן עד שהיא מגיעה לטמפרטורת החדר, והאנטרופיה שלה יורדת. איזו
      טענה נכונה?
    choices:
      - text: האנטרופיה של החדר עולה ביותר ממה שזו של הקפה יורדת, ולכן האנטרופיה הכוללת עולה.
        correct: true
        feedback: >-
          נכון. החדר מקבל את החום של הקפה בטמפרטורה הנמוכה יותר, ולכן אותו חום מביא לו יותר
          אנטרופיה ממה שהקפה איבד. החוק השני מגביל את הסך הכול; כל חלק אחד רשאי לאבד אנטרופיה
          כל עוד השאר מרוויח יותר.
      - text: החוק השני מופר, אבל רק לזמן קצר, עד שהקפה מגיע לטמפרטורת החדר.
        correct: false
        feedback: >-
          החוק השני אינו מתיר הפרות זמניות. אין כאן דבר שדורש הצדקה: האנטרופיה של הקפה באמת
          יורדת, וזו של החדר עולה ביותר בכל רגע של ההתקררות.
      - text: האנטרופיה של הקפה אינה יכולה לרדת באמת; היא רק נראית כך, משום שחום עוזב אותו.
        correct: false
        feedback: >-
          היא יורדת באמת. עבור גוף בעל קיבול חום C המתקרר מ-T_1 ל-T_2 השינוי הוא C ln(T_2/T_1),
          והוא שלילי. החוק השני מעולם לא אמר שכל חלק חייב להרוויח אנטרופיה.
      - text: האנטרופיה הכוללת אינה משתנה, משום שהחום שהקפה מאבד שווה לחום שהחדר מקבל.
        correct: false
        feedback: >-
          חומים שווים אינם אנטרופיות שוות. שינוי אנטרופיה הוא חום חלקי טמפרטורה, והחדר מקבל את
          החום בטמפרטורה נמוכה מזו שבה הקפה מסר אותו, ולכן הרווח של החדר גדול יותר. ההפרש הוא
          האנטרופיה המיוצרת.
