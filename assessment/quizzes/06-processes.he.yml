module: 06-processes
questions:
  - id: Q-06-1
    type: multiple-choice
    objectives: [OBJ-06-1]
    prompt: >-
      גז אידיאלי מחומם בנפח קבוע, ודגימה זהה שנייה מחוממת בלחץ קבוע לאותה עלייה בטמפרטורה.
      איזו קביעה נכונה?
    choices:
      - text: שתיהן צוברות אותה אנרגיה פנימית, אך השנייה בולעת יותר חום.
        correct: true
        feedback: >-
          נכון. עבור גז אידיאלי האנרגיה הפנימית תלויה בטמפרטורה בלבד, ולכן עליות טמפרטורה שוות
          פירושן שינויים שווים באנרגיה הפנימית. הדגימה שבלחץ קבוע גם דוחפת את הבוכנה החוצה, ועל
          העבודה הזו יש לשלם בחום נוסף — בדיוק N k_B לכל קלווין, וזהו יחס מאייר.
      - text: שתיהן בולעות אותו חום, אך השנייה צוברת יותר אנרגיה פנימית.
        correct: false
        feedback: >-
          שני הגדלים התהפכו כאן. האנרגיה הפנימית נקבעת על ידי הטמפרטורה בלבד, ולכן היא אינה
          יכולה להיות שונה בין שתי דגימות שעלו באותה טמפרטורה. החום אינו נקבע על ידי הטמפרטורה,
          משום שהוא פונקציית מסלול.
      - text: שתיהן בולעות אותו חום וצוברות אותה אנרגיה פנימית, שכן עליית הטמפרטורה זהה.
        correct: false
        feedback: >-
          האנרגיות הפנימיות אכן שוות, ובדיוק מהנימוק הזה. כמויות החום אינן שוות: הדגימה שבלחץ
          קבוע מוציאה חלק מהחום שלה על עבודת התפשטות, ולכן דרוש לה יותר חום כדי להגיע לאותה
          טמפרטורה.
      - text: הראשונה בולעת יותר חום, מפני שבנפח קבוע דבר מן החום אינו מבוזבז על עבודה.
        correct: false
        feedback: >-
          הסימן הפוך. העובדה שאין עבודה פירושה שהדגימה שבנפח קבוע זקוקה לפחות חום כדי להשיג
          עלייה נתונה בטמפרטורה, וזו הסיבה ש-C_V הוא הקטן מבין שני קיבולי החום.

  - id: Q-06-2
    type: multiple-choice
    objectives: [OBJ-06-5]
    misconception: free-expansion-cools
    prompt: >-
      גז אידיאלי ממלא מחצית מקופסה קשיחה ומבודדת בבידוד מושלם; המחצית השנייה ריקה מחומר. המחיצה
      מוסרת. מה קורה לטמפרטורת הגז?
    choices:
      - text: היא אינה משתנה, מפני שלא נכנס ולא יצא חום והגז לא ביצע עבודה על דבר.
        correct: true
        feedback: >-
          נכון. אין על מה לדחוף, ולכן W_on מתאפס; הקופסה מבודדת, ולכן Q מתאפס; מכאן שהאנרגיה
          הפנימית אינה משתנה, ועבור גז אידיאלי הדבר קובע את הטמפרטורה במדויק. הלחץ הסופי קטן
          פי שניים, אבל שום דבר אחר לא זז.
      - text: היא יורדת, מפני שגזים מתפשטים מתקררים.
        correct: false
        feedback: >-
          גזים מתפשטים מתקררים כאשר הם מבצעים עבודה על משהו בעודם מבודדים — פחית תרסיס, חבילת
          אוויר עולה. כאן אין דבר מחוץ לגז שאפשר לדחוף עליו, ולכן שום אנרגיה אינה יוצאת באף אחד
          משני הערוצים. הקירור מעולם לא נגרם מן ההתפשטות; הוא נגרם מן התשלום, וכאן לא שולם דבר.
      - text: היא יורדת, בגורם 2^(-2/3) שהחוק האדיאבטי נותן לגז חד-אטומי.
        correct: false
        feedback: >-
          הגורם הזה מגיע מן הקשר P V^gamma קבוע, שגזירתו מחייבת שלגז יהיה לחץ אחד מוגדר היטב בכל
          רגע. במהלך התפשטות חופשית אין לו לחץ כזה, ולכן החוק אינו חל כאן כלל.
      - text: היא עולה, מפני שלגז יש יותר מקום והמולקולות מאיצות.
        correct: false
        feedback: >-
          דבר אינו מאיץ את המולקולות. מהירויותיהן אינן מושפעות מהסרת מחיצה, וזו בדיוק הסיבה
          שהטמפרטורה אינה זזה לאף אחד משני הכיוונים.

  - id: Q-06-3
    type: multiple-choice
    objectives: [OBJ-06-2, OBJ-06-5]
    misconception: adiabatic-is-pv-gamma
    prompt: >-
      בהתפשטות החופשית שבשאלה הקודמת Q מתאפס, ולכן התהליך אדיאבטי. האם הוא מקיים את הקשר
      P V^gamma קבוע?
    choices:
      - text: לא. הקשר הזה דורש שהתהליך יהיה גם כמו-סטטי וגם אדיאבטי, והתפשטות חופשית אינה כמו-סטטית.
        correct: true
        feedback: >-
          נכון. הגזירה כותבת C_V dT שווה למינוס P dV, וה-P שם הוא הלחץ של הגז עצמו — שקיים רק אם
          הגז נמצא בשיווי משקל לאורך כל הדרך. התפשטות חופשית היא אדיאבטית ואלימה עד מאוד, ולכן
          היא מקיימת דווקא את הקשר P V קבוע, שאינו אלא האיזותרמה.
      - text: כן. אדיאבטי פירושו Q מתאפס, והקשר P V^gamma קבוע הוא מה שנובע מכך.
        correct: false
        feedback: >-
          התאפסות Q היא רק אחת משתי ההנחות שהגזירה משתמשת בהן. השנייה היא שלגז יש לחץ יחיד בכל
          רגע, ובלעדיה אין P שאפשר להציב בתוך P dV — אי אפשר אפילו לכתוב את המשוואה
          הדיפרנציאלית.
      - text: כן, אך רק בקירוב, מפני שההתפשטות מהירה.
        correct: false
        feedback: >-
          זה אינו קירוב שנעשה גרוע יותר ככל שממהרים. ההתפשטות החופשית מקיימת את הקשר P V קבוע
          במדויק, והקשר P V^gamma קבוע היה חוזה לחץ סופי קטן יותר בגורם 2^(-2/3) — טעות של כ-37
          אחוזים, לא סטייה קלה.
      - text: לא, מפני שהתפשטות חופשית אינה אדיאבטית — בהיעדר דפנות אין בידוד.
        correct: false
        feedback: >-
          הקופסה מבודדת, ולכן שום חום אינו חוצה את גבולה והתהליך אדיאבטי לפי כל הגדרה. זה בדיוק
          מה שהופך אותו לדוגמה הנגדית המעניינת: הוא מקיים את התנאי על החום ובכל זאת אינו מקיים
          את הקשר.

  - id: Q-06-4
    type: multiple-choice
    objectives: [OBJ-06-3]
    prompt: >-
      מדוע C_P גדול מ-C_V עבור גז אידיאלי, ובכמה?
    choices:
      - text: מפני שחימום בלחץ קבוע משלם גם על עבודת התפשטות; העודף הוא בדיוק N k_B.
        correct: true
        feedback: >-
          נכון, והעודף מרשים דווקא במה שאינו תלוי בו: לא במספר דרגות החופש, לא בטמפרטורה ולא
          בחומר. זוהי עבודת ההתפשטות לכל קלווין, כלומר P dV שווה ל-N k_B dT לאורך איזובר, ותו
          לא.
      - text: מפני שגז בלחץ קבוע חם יותר, ולגזים חמים יש קיבול חום גדול יותר.
        correct: false
        feedback: >-
          שני קיבולי החום מושווים באותה טמפרטורה. יתרה מזו, עבור גז אידיאלי שניהם אינם תלויים
          בטמפרטורה כלל, ולכן הקביעה על גזים חמים אינה נכונה במסגרת המודל הזה.
      - text: מפני שבלחץ קבוע יש למולקולות יותר מקום לנוע, וכך נוספות דרגות חופש.
        correct: false
        feedback: >-
          דרגות החופש נקבעות על ידי מבנה המולקולה, לא על ידי כמות המקום שיש לה. לגז חד-אטומי יש
          שלוש דרגות חופש של הסעה בכל נפח שהוא.
      - text: מפני שהעודף N k_B מתאר את החום האובד לדפנות המכל.
        correct: false
        feedback: >-
          דבר אינו אובד. האנרגיה העודפת יוצאת אל הסביבה כעבודה שמבצע הגז המתפשט, וזהו ערוץ שונה
          לחלוטין מדליפת חום דרך דופן — יחס מאייר מתקיים במדויק גם עבור מכל מבודד בבידוד מושלם.

  - id: Q-06-5
    type: multiple-choice
    objectives: [OBJ-06-4]
    prompt: >-
      גוש כבד מוטל על בוכנה ודוחס גז מבודד עד שהבוכנה נעצרת. איזה לחץ שייך לאינטגרל העבודה
      W_on שהוא מינוס האינטגרל של P dV?
    choices:
      - text: הלחץ החיצוני הפועל על הגבול, שכאן הוא קבוע וגדול מן הלחץ של הגז עצמו.
        correct: true
        feedback: >-
          נכון. העבודה מבוצעת על הגבול, כנגד מה שהבוכנה דוחפת עליו, ולכן הלחץ החיצוני הוא
          המופיע. רק בתהליך כמו-סטטי השניים שווים — וזה כל תוכנה של המילה כמו-סטטי.
      - text: הלחץ של הגז עצמו, שהרי על הגז אנו מבצעים את העבודה.
        correct: false
        feedback: >-
          הגז אכן מקבל את האנרגיה, אבל הכוח על הגבול נקבע על ידי הגוש ולא על ידי הגז. גרוע מכך,
          במהלך הדחיסה אין לגז לחץ יחיד כלל — הוא צפוף יותר סמוך לבוכנה מאשר בדופן הרחוקה.
      - text: הממוצע של לחצי הגז ההתחלתי והסופי.
        correct: false
        feedback: >-
          הממוצע הזה היה התשובה הנכונה עבור קו ישר במישור P-V שנעברת עליו בצורה כמו-סטטית. כאן
          אין קו שאפשר למצע לאורכו, והלחץ החיצוני הוא מספר שונה באמת משני הקצוות גם יחד.
      - text: אף אחד מהם — עבודה אינה מוגדרת בתהליך בלתי הפיך.
        correct: false
        feedback: >-
          העבודה מוגדרת היטב; זהו כוח הפועל לאורך מרחק על הגבול, ומשקל הגוש ומהלך הבוכנה ניתנים
          שניהם למדידה. מה שאינו מוגדר הוא הלחץ של הגז עצמו במהלך התהליך, ולכן גם השטח מתחת
          לעקומה שאינה קיימת.

  - id: Q-06-6
    type: numeric
    objectives: [OBJ-06-2]
    prompt: >-
      מול אחד של גז אידיאלי חד-אטומי בטמפרטורה של 400 קלווין מתפשט בצורה כמו-סטטית ואדיאבטית
      מ-5.0 ליטר ל-15.0 ליטר. מצאו את הטמפרטורה הסופית בקלווין.
    answer: 192.3
    tolerance: 2.0
    feedback: >-
      השתמשו בקשר T V^(gamma-1) קבוע עם gamma השווה ל-5/3, ולכן T2 שווה ל-T1 כפול (V1/V2)^(2/3),
      כלומר 400 כפול (1/3)^(2/3) שהם 192.3 קלווין. אם קיבלתם 400 קלווין הפעלתם את התנאי
      האיזותרמי במקום זאת; 64 קלווין פירושם שהצבתם gamma במעריך במקום gamma פחות אחד; 133 קלווין
      פירושם שהשתמשתם במעריך אחד, שהוא הקשר האיזוברי V חלקי T קבוע.

  - id: Q-06-7
    type: numeric
    objectives: [OBJ-06-4]
    prompt: >-
      שני מולים של גז אידיאלי בגליל מבודד מתפשטים מ-10.0 ליטר ל-25.0 ליטר כנגד לחץ חיצוני קבוע
      של 1.0e5 פסקל. חשבו את העבודה הנעשית על הגז, ביחידות ג'אול.
    answer: -1500.0
    tolerance: 20.0
    feedback: >-
      W_on שווה למינוס P_ext כפול (V2 פחות V1), כלומר מינוס (1.0e5) כפול (0.025 פחות 0.010) שהם
      מינוס 1500 ג'אול. הסימן שלילי מפני שהגז התפשט וביצע עבודה על סביבתו. שימו לב למה שלא הופיע
      בשום מקום: כמות הגז, הטמפרטורה שלו והלחץ של הגז עצמו. רק הלחץ החיצוני ושינוי הנפח קובעים.

  - id: Q-06-8
    type: multiple-choice
    objectives: [OBJ-06-1, OBJ-06-2]
    prompt: >-
      איזותרמה ואדיאבטה עוברות דרך אותה נקודה במישור P-V. איזו מהן יורדת בתלילות רבה יותר כאשר
      הנפח גדל, ומדוע?
    choices:
      - text: האדיאבטה, בגורם gamma, מפני שלאורכה הגז מידלל ומתקרר בעת ובעונה אחת.
        correct: true
        feedback: >-
          נכון. גזירה נותנת מינוס P חלקי V עבור האיזותרמה ומינוס gamma כפול P חלקי V עבור
          האדיאבטה. לאורך האיזותרמה הלחץ יורד רק מפני שהצפיפות יורדת; לאורך האדיאבטה גם
          הטמפרטורה יורדת, ושתי ההשפעות דוחפות את הלחץ כלפי מטה.
      - text: האיזותרמה, מפני שמאגר מזרים אליה חום ברציפות והדבר תומך בלחץ.
        correct: false
        feedback: >-
          זרימת חום פנימה אכן תומכת בלחץ — ולכן האיזותרמה היא העקומה המתונה יותר, לא התלולה
          יותר. דווקא האדיאבטה, שאין אליה זרימת חום, נופלת מהר יותר.
      - text: לשתיהן אותה שיפוע בנקודה המשותפת; העקומות נפרדות רק בהמשך.
        correct: false
        feedback: >-
          השיפועים בנקודה המשותפת נבדלים בדיוק בגורם gamma, שעבור גז חד-אטומי הוא 5/3. עקומות
          העוברות דרך נקודה משותפת בשיפועים שונים נפרדות מיד.
      - text: האדיאבטה, מפני ש-gamma גדול מאחד והמעריך האדיאבטי מופעל על הטמפרטורה.
        correct: false
        feedback: >-
          המסקנה נכונה והנימוק אינו. המעריך gamma מופיע על הנפח בקשר P V^gamma קבוע; בצורה
          שבטמפרטורה מופיע במקומו gamma פחות אחד. כדאי לתפוס עכשיו תשובה נכונה שהושגה מן המעריך
          הלא נכון.

  - id: Q-06-9
    type: prediction
    objectives: [OBJ-06-1, OBJ-06-4]
    prompt: >-
      לפני החישוב: גז מבודד מכפיל את נפחו בשלוש דרכים — לאט כנגד עומס מותאם, בצעד אחד כנגד עומס
      קבוע קטן יותר, ובאופן חופשי אל תוך ריק. דרגו את שלושתן לפי העבודה שהגז מספק ולפי הטמפרטורה
      הסופית, ונבאו כיצד שני הדירוגים קשורים זה לזה.
    discussion: >-
      העבודה המסופקת: לאט גדול מעומס קבוע גדול מחופשי (0.555, 0.375 ואפס ביחידות של P1 V1 עבור
      גז חד-אטומי). הטמפרטורה הסופית: חופשי (300 קלווין) גדול מעומס קבוע (225 קלווין) גדול מלאט
      (189 קלווין). הדירוגים הפוכים בדיוק, ושורה אחת מסבירה זאת: בשלושתם Q מתאפס, ולכן השינוי
      באנרגיה הפנימית שווה לעבודה הנעשית על הגז. כל ג'אול שנמסר לסביבה הוא ג'אול שנלקח מאנרגיית
      הגז עצמו, ועבור גז אידיאלי האנרגיה הפנימית היא הטמפרטורה. ניבוי שגוי נפוץ הוא שההתפשטות
      החופשית תספק את העבודה הרבה ביותר משום שהיא האלימה ביותר; אלימות אינה עבודה, ובהיעדר משהו
      לדחוף עליו היא אינה מספקת עבודה כלל.

