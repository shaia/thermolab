      חום. כמו-סטטי מגביל את הקצב: לאט מספיק כך שהמערכת עוברת רק דרך מצבי שיווי משקל, ולכן יש לה
      לחץ אחד וטמפרטורה אחת בכל רגע. ההתפשטות החופשית היא אדיאבטית ואינה כמו-סטטית; דחיסה
      איזותרמית איטית באמבט מים היא כמו-סטטית ואינה אדיאבטית. תשובות המתייחסות אל כמו-סטטי כאל
      מילה נרדפת להפיך החמיצו הבחנה נוספת שכדאי לציין: החלקה איטית עם חיכוך היא כמו-סטטית ובכל
      זאת אי אפשר לבטלה, ולכן תהליך הפיך הוא התנאי החזק מבין השניים.
