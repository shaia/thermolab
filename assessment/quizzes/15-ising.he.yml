module: 15-ising
questions:
  - id: Q-15-1
    type: multiple-choice
    objectives: [OBJ-15-1]
    prompt: >-
      האנרגיה של מודל איזינג היא E = -J sum_<ij> s_i s_j - h sum_i s_i עם J > 0. ב-h = 0, איזו
      טענה על הסימטריה שלה ועל פרמטר הסדר m = (1/N) sum_i s_i נכונה?
    choices:
      - text: היפוך כל הספינים משאיר את E ללא שינוי והופך את m, ולכן כל ממוצע קנוני של m מתאפס ב-h = 0 לכל N סופי; מצב מסודר חייב לבחור סימן אחד שהמשוואות אינן מעדיפות.
        correct: true
        feedback: >-
          נכון. האנרגיה של כל קשר תלויה רק במכפלה s_i s_j, ולכן לתאום ההפוך-כולו של כל
          קונפיגורציה יש אותו משקל בולצמן ו-m הפוך. הממוצע על הזוג הוא אפס. סדר מופיע רק
          כשבירת סימטריה ספונטנית: בגבול N -> infinity שדה אינפיניטסימלי בוחר ענף אחד.
      - text: J > 0 מעדיף ספינים שמצביעים למעלה, ולכן מצב היסוד ב-h = 0 הוא כולו למעלה ו-m = +1.
        correct: false
        feedback: >-
          J > 0 מעדיף שכנים *שמסכימים* זה עם זה, לאיזה כיוון שיצביעו. לכולו-למעלה ולכולו-למטה
          יש בדיוק אותה אנרגיה, -2NJ בסריג הריבועי. רק שדה h שובר את השוויון, וב-h = 0 אין
          שדה כזה.
      - text: m מודד את האנרגיה לספין, ולכן הוא אפס בכל פעם ש-E הוא אפס.
        correct: false
        feedback: >-
          m סופר ספינים, לא קשרים. ללוח שחמט של ספינים מתחלפים יש m = 0 והאנרגיה הגבוהה ביותר
          האפשרית, +2NJ; לסריג שכולו למעלה יש m = 1 והאנרגיה הנמוכה ביותר. פרמטר הסדר והאנרגיה
          הם פונקציות שונות של הקונפיגורציה.
      - text: הסימטריה מתקיימת רק מעל T_c; מתחת ל-T_c האנרגיה עצמה מעדיפה סימן אחד.
        correct: false
        feedback: >-
          פונקציית האנרגיה אינה תלויה בטמפרטורה כלל, וסימטריית למעלה-למטה שלה מתקיימת בכל T.
          מה שמשתנה מתחת ל-T_c אינו המשוואות אלא המצב שהמערכת מתייצבת בו.

  - id: Q-15-2
    type: numeric
    objectives: [OBJ-15-2]
    prompt: >-
      סימולציה עם אלגוריתם מטרופוליס מציעה היפוך ספין שיעלה את האנרגיה ב-DeltaE = 4J,
      בטמפרטורה k_B T = 2J. באיזו הסתברות ההיפוך מתקבל?
    answer: 0.135
    tolerance: 0.002
    feedback: >-
      A = min(1, e^(-DeltaE/(k_B T))) = e^(-4J/2J) = e^(-2) = 0.135. מהלך שמוריד את האנרגיה
      היה מתקבל בהסתברות 1. אם ענית 0.0183, השתמשת ב-e^(-4); אם 0.5, חילקת את האנרגיה בשניים
      במקום להעלות אותה במעריך.

  - id: Q-15-3
    type: multiple-choice
    objectives: [OBJ-15-2]
    misconception: mc-is-real-dynamics
    prompt: >-
      סימולציה מדווחת שסריג 64 x 64 שעבר צינון חטוף אל מתחת ל-T_c נזקק לכ-2000 סריקות
      מטרופוליס כדי להסתדר. למה מתאימה סריקה אחת מבחינה פיזיקלית?
    choices:
      - text: לשום דבר קבוע. סריקה היא ניסיון היפוך אחד לכל ספין, יחידה של חישוב; כלל אחר עם אותה התפלגות סטציונרית (גלאובר) מגיע באיטיות שונה לאותו שיווי משקל.
        correct: true
        feedback: >-
          נכון. איזון מפורט קובע לאן השרשרת הולכת, לא כמה מהר. המעבדה מריצה את מטרופוליס ואת
          גלאובר זה לצד זה: אנרגיות שיווי המשקל מסכימות בתוך השגיאה, ועקומות הרלקסציה לא.
          הסדר שבו התחומים נוצרים מרמז על משהו, אבל השעון הוא של האלגוריתם.
      - text: לפיקו-שנייה בערך, הזמן שלוקח לספין ממשי להתהפך; כפלו ב-2000 כדי לקבל את זמן הסידור הממשי.
        correct: false
        feedback: >-
          זו התפיסה השגויה ששיטת מונטה קרלו מדמה את התנועה של המגנט הממשי. שום קבוע פיזיקלי אינו
          ממיר סריקות לשניות: כלל העדכון נבחר כדי לדגום את התפלגות בולצמן, וכלל תקף אחר נותן
          מספר שונה של סריקות לאותה פיזיקה.
      - text: למחזור אחד של תנודות הסריג שנושאות חום אל הספינים.
        correct: false
        feedback: >-
          המודל מתעלם לגמרי מתנודות הסריג; אמבט החום סמוי. שום דבר בשרשרת אינו יודע על פונונים,
          ולכן שום דבר בה אינו יכול להיות מתוזמן על ידם.
      - text: לזמן שלוקח לשדה להתפשט לרוחב הסריג במהירות האור.
        correct: false
        feedback: >-
          שום דבר אינו מתפשט במודל. כל היפוך תלוי רק במצב הנוכחי של שכניו, והסדר שבו האתרים
          נפקדים הוא בחירה חופשית של האלגוריתם.

  - id: Q-15-4
    type: multiple-choice
    objectives: [OBJ-15-3]
    prompt: >-
      מדוע לשרשרת איזינג החד-ממדית אין פאזה מסודרת באף T > 0, בעוד הסריג הריבועי מסתדר
      מתחת ל-2.269 J/k_B?
    choices:
      - text: בממד אחד קיר תחום עולה אנרגיה קבועה 2J אבל יכול לשבת בכל אחד מ-N מקומות, ולכן האנרגיה החופשית שלו 2J - k_B T ln N נעשית שלילית עבור N גדול בכל T > 0; בשני ממדים קיר לרוחב הסריג עולה אנרגיה פרופורציונלית לאורכו, שיכולה לגבור על האנטרופיה שלו ב-T נמוך.
        correct: true
        feedback: >-
          נכון. האנטרופיה גדלה עם המערכת והמחיר של הקיר החד-ממדי לא, ולכן הקירות תמיד מנצחים
          והורסים את הסדר ארוך-הטווח. בשני ממדים האנרגיה והאנטרופיה גדלות שתיהן עם אורך הקיר,
          והאנרגיה מנצחת מתחת לטמפרטורה מסדר גודל של J/k_B.
      - text: הצימוד J חלש יותר בממד אחד.
        correct: false
        feedback: >-
          J הוא אותה אנרגיית קשר בשני המקרים. ההבדל גאומטרי: בממד אחד קשר שבור אחד מפצל את
          המערכת לשתיים, בעוד שבשני ממדים הפיצול דורש שורה שלמה של קשרים שבורים.
      - text: השרשרת כן מסתדרת, אבל בטמפרטורה נמוכה מכדי לדמות אותה.
        correct: false
        feedback: >-
          לפתרון המדויק יש m = 0 בכל T > 0 בשדה אפס: E/(NJ) = -tanh(J/(k_B T)) חלקה לכל
          אורך הדרך למטה. השדה הממוצע מנבא לשרשרת מעבר ב-k_B T = 2J, והניבוי הזה פשוט שגוי.
      - text: בשרשרת יש פחות ספינים, ולכן הפלוקטואציות גדולות יותר.
        correct: false
        feedback: >-
          בשרשרת יכולים להיות כמה ספינים שרוצים; הטיעון עוסק ב-N -> infinity. מה שחשוב הוא
          כיצד המחיר של שבירת הסדר גדל עם המערכת, לא כמה ספינים יש בה.

  - id: Q-15-5
    type: numeric
    objectives: [OBJ-15-4]
    prompt: >-
      תורת השדה הממוצע נותנת k_B T_c = qJ = 4J לסריג הריבועי; התוצאה המדויקת של אונסאגר
      היא 2J/ln(1 + sqrt(2)) = 2.269J. בכמה אחוזים השדה הממוצע מעריך ביתר את T_c?
    answer: 76.3
    tolerance: 0.5
    feedback: >-
      (4 - 2.269)/2.269 = 0.763, הערכת יתר של 76%. השדה הממוצע מחליף כל שכן בממוצע שלו, ובכך
      משליך את המתאמים שליד T_c מכריעים הכול. לשרשרת (q = 2) הוא גרוע יותר מלא מדויק: הוא
      מנבא מעבר ב-2J/k_B במקום שבו אין שום מעבר. אם ענית 43.3, חילקת ב-4 במקום בערך המדויק.

  - id: Q-15-6
    type: numeric
    objectives: [OBJ-15-5]
    prompt: >-
      סריג 32 x 32 מעל T_c, ב-k_B T = 2.5 J, נותן עקבה של המגנוט עם שונות Var(m) = 0.0049.
      בעזרת chi = N Var(m)/(k_B T), ביחידות שבהן J = 1, מהי הסוספטיביליות לספין?
    answer: 2.01
    tolerance: 0.03
    feedback: >-
      N = 32^2 = 1024, ולכן chi = 1024 x 0.0049 / 2.5 = 2.01. זו זהות הפלוקטואציות של מודול
      12: התגובה לשדה היא גודל הפלוקטואציות הספונטניות בלעדיו. אם ענית 0.0628, השתמשת
      ב-N = 32 במקום 32^2.

  - id: Q-15-7
    type: multiple-choice
    objectives: [OBJ-15-6]
    misconception: critical-fastest-settling
    prompt: >-
      סימולציית מטרופוליס של סריג 32 x 32 מורצת ב-k_B T = 1.5 J, 2.27 J ו-3.5 J. באיזו טמפרטורה
      לוקח לעקבת המגנוט הכי הרבה זמן לאבד את המתאם?
    choices:
      - text: ב-2.27 J, ליד T_c -- זמן המתאם העצמי מגיע שם לשיא וגדל עם L (האטה קריטית).
        correct: true
        feedback: >-
          נכון. ב-T_c הסריג הוא טלאים של תחומים מתואמים בכל גודל עד L, וכלל מקומי מסדר מחדש
          תחום בגודל xi בזמן שגדל כמו xi^z עם z קרוב ל-2. המעבדה מודדת tau של |m| של בערך סריקה
          אחת עמוק בכל אחת מהפאזות, ועשרות סריקות ב-T_c.
      - text: ב-2.27 J היא מאבדת את המתאם הכי מהר, כי המערכת נמצאת בין פאזות ואף אחת מהן אינה מעכבת אותה.
        correct: false
        feedback: >-
          זו התפיסה השגויה שמדידת ההאטה מפריכה. להיות בין פאזות פירושו תחומים משני הסימנים בכל
          סקאלה, ותחומים מתואמים גדולים הם הדבר האיטי ביותר שעדכון מקומי יכול לשנות. tau מגיע
          לשיא ב-T_c וממשיך לגדול עם L.
      - text: ב-1.5 J, מפני שהטמפרטורה הנמוכה הופכת היפוכים לנדירים.
        correct: false
        feedback: >-
          היפוכים אכן נדירים עמוק בפאזה המסודרת, אבל ל-|m| כמעט אין מה לעשות: הוא יושב ליד 0.99
          עם פלוקטואציות זעירות ובלתי תלויות, ולכן העקבה שלו מאבדת את המתאם בתוך סריקות
          ספורות.
      - text: ב-3.5 J, מפני שטמפרטורה גבוהה פירושה פלוקטואציות גדולות.
        correct: false
        feedback: >-
          פלוקטואציות גדולות אינן פלוקטואציות איטיות. הרחק מעל T_c הספינים מתואמים רק על פני
          אתרים ספורים, וסריקה או שתיים מערבבות אותם לגמרי.

  - id: Q-15-8
    type: multiple-choice
    objectives: [OBJ-15-6]
    misconception: ensemble-cancellation
    prompt: >-
      דגימה פרומגנטית גדולה אחת מקוררת בשדה אפס אל הרבה מתחת לטמפרטורת קירי שלה. מגנטומטר מודד
      את המגנוט שלה. מה הוא מראה?
    choices:
      - text: ערך קרוב ל-+m_0 או ל--m_0, אחד מהשניים, שנשמר כל עוד מישהו מסתכל -- הממוצע הקנוני הוא אפס, אבל הדגימה אינה מבקרת בשני הענפים.
        correct: true
        feedback: >-
          נכון. כדי להתהפך הדגימה חייבת לעבור דרך קונפיגורציות שיש בהן קיר לרוחבה, שהמחיר שלו
          גדל עם גודלה, ולכן הזמן בין היפוכים גדל אקספוננציאלית עם N. המעבדה מראה זאת: סריג
          8 x 8 ב-2.0 J מתהפך הלוך ושוב; סריג 32 x 32 אינו מתהפך אף פעם במאה אלף סריקות.
      - text: אפס, מפני שמצבי למעלה ולמטה שווי הסתברות ומבטלים זה את זה.
        correct: false
        feedback: >-
          זו התפיסה השגויה שממוצע הצבר הוא הקריאה של דגימה אחת. <m> = 0 היא טענה על מיצוע
          על פני שני הענפים; דגימה מאקרוסקופית אחת יושבת באחד מהם זמן רב יותר מגיל היקום.
      - text: ערך שנסחף לאט בין +m_0 ל--m_0 בזמן שהדגימה מגיעה לשיווי משקל.
        correct: false
        feedback: >-
          היפוכים, כשהם קורים בכלל, הם מעברים חדים בין הענפים, לא סחיפה איטית. לדגימה
          מאקרוסקופית הם אינם קורים בשום זמן שאפשר לצפות בו.
      - text: בדיוק +1, מפני שמתחת ל-T_c כל הספינים מתיישרים.
        correct: false
        feedback: >-
          מתחת ל-T_c המגנוט הספונטני קטן מ-1 בכל T > 0: פלוקטואציות תרמיות הופכות חלק
          מהספינים. ב-2.0 J בסריג הריבועי הוא 0.911.

  - id: Q-15-9
    type: numeric
    objectives: [OBJ-15-7]
    prompt: >-
      לעקבה של 10000 דגימות של |m| יש זמן מתאם עצמי tau = 25 דגימות. באיזה גורם שגיאת התקן
      הנאיבית sigma/sqrt(n) קטנה מדי?
    answer: 7.07
    tolerance: 0.1
    feedback: >-
      N_eff = n/(2 tau) = 10000/50 = 200, ולכן השגיאה הכנה היא sigma/sqrt(200), והשגיאה הנאיבית
      sigma/sqrt(10000) קטנה מדי בגורם sqrt(10000/200) = sqrt(50) = 7.07. אם ענית 5, השתמשת
      ב-sqrt(tau) ושכחת את הגורם 2; אם 50, שכחת את השורש.

  - id: Q-15-10
    type: short-answer
    objectives: [OBJ-15-6, OBJ-15-7]
    prompt: >-
      שיא הסוספטיביליות של סריג ריבועי מדומה יושב ב-2.42 J/k_B עבור L = 16 וב-2.31 J/k_B עבור
      L = 64, ונעשה גבוה יותר עם L. בארבעה או חמישה משפטים: מה זה מבסס לגבי הסריג האינסופי,
      ומה הוא אינו יכול לבסס?
    discussion: >-
      זה מבסס, בתוך פסי השגיאה, שהשיא מתחדד ונע לעבר טמפרטורה נמוכה יותר ככל ש-L גדל, בהתאם
      למעבר ליד 2.269 J/k_B של אונסאגר, ושהמגמה שורדת החלפת זרע כאשר כל נקודה נושאת פס שגיאה
      מתוקן ל-tau. הוא אינו יכול לבסס שקיימת סינגולריות: בכל סריג סופי אורך המתאם חסום על ידי
      L, כל גודל נצפה הוא פונקציה חלקה של T, והשיא סופי. מעבר פאזה אמיתי הוא תכונה של הגבול
      N -> infinity, שאף סימולציה אינה מגיעה אליו; הראיה היא המגמה עם L, כשהיא מפורשת בעזרת
      תאוריה (כאן, סקיילינג בגודל סופי והפתרון המדויק של אונסאגר). תשובה חזקה מציינת גם
      שליד T_c ההאטה הקריטית הופכת את הסריגים הגדולים ביותר לקשים ביותר להבאה לשיווי משקל,
      כך שהנקודות החשובות ביותר הן הפחות ודאיות.
