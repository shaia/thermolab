module: 10-potentials
questions:
  - id: Q-10-1
    type: multiple-choice
    objectives: [OBJ-10-2]
    prompt: >-
      תגובה מתבצעת בכוס פתוחה על שולחן מעבדה, בטמפרטורת החדר ובלחץ האטמוספרה, עד שהיא נעצרת. איזה
      גודל של תכולת הכוס הגיע למינימום שלו?
    choices:
      - text: האנרגיה החופשית של גיבס G = U - TS + PV.
        correct: true
        feedback: >-
          נכון. החדר מחזיק את הטמפרטורה והאטמוספרה מחזיקה את הלחץ, וכאשר T ו-P קבועים החוק
          השני, המופעל על התכולה יחד עם הסביבה שלה, הופך ל-dG <= 0. G הוא הפוטנציאל שהמשתנים
          הטבעיים שלו הם שני הדברים שהשולחן שולט בהם.
      - text: האנרגיה הפנימית U.
        correct: false
        feedback: >-
          U עוברת מינימיזציה רק כאשר האנטרופיה והנפח קבועים, ושום דבר על שולחן אינו מחזיק את
          האנטרופיה קבועה. תגובה הקולטת חום מן החדר מעלה את U ובכל זאת מתבצעת.
      - text: האנרגיה החופשית של הלמהולץ F = U - TS.
        correct: false
        feedback: >-
          F היא הפוטנציאל הנכון כאשר הטמפרטורה והנפח קבועים, כמו בכלי קשיח אטום. כוס פתוחה חופשית
          להתפשט כנגד האטמוספרה, ולכן הנפח אינו קבוע אבל הלחץ קבוע.
      - text: האנתלפיה H = U + PV.
        correct: false
        feedback: >-
          H עוברת מינימיזציה כאשר האנטרופיה והלחץ קבועים, ונשמרת דרך חניקה. בלחץ קבוע היא מנהלת
          את חשבונות החום, ולכן כימאים מתעדים אותה, אבל את השולחן שהטמפרטורה שלו מבוקרת מכריעה G.

  - id: Q-10-2
    type: multiple-choice
    objectives: [OBJ-10-3]
    misconception: systems-minimize-energy
    prompt: >-
      קופסה קשיחה במגע עם אמבט חום ב-300 K מחזיקה גז דחוס משני צידי בוכנה. הבוכנה משוחררת,
      נסחפת ונעצרת. לאחר מכן מתברר שהאנרגיה הפנימית של הגז עלתה ב-282 J. מה נכון?
    choices:
      - text: זה אפשרי. האנרגיה החופשית של הגז ירדה, והאנטרופיה של הגז עלתה יותר ממה שזו של האמבט ירדה.
        correct: true
        feedback: >-
          נכון. כאשר T ו-V קבועים החוק השני, המופעל על הגז יחד עם האמבט, אומר ש-F חייבת לרדת:
          Delta S_total = -Delta F / T >= 0. האמבט סיפק את ה-282 J ואיבד 282/300 J/K של
          אנטרופיה, אבל הגז, בהתפשטותו, הרוויח הרבה יותר. שום דבר אינו מחייב את U לרדת; עבור גז
          שהאטומים שלו נמשכים זה לזה, U עולה כשהם מתרחקים.
      - text: זה בלתי אפשרי. מערכות שנעזבות לנפשן נעות תמיד לעבר האנרגיה הנמוכה ביותר הזמינה.
        correct: false
        feedback: >-
          זו תפיסת השגויה של האנרגיה המינימלית. היא תקפה עבור מערכת מכנית מבודדת עם חיכוך, לא
          עבור מערכת במגע עם אמבט חום. שם מה שיורד הוא F = U - TS; האמבט יכול לשלם עבור עלייה
          ב-U כל עוד האנטרופיה הכוללת של הגז ושל האמבט עדיין עולה.
      - text: זה אפשרי רק אם משהו מבחוץ ביצע עבודה על הגז.
        correct: false
        feedback: >-
          הקופסה קשיחה ושום דבר מבחוץ לא דחף שום דבר. ה-282 J הגיעו כחום מן האמבט, ונשאבו פנימה
          משום שהסידור מחדש של הגז העלה את האנטרופיה הכוללת.
      - text: זה אפשרי, אבל אז האנטרופיה הכוללת של הגז ושל האמבט חייבת לרדת.
        correct: false
        feedback: >-
          שינוי ספונטני אינו יכול להוריד את האנטרופיה הכוללת. כאן היא עלתה, כפי ש-Delta S_total = -Delta F / T אומר: הרווח
          באנטרופיה של הגז גבר על ההפסד של האמבט, 282/300 J/K.

  - id: Q-10-3
    type: multiple-choice
    objectives: [OBJ-10-7]
    prompt: >-
      גז זורם בזרימה יציבה דרך פקק נקבובי בצינור מבודד, מלחץ גבוה ללחץ נמוך. מה מן הבאים זהה
      משני צידי הפקק, עבור כל גז?
    choices:
      - text: האנתלפיה H = U + PV של כל מנה של גז.
        correct: true
        feedback: >-
          נכון. הגז שמאחורי המנה דוחף אותה פנימה ומבצע עליה עבודה P_in V_in; המנה דוחפת את הגז
          שלפניה ומבצעת P_out V_out; שום חום אינו חוצה את הבידוד. לכן U_out - U_in =
          P_in V_in - P_out V_out, כלומר H_out = H_in.
      - text: האנרגיה הפנימית U, משום שאנרגיה נשמרת.
        correct: false
        feedback: >-
          האנרגיה נשמרת, אבל האנרגיה של המנה עצמה אינה נשמרת, משום שנעשית עליה עבודה בכניסה
          והיא מבצעת עבודה ביציאה, והשתיים אינן שוות. גז ואן דר ואלס הנחנק מ-50 bar ל-1 bar
          ב-300 K מרוויח כ-50 J למול של אנרגיה פנימית בזמן שהוא מתקרר.
      - text: הטמפרטורה, משום שהצינור מבודד.
        correct: false
        feedback: >-
          רק גז אידיאלי, שהאנתלפיה שלו תלויה ב-T בלבד, יוצא בטמפרטורה שבה נכנס. גזים ממשיים מתחת
          לטמפרטורת ההיפוך שלהם מתקררים, וכך מנזילים אוויר.
      - text: האנטרופיה, משום ששום חום אינו זורם.
        correct: false
        feedback: >-
          חניקה היא תהליך בלתי הפיך: הגז מתפשט דרך הפקק בלי לבצע עבודה מועילה, והאנטרופיה שלו
          עולה. שום חום אינו זורם, אבל אנטרופיה מיוצרת.

  - id: Q-10-4
    type: numeric
    objectives: [OBJ-10-5]
    prompt: >-
      מד לחץ ומדחום על 0.100 mol של גז מראים שבכל נפח בין V ל-2V, הלחץ עולה עם הטמפרטורה בנפח
      קבוע כ-(dP/dT)_V = nR/V, כאשר R = 8.314 J/(mol K). מהו שינוי האנטרופיה כשהגז מכפיל את
      נפחו בטמפרטורה קבועה, ב-J/K?
    answer: 0.5763
    tolerance: 0.01
    feedback: >-
      יחס מקסוול מתוך F הופך את השיפוע הנמדד לשיפוע של אנטרופיה: (dS/dV)_T = (dP/dT)_V = nR/V.
      אינטגרציה מ-V עד 2V נותנת Delta S = nR ln 2 = 0.100 x 8.314 x 0.6931 = 0.576 J/K. שום
      דבר במדידה לא קרא אנטרופיה. אם קיבלתם 0.831 השמטתם את ה-ln 2; אם קיבלתם אפס הנחתם
      ששינוי האנטרופיה האיזותרמי של גז מתאפס משום שהאנרגיה שלו אינה משתנה.

  - id: Q-10-5
    type: multiple-choice
    objectives: [OBJ-10-4]
    prompt: >-
      החל מ-dG = -S dT + V dP כאשר N קבוע, איזה יחס מקסוול נובע?
    choices:
      - text: (dS/dP)_T = -(dV/dT)_P
        correct: true
        feedback: >-
          נכון. ב-dG = -S dT + V dP המקדמים של dT ושל dP הם המינוס של S ו-V, והנגזרות המעורבות
          של G מסכימות: הנגזרת של המקדם הראשון לפי P כאשר T קבועה שווה לנגזרת של V לפי T כאשר P קבוע. העברת סימן המינוס לאגף השני
          נותנת את היחס. עבור גז אידיאלי הוא אומר ש-(dS/dP)_T = -N k_B / P: האנטרופיה יורדת כשהגז
          נדחס בטמפרטורה קבועה.
      - text: (dS/dP)_T = (dV/dT)_P
        correct: false
        feedback: >-
          הסימן אבד. ב-dG = -S dT + V dP המקדם של dT הוא המינוס של S, והגזירה שלו שומרת את המינוס. בדקו על גז
          אידיאלי: דחיסה בטמפרטורה קבועה מורידה את S, בעוד שחימום בלחץ קבוע מעלה את V, ולכן
          לשני האגפים חייבים להיות סימנים הפוכים.
      - text: (dS/dV)_T = (dP/dT)_V
        correct: false
        feedback: >-
          זהו יחס מקסוול נכון, אבל הוא בא מ-F, שהמשתנים הטבעיים שלה הם T ו-V. המשתנים הטבעיים של G
          הם T ו-P, ולכן היחס שלה כולל נגזרות לפי P כאשר T קבועה ולפי T כאשר P קבוע.
      - text: (dT/dP)_S = (dV/dS)_P
        correct: false
        feedback: >-
          זהו יחס מקסוול מתוך H, שהמשתנים הטבעיים שלה הם S ו-P. המשתנים המוחזקים קבועים אומרים
          לכם מאיזה פוטנציאל בא יחס.

  - id: Q-10-6
    type: multiple-choice
    objectives: [OBJ-10-1]
    misconception: free-energy-stored-energy
    prompt: >-
      שני צילינדרים מחזיקים כל אחד מול אחד של ארגון ב-300 K, האחד ב-1 L והשני ב-10 L. האנרגיות
      הפנימיות שלהם שוות. בחדר ב-300 K, איזה מהם יכול לספק יותר עבודה, ובכמה?
    choices:
      - text: הצילינדר של 1 L, בעד RT ln 10, כ-5.7 kJ, אף שהשניים מחזיקים אותה אנרגיה.
        correct: true
        feedback: >-
          נכון. בטמפרטורה קבועה העבודה המרבית שמערכת יכולה לספק היא הירידה באנרגיה החופשית שלה,
          ו-F = U - TS שונה בין השניים ב-T כפול הפרש האנטרופיות שלהם, RT ln 10. האנרגיה שהוא
          מספק נשאבת מן החדר כחום בזמן שהגז מתפשט; האנרגיה של הגז עצמו לעולם אינה משתנה.
      - text: אף אחד. הם מחזיקים אותה אנרגיה פנימית, ולכן הם מחזיקים אותה אנרגיה חופשית לבזבז.
        correct: false
        feedback: >-
          זה מתייחס לאנרגיה חופשית כאל סוג של אנרגיה האגורה בתוך הגז. היא אינה כזו: F = U - TS
          תלויה גם באנטרופיה, ולגז הדחוס יש פחות ממנה. אנרגיות שוות, אנרגיות חופשיות לא שוות,
          עבודה לא שווה.
      - text: הצילינדר של 10 L, משום שיש לו יותר נפח לדחוף כנגד בוכנה.
        correct: false
        feedback: >-
          הגז של 10 L נמצא בעשירית הלחץ. העבודה שגז יכול לספק בדרכו לשיווי משקל עם הסביבה שלו
          באה מן האנרגיה החופשית שלו, שהיא גבוהה יותר, לא נמוכה יותר, עבור הדחוס.
      - text: אי אפשר להכריע בלי לדעת ממה עשויים הצילינדרים.
        correct: false
        feedback: >-
          הצילינדרים רק מחזיקים את הגז. העבודה הזמינה ב-300 K תלויה במצב הגז דרך F, ושני המצבים
          מוגדרים במלואם.

  - id: Q-10-7
    type: short-answer
    objectives: [OBJ-10-6]
    prompt: >-
      בשניים או שלושה משפטים: U(S) כאשר V ו-N קבועים מוחלפת ב-F(T), נקודת החיתוך של הישר המשיק
      שלה כפונקציה של שיפוע המשיק. מדוע F(T) יודעת כל מה ש-U(S) ידעה?
    discussion: >-
      משום ש-U(S) קמורה ממש, כל שיפוע T נוגע בעקומה בנקודה אחת בדיוק, ולכן משפחת הישרים המשיקים
      -- אחד לכל T, כל אחד נקבע על ידי השיפוע שלו T ונקודת החיתוך שלו F(T) -- נמצאת בהתאמה
      חד-חד-ערכית עם הנקודות של העקומה. העקומה היא המעטפת של המשפחה הזו, ולכן אפשר לבנות אותה
      מחדש מ-F(T) בלבד: S = -dF/dT נותן את הנקודה שבה כל משיק נוגע, ו-U = F + TS את הגובה שלה.
      תשובה קפדנית מציינת את הקמירות כתנאי; אילו שתי נקודות חלקו שיפוע, ההתמרה לא הייתה יכולה
      לומר לאיזו מהן היא מתכוונת.

  - id: Q-10-8
    type: numeric
    objectives: [OBJ-10-7, OBJ-10-1]
    misconception: enthalpy-heat-content
    prompt: >-
      גז מוחזק בלחץ קבוע של 1.00e5 Pa. האנרגיה הפנימית שלו עולה ב-1247 J והנפח שלו ב-8.31e-3 m^3.
      חלק מן האנרגיה הגיע כ-500 J של עבודה חשמלית, מתיל חימום הנחשב לחלק מן המערכת. כמה חום Q
      חצה את הגבול, בג'אולים?
    answer: 1578
    tolerance: 5
    feedback: >-
      שינוי האנתלפיה הוא Delta H = Delta U + P Delta V = 1247 + 831 = 2078 J. אילו העבודה היחידה
      הייתה P dV, Q היה שווה ל-Delta H; כאן נעשו על המערכת גם 500 J של עבודה חשמלית, ולכן
      Q = Delta H - W_elec = 2078 - 500 = 1578 J. אם עניתם 2078 J, לקחתם את Delta H כחום: זה
      תקף רק בלחץ קבוע כשאין עבודה פרט ל-P dV.

  - id: Q-10-9
    type: prediction
    objectives: [OBJ-10-4, OBJ-10-5]
    prompt: >-
      מתחו גומייה במהירות ונגעו בה בשפה: היא מרגישה חמה. לפני הניתוח של הגומייה במעבדה, נבאו
      (א) את הסימן של (dS/dL)_T, (ב) האם המתיחות באורך קבוע עולה או יורדת כשהגומייה מתחממת,
      ו-(ג) מה עושה גומייה שמשקולת תלויה עליה כשמחממים אותה במייבש שיער.
    discussion: >-
      (א) שלילי: מתיחה בטמפרטורה קבועה מורידה את האנטרופיה של הגומייה, משום שהמולקולות הארוכות
      נמשכות מתוך הסידורים המסובכים שלהן. מבחן השפה אומר זאת ישירות -- כשהיא נמתחת מהר, בלי זמן
      לחום לצאת, האנטרופיה נשארת קבועה, ולכן הסידורים שאבדו חייבים להתפצות ברטט מהיר יותר, שהוא
      טמפרטורה גבוהה יותר. (ב) יחס מקסוול (dS/dL)_T = -(df/dT)_L הופך שיפוע אנטרופיה שלילי
      לשיפוע טמפרטורה חיובי: המתיחות עולה כשהגומייה מתחממת, כ-5.8 mN/K בנתוני המעבדה. (ג) היא
      מתכווצת ומרימה את המשקולת -- ההפך מכמעט כל חומר אחר. אם ניבאתם התארכות, הסקתם ממוצקים
      רגילים, שהמתיחות שלהם באה מאנרגיות של קשרים; כ-85 אחוזים מזו של גומייה באים מאנטרופיה.

  - id: Q-10-10
    type: multiple-choice
    objectives: [OBJ-10-3]
    prompt: >-
      מול אחד של גז אידיאלי ב-300 K מתפשט כנגד בוכנה מ-10 L ל-20 L, במגע עם אמבט ב-300 K לאורך
      כל הדרך. מהי העבודה המרבית שהוא יכול לספק?
    choices:
      - text: RT ln 2, כ-1.73 kJ -- הירידה באנרגיה החופשית שלו.
        correct: true
        feedback: >-
          נכון. בטמפרטורה קבועה העבודה הנעשית על המערכת היא לפחות Delta F, ולכן העבודה שהיא
          יכולה לספק היא לכל היותר W_max = -Delta F = RT ln 2. מגיעים אליה בהתפשטות איטית והפיכה, וכל
          ג'אול ממנה בא מחום הנשאב מן האמבט.
      - text: אפס, משום שהאנרגיה הפנימית של הגז אינה משתנה.
        correct: false
        feedback: >-
          האנרגיה של הגז אינה משתנה, אבל האמבט מספק חום בזמן שהגז מתפשט. מה שמגביל את העבודה הוא
          האנרגיה החופשית, לא האנרגיה הפנימית.
      - text: P V בהתחלה, כ-2.49 kJ.
        correct: false
        feedback: >-
          זה היה דורש שהלחץ יישאר בערכו ההתחלתי לאורך כל ההתפשטות. בטמפרטורה קבועה הלחץ יורד
          ככל שהנפח גדל, והשטח מתחת לאיזותרמה הוא RT ln 2.
      - text: היא בלתי מוגבלת, משום שהאמבט יכול לספק כל כמות של חום.
        correct: false
        feedback: >-
          האמבט יכול לספק חום, אבל החוק השני מגביל כמה ממנו הופך לעבודה בזמן שרק הגז הזה משנה את
          מצבו: הגבול הוא W_max = -Delta F.

  - id: Q-10-11
    type: multiple-choice
    objectives: [OBJ-10-6]
    prompt: >-
      נניח של-F(V) של חומר, בטמפרטורה קבועה כלשהי, היה קטע שבו היא מתעקמת לכיוון הלא נכון, כך
      שהשיפוע dF/dV = -P לא היה מונוטוני שם. מה קורה להתמרת לז'נדר שלה G(P)?
    choices:
      - text: כמה נפחים חולקים לחץ אחד, ולכן G(P) מתקפלת על עצמה ואינה יכולה לומר לאיזה מצב היא מתכוונת.
        correct: true
        feedback: >-
          נכון. שיפוע מציין נקודה אחת רק במקום שבו העקומה קמורה ממש. לאורך השקע, שלושה משיקים
          חולקים כל שיפוע, וההתמרה משרטטת שלושה ענפים על פני תחום אחד של לחצים. המידע לא אבד;
          היכולת לבחור מצב אחד אבדה. מודול 14 פותר את הקפל, ומתברר שהוא שתי פאזות בדו-קיום.
      - text: שום דבר אינו משתנה; התמרת לז'נדר עובדת עבור כל פונקציה חלקה.
        correct: false
        feedback: >-
          אפשר לחשב אותה עבור כל פונקציה חלקה, אבל בלי קמירות היא מאבדת את ההפיכה שלה: השיפוע
          כבר אינו מציין נקודה יחידה, ולכן אי אפשר לבנות את F(V) מחדש מתוך G(P).
      - text: G(P) נעשית שלילית.
        correct: false
        feedback: >-
          הסימן של G אינו מה שמשתבש; G היא בדרך כלל שלילית עבור גז בכל מקרה. מה שמשתבש הוא שלחץ
          אחד כבר אינו בוחר מצב אחד.
      - text: ההתמרה מפסיקה להתקיים, משום שהנגזרת נעשית לא מוגדרת.
        correct: false
        feedback: >-
          הנגזרת מוגדרת היטב לאורך השקע; היא רק עולה ויורדת במקום לעלות בהתמדה. ההתמרה קיימת,
          אבל היא רב-ערכית.

  - id: Q-10-12
    type: multiple-choice
    objectives: [OBJ-10-2, OBJ-10-1]
    prompt: >-
      עבור גז אידיאלי חד-אטומי U = (3/2) N k_B T. מדוע U הנכתבת כפונקציה של T ו-V אינה תיאור
      שלם כמו U הנכתבת כפונקציה של S ו-V?
    choices:
      - text: היא אינה תלויה ב-V כלל, ולכן אינה יכולה לתת את הלחץ, ש-U(S, V) נותנת כ-P = -dU/dV.
        correct: true
        feedback: >-
          נכון. הצבת השיפוע T במקום S משליכה מידע: לכל גז שהאנרגיה שלו היא (3/2) N k_B T יש אותה
          U(T, V), יהיה הלחץ שלו אשר יהיה. התמרת לז'נדר אל F = U - TS שומרת אותו, משום שהשיפוע
          של F לפי הנפח הוא dF/dV = -P.
      - text: היא שלמה; T ו-V הם פשוט זוג נוח יותר מ-S ו-V.
        correct: false
        feedback: >-
          נוח, כן, אבל לא שלם: מתוך U(T, V) = (3/2) N k_B T שום כמות של גזירה אינה משחזרת את
          הלחץ. הפונקציה השלמה של T ו-V היא F, לא U.
      - text: היא חסרה רק משום שהיא מתעלמת מן הפוטנציאל הכימי.
        correct: false
        feedback: >-
          כש-N מוחזק קבוע, לפוטנציאל הכימי אין כל תפקיד. הבעיה קיימת כבר כש-N קבוע: U(T, V) אינה
          יכולה לתת את P.
      - text: היא חסרה משום שאי אפשר למדוד את T ישירות.
        correct: false
        feedback: >-
          T הוא הקל מכל המשתנים למדידה. הבעיה אינה מדידה אלא מידע: הפונקציה U(T, V) איבדה את
          מה שהפונקציה U(S, V) הכילה.
