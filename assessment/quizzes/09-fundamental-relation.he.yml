module: 09-fundamental-relation
questions:
  - id: Q-09-1
    type: multiple-choice
    objectives: [OBJ-09-1]
    prompt: >-
      המודול הזה יוצא מארבע תכונות של האנטרופיה כנקודת מוצא. איזו מן הבאות היא תכונה שמודול 08
      כבר הוכיח מתוך מנייה, ולא תכונה שהמודול הזה פשוט מניח?
    choices:
      - text: האנטרופיות של תת-מערכות בלתי תלויות מתחברות, משום שריבויי המצבים שלהן מוכפלים והלוגריתם הופך מכפלה לסכום.
        correct: true
        feedback: >-
          נכון. בהינתן S = k_B ln Omega ותת-מערכות בלתי תלויות, האדיטיביות היא משפט:
          Omega_AB = Omega_A Omega_B, ולכן S_AB = S_A + S_B. הנחות היסוד מונות אותה בכל זאת,
          משום שהטיעון התרמודינמי צריך לעמוד בזכות עצמו, מאיזו בנייה של S שלא התחלתם.
      - text: משטח האנטרופיה קעור בכל כיוון.
        correct: false
        feedback: >-
          הקעירות היא הנחת היסוד היחידה שלא מודול 07 ולא מודול 08 ביססו. היא מונחת כאן, ותוכנה
          הוא יציבות: S קעורה פירושה קיבול חום חיובי. כוכבים מפרים אותה, ולכן היא אינה יכולה
          להיות משפט על כל החומר.
      - text: האנטרופיה אקסטנסיבית במדויק בכל גודל של מערכת.
        correct: false
        feedback: >-
          מודול 08 מדד את ההפך: k_B ln Omega אקסטנסיבית רק בגבול של N גדול, עם תיקוני ln N
          שלעולם אינם נעלמים במדויק. הנחת היסוד לוקחת את הגבול כנתון, וזו הנחה, לא דבר ש-08
          הוכיח.
      - text: טמפרטורת שיווי המשקל היא הממוצע של הטמפרטורות ההתחלתיות, משוקלל לפי קיבולי החום.
        correct: false
        feedback: >-
          זו התוצאה של מודול 01 משימור האנרגיה, ולא תכונה של פונקציית האנטרופיה כלל. המודול
          הזה מסביר מדוע הזרימה נעצרת שם; הוא אינו לוקח זאת כהנחת יסוד.

  - id: Q-09-2
    type: multiple-choice
    objectives: [OBJ-09-3]
    misconception: equal-energy-equilibrium
    prompt: >-
      גוש נחושת חם במסה 2 ק"ג וגוש נחושת קר במסה 0.2 ק"ג נלחצים זה אל זה ומבודדים מכל דבר
      אחר. מה נכון לאחר שהם מפסיקים להשתנות?
    choices:
      - text: הטמפרטורות שלהם שוות, והגוש הגדול מחזיק בערך פי עשרה מן האנרגיה של הגוש הקטן.
        correct: true
        feedback: >-
          נכון. מקסום האנטרופיה הכוללת משווה את השיפועים dS/dU של שני הגושים, והשיפוע הזה
          הוא 1/T. דבר אינו קושר שיפוע לגודל, ולכן האנרגיות מסתיימות ביחס שבין קיבולי החום,
          כאן 10 : 1.
      - text: האנרגיות שלהם שוות, משום ששיווי משקל מחלק את האנרגיה באופן שווה.
        correct: false
        feedback: >-
          זו תפיסת האנרגיות השוות השגויה. מה ששיווי המשקל ממקסם הוא האנטרופיה הכוללת, ובמקסימום
          משתווים שני השיפועים של S(U), לא שתי האנרגיות. חלוק אבן שנזרק לאגם מסיים בטמפרטורה
          של האגם כשהוא מחזיק כמעט דבר מן האנרגיה.
      - text: הטמפרטורות שלהם שוות וגם האנרגיות שלהם שוות, משום שכל אחד מהשוויונות נובע מן השני.
        correct: false
        feedback: >-
          טמפרטורות שוות גוררות אנרגיות שוות רק עבור שני גופים זהים. עבור גופים בגדלים שונים,
          אותה טמפרטורה פירושה אנרגיות שונות, ביחס לקיבולי החום שלהם.
      - text: שום דבר אינו שווה; הזרימה נעצרת כאשר האנטרופיה של כל גוש בנפרד מפסיקה לעלות.
        correct: false
        feedback: >-
          האנטרופיה של הגוש החם יורדת כל הזמן, ולכן המתנה לכך שהאנטרופיה של כל גוש תפסיק לעלות
          אינה מובילה לשום דבר. מה שמפסיק לעלות הוא הסך הכולל, והוא מגיע לשיאו בדיוק במקום
          שבו הטמפרטורות משתוות.

  - id: Q-09-3
    type: numeric
    objectives: [OBJ-09-2]
    prompt: >-
      טבלה של האנטרופיה של מערכת בנפח קבוע ובמספר חלקיקים קבוע נותנת S = 2.3400 J/K
      עבור U = 99.0 J, ו-S = 2.3466 J/K עבור U = 101.0 J. אמדו את הטמפרטורה של המערכת
      עבור U = 100 J, בקלווין.
    answer: 303.0
    tolerance: 3.0
    feedback: >-
      השיפוע הוא dS/dU = (2.3466 - 2.3400) / (101.0 - 99.0) = 0.0033 K^-1, והשיפוע הזה
      הוא 1/T, ולכן T = 1/0.0033 = 303 K. הפרש מרכזי כמו זה מדויק עד סדר שני בגודל הצעד. אם
      קיבלתם 0.0033 עצרתם בשיפוע; אם קיבלתם בערך 7 חילקתם את S ב-U, וזו אינה נגזרת.

  - id: Q-09-4
    type: multiple-choice
    objectives: [OBJ-09-3]
    prompt: >-
      לשתי מערכות יש דופן משותפת מוליכת חום. ברגע זה, השיפוע dS_1/dU_1 של מערכת 1 גדול
      מן השיפוע dS_2/dU_2 של מערכת 2. לאיזה כיוון זורמת האנרגיה?
    choices:
      - text: אל מערכת 1, שהיא הקרה מבין השתיים.
        correct: true
        feedback: >-
          נכון. העברת dU אל מערכת 1 משנה את האנטרופיה הכוללת בשיעור (dS_1/dU_1 - dS_2/dU_2) dU,
          שהוא חיובי, ולכן ההעברה מועדפת. שיפוע גדול יותר הוא 1/T גדול יותר, כלומר טמפרטורה
          נמוכה יותר: חום זורם אל הגוף הקר יותר משום שכך עולה האנטרופיה הכוללת.
      - text: אל מערכת 2, משום ששיפוע תלול יותר פירושו גוף חם יותר.
        correct: false
        feedback: >-
          השיפוע הוא 1/T, ולכן תלול יותר פירושו קר יותר, לא חם יותר. בדקו לפי הסימן של שינוי
          האנטרופיה: העברת אנרגיה אל מערכת 2 מורידה כאן את האנטרופיה הכוללת.
      - text: לשום מקום; אנרגיה זורמת רק כאשר האנרגיות שונות, לא השיפועים.
        correct: false
        feedback: >-
          אנרגיה ממשיכה לזרום עד שהשיפועים משתווים, יהיו האנרגיות אשר יהיו. שני גופים בעלי
          אנרגיות שונות מאוד יכולים להיות בשיווי משקל, ושניים בעלי אנרגיה שווה אינם חייבים להיות.
      - text: אי אפשר להכריע בלי לדעת את שני קיבולי החום.
        correct: false
        feedback: >-
          קיבולי החום קובעים כמה תזוז כל טמפרטורה, ולכן היכן הזרימה נעצרת. הכיוון נקבע על ידי
          השיפועים בלבד.

  - id: Q-09-5
    type: numeric
    objectives: [OBJ-09-4]
    prompt: >-
      עבור מערכת חד-רכיבית כלשהי, T = 300 K, S = 150 J/K, P = 1.00e5 Pa, V = 0.0250 m^3,
      והמכפלה mu N = -40000 J. השתמשו ביחס אוילר כדי למצוא את האנרגיה הפנימית U,
      בג'אול.
    answer: 2500
    tolerance: 20
    feedback: >-
      U = T S - P V + mu N = 45000 - 2500 - 40000 = 2500 J. שימו לב לשני הסימנים: האיבר PV
      נכנס עם מינוס, ו-mu N עצמו שלילי כאן. יחס אוילר אינו זקוק לדבר מלבד אקסטנסיביות, ולכן
      המספרים האלה עקביים עם כל מערכת אקסטנסיבית.

  - id: Q-09-6
    type: multiple-choice
    objectives: [OBJ-09-4]
    prompt: >-
      הטמפרטורה של מערכת חד-רכיבית משתנה ב-dT והלחץ שלה ב-dP. האם הפוטנציאל הכימי שלה יכול
      להשתנות בכל שיעור שתרצו?
    choices:
      - text: "לא. יחס גיבס–דוהם קובע אותו: dmu = (V dP - S dT) / N."
        correct: true
        feedback: >-
          נכון. S dT - V dP + N dmu = 0 אינו משאיר שום חופש: מבין שלושת המשתנים האינטנסיביים,
          רק שניים ניתנים לבחירה. זו הסיבה שברגע ששתי תת-מערכות של אותו חומר מסכימות על T ועל
          P, הן מסכימות באופן אוטומטי גם על mu.
      - text: כן. T, P ו-mu הם שלושה משתני מצב בלתי תלויים.
        correct: false
        feedback: >-
          הם נראים בלתי תלויים, אבל האקסטנסיביות קושרת אותם זה לזה דרך יחס גיבס–דוהם. לפאזה
          יחידה יש רק שני משתנים אינטנסיביים בלתי תלויים.
      - text: רק אם המערכת היא גז אידיאלי; אחרת הוא חופשי.
        correct: false
        feedback: >-
          יחס גיבס–דוהם אינו משתמש בשום דבר הנוגע לגז האידיאלי. הוא נובע מיחס אוילר, שזקוק
          לאקסטנסיביות בלבד, ולכן הוא תקף לכל חומר.
      - text: כן, אבל רק אם מותר גם ל-N להשתנות.
        correct: false
        feedback: >-
          היחס מערב את N עצמו, לא את dN; שינוי כמות החומר ב-T וב-P קבועים אינו משנה שום דבר
          אינטנסיבי. mu נקבע על ידי T ו-P בכל מקרה.

  - id: Q-09-7
    type: multiple-choice
    objectives: [OBJ-09-5]
    prompt: >-
      נניח שהאנטרופיה S(U) של חומר מסוים מתעקמת כלפי מעלה בתחום אנרגיות כלשהו. שתי חתיכות
      זהות שלו, בתחום הזה ובאותה טמפרטורה, מובאות למגע. מה קורה?
    choices:
      - text: כל העברה קטנה של אנרגיה ביניהן מעלה את האנטרופיה הכוללת ומתעצמת, כך שהחתיכות בורחות לחתיכה חמה ולחתיכה קרה.
        correct: true
        feedback: >-
          נכון. על עקומה קמורה המיתר נמצא מעל העקומה, ולכן S(U + delta) + S(U - delta) עולה על
          2 S(U): כל פלוקטואציה מתוגמלת. באופן שקול, קיבול החום שלילי, והחתיכה שמאבדת אנרגיה
          מתחממת. כוכב הוא מערכת כזו.
      - text: שום דבר נצפה; הן נשארות בשיווי משקל, משום שהטמפרטורות שלהן שוות.
        correct: false
        feedback: >-
          טמפרטורות שוות הופכות את החלוקה השווה לנקודה סטציונרית של S_total, אבל על עקומה
          קמורה זו נקודת מינימום, לא מקסימום. כל פלוקטואציה מרחיקה את הזוג ממנה, ושום דבר אינו
          מחזיר אותו.
      - text: הן נשארות בטמפרטורות שוות, אבל האנרגיות שלהן מתנודדות הלוך ושוב לעד.
        correct: false
        feedback: >-
          תנודה הייתה דורשת נטייה מחזירה, ואנטרופיה קמורה מספקת את ההפך: כל סטייה מן החלוקה
          השווה מעלה את האנטרופיה הכוללת עוד יותר.
      - text: החומר היה חייב להיות בטמפרטורה מוחלטת שלילית.
        correct: false
        feedback: >-
          השיפוע יכול להיות חיובי בזמן שהעקמומיות חיובית, כפי שקורה בכוכב. מה ש-S קמורה נותנת
          הוא קיבול חום שלילי, לא טמפרטורה שלילית.

  - id: Q-09-8
    type: numeric
    objectives: [OBJ-09-6]
    prompt: >-
      קילוגרם אחד של מים בטמפרטורה 350 קלווין מעורבב עם קילוגרם אחד של מים בטמפרטורה 290 קלווין
      בכלי מבודד. קחו את החום הסגולי כ-4184 J/(kg K). חשבו את האנטרופיה הכוללת המיוצרת,
      ביחידות J/K.
    answer: 36.94
    tolerance: 0.5
    feedback: >-
      T_eq = 320 K. Delta S_total = 4184 ln(320/350) + 4184 ln(320/290) = -374.9 + 411.9 =
      36.9 J/K. האנטרופיה של המים החמים ירדה, ושל המים הקרים עלתה ביותר. אם קיבלתם אפס,
      הנחתם שהחום Q נשא החוצה ופנימה אנטרופיה שווה, אבל הוא יצא בטמפרטורה גבוהה מזו שבה
      הגיע: Q/T_hot קטן מ-Q/T_cold.

  - id: Q-09-9
    type: multiple-choice
    objectives: [OBJ-09-6]
    misconception: entropy-flow-is-production
    prompt: >-
      גז אידיאלי מתפשט באיטיות לאורך איזותרמה בטמפרטורה 300 קלווין, במגע עם מאגר חום שהוא בדיוק
      בטמפרטורה 300 קלווין, ובולע 600 ג'אול של חום. מה קורה לאנטרופיה?
    choices:
      - text: 2 J/K זורמים מן המאגר אל הגז, ושום אנטרופיה אינה מיוצרת.
        correct: true
        feedback: >-
          נכון. הגז מקבל Q/T = 2 J/K והמאגר מאבד בדיוק 2 J/K: אנטרופיה עברה ממקום למקום, והסך
          הכולל לא השתנה. ייצור אנטרופיה דורש אי-הפיכות, כמו חום החוצה הפרש טמפרטורות; זרימה
          כשלעצמה אינה כזו.
      - text: 2 J/K מיוצרים, משום שאנטרופיה עברה אל הגז.
        correct: false
        feedback: >-
          זו התפיסה השגויה שזרימה היא ייצור. האנטרופיה של המאגר ירדה בדיוק בשיעור שבו עלתה זו
          של הגז, ולכן השינוי הכולל, שהוא מה שפירוש המילה ייצור, הוא אפס.
      - text: 4 J/K מיוצרים, 2 J/K בגז ו-2 J/K במאגר.
        correct: false
        feedback: >-
          המאגר מסר חום, ולכן האנטרופיה שלו ירדה ולא עלתה. שני השינויים מבטלים זה את זה במדויק
          בחילוף הפיך.
      - text: שום אנטרופיה אינה עוברת כלל, משום שהטמפרטורה נשארה קבועה.
        correct: false
        feedback: >-
          טמפרטורה קבועה אין פירושה אנטרופיה קבועה. הגז קלט 600 ג'אול של חום בטמפרטורה 300
          קלווין, והחום הזה נשא איתו פנימה 2 J/K של אנטרופיה.

  - id: Q-09-10
    type: multiple-choice
    objectives: [OBJ-09-6]
    misconception: entropy-undefined-off-equilibrium
    prompt: >-
      גז בטמפרטורה 300 קלווין פורץ בחופשיות מנפח של 1 ליטר אל קופסה ריקה של 2 ליטר. אף אחד
      מן המצבים שבדרך אינו מצב של שיווי משקל. מה אפשר לומר על שינוי האנטרופיה של הגז?
    choices:
      - text: הוא N k_B ln 2, ומוצאים אותו לאורך כל מסלול הפיך בין אותם שני מצבי קצה של שיווי משקל.
        correct: true
        feedback: >-
          נכון. S היא פונקציה של מצב שיווי המשקל, ושני מצבי הקצה הם מצבי שיווי משקל. איזותרמה
          הפיכה מ-1 ליטר ל-2 ליטר מחברת ביניהם, ואינטגרציה של delta-Q_rev/T לאורכה נותנת
          N k_B ln 2. אותו מספר מתקבל מן הפונקציה של סאקור–טטרודה ומן המנייה של מיקומים.
      - text: אי אפשר לחשב אותו, משום שאנטרופיה מוגדרת רק בשיווי משקל והתהליך לא עבר באף מצב כזה.
        correct: false
        feedback: >-
          המצבים שבדרך אינם צריכים להיות מצבי שיווי משקל, רק נקודות הקצה. אנטרופיה שייכת
          למצבים, לא לדרך, ולכן כל דרך הפיכה בין אותן נקודות קצה היא כלי לגיטימי לחישובה.
      - text: הוא אפס, משום שלא הוחלף שום חום.
        correct: false
        feedback: >-
          dS = delta-Q/T תקף רק לחילוף הפיך. בהתפשטות חופשית האנטרופיה עולה ב-N k_B ln 2 בלי שום
          חום: כולה מיוצרת, ושום חלק ממנה אינו מתקבל.
      - text: הוא שלילי, משום שהגז התקרר בזמן שהתפשט.
        correct: false
        feedback: >-
          גז אידיאלי המתפשט אל ריק אינו עושה עבודה ואינו מקבל חום, ולכן האנרגיה והטמפרטורה שלו
          אינן משתנות. וגם גז שכן התקרר לא היה יכול להוריד את האנטרופיה שלו בתהליך מבודד.

  - id: Q-09-11
    type: prediction
    objectives: [OBJ-09-7, OBJ-09-1]
    prompt: >-
      לפני הרצת פנקס האנטרופיה במעבדה: שני המוצקים של מודול 01 נרגעים לעבר טמפרטורה משותפת,
      בדילוג אקראי אחד של קוונט בכל צעד. אתם עוקבים אחרי האנטרופיה הכוללת המדויקת שלהם אחרי
      כל צעד. חזו (א) האם היא יורדת אי פעם בצעד בודד, (ב) היכן היא מסתיימת, ו-(ג) מה העלייה
      הכוללת שלה מוכיחה ומה אינה מוכיחה.
    discussion: >-
      (א) כן, ולעתים קרובות: בערך בחמישית מכל הצעדים קוונט מדלג לכיוון "הלא נכון" והאנטרופיה
      הכוללת צונחת, לכל היותר בכ-0.01 k_B, בעוד שהעלייה כולה היא כ-15 k_B. (ב) היא מתיישרת
      ממש מתחת לאנטרופיה הכוללת המרבית שיש לחלוקה כלשהי של האנרגיה הזו, בדיוק ברגע שבו
      הטמפרטורות נפגשות. (ג) היא ממחישה את הנחת המקסימום על ריצה אחת, והעובדה שהיא מונוטונית
      רק בגבולות הרעש היא האופי הסטטיסטי של החוק השני, שנעשה גלוי. היא אינה מוכיחה דבר: ריצה
      סופית אינה יכולה לבסס חוק, וההוכחה היא המנייה של מודול 08, האומרת שלמאקרו-מצבים הסמוכים
      לשיא יש מספר עצום יותר של מיקרו-מצבים. אם חזיתם שהיא לעולם אינה יכולה לצנוח, שימו לב
      ששום דבר בדינמיקה אינו יודע דבר על אנטרופיה.

  - id: Q-09-12
    type: multiple-choice
    objectives: [OBJ-09-7, OBJ-09-3]
    prompt: >-
      למוצק איינשטיין A יש 100 מתנדים ולמוצק B יש 300. יחד הם מחזיקים 2000 קוונטי אנרגיה.
      בשיווי משקל, כיצד מתחלקים הקוונטים?
    choices:
      - text: 500 ב-A ו-1500 ב-B, אותו ממוצע לכל מתנד.
        correct: true
        feedback: >-
          נכון. שיפועים שווים של S(U, n) = k_B [(q + n) ln(q + n) - q ln q - n ln n] פירושם
          ln(1 + n/q) שווה, ולכן q_A/n_A = q_B/n_B: חמישה קוונטים לכל מתנד בכל אחד מהם.
      - text: 1000 בכל אחד, כך שהאנרגיות שוות.
        correct: false
        feedback: >-
          אנרגיות שוות היו משאירות ל-A עשרה קוונטים לכל מתנד ול-B 3.3: A היה חם בהרבה, ואנרגיה
          עדיין הייתה זורמת מ-A אל B.
      - text: 1500 ב-A ו-500 ב-B, משום שהמוצק הקטן מתחמם בקלות רבה יותר.
        correct: false
        feedback: >-
          מוצק קטן אכן מתחמם יותר עבור אותה אנרגיה, וזו בדיוק הסיבה שהוא מסיים עם פחות מן
          האנרגיה בטמפרטורה משותפת, לא עם יותר.
      - text: זה תלוי באופן שבו התחלקו הקוונטים בהתחלה.
        correct: false
        feedback: >-
          החלוקה ההתחלתית קובעת כמה אנטרופיה מיוצרת בדרך, לא היכן הזוג מסתיים. המקסימום של
          האנטרופיה הכוללת תלוי רק באנרגיה הכוללת ובשני הגדלים.

  - id: Q-09-13
    type: multiple-choice
    objectives: [OBJ-09-2]
    prompt: >-
      האנטרופיה של סאקור–טטרודה עבור גז חד-אטומי תלויה בנפח רק דרך איבר אחד,
      N k_B ln V. מה נותן השיפוע dS/dV ב-U וב-N קבועים?
    choices:
      - text: P/T = N k_B / V, שהוא חוק הגזים האידיאליים.
        correct: true
        feedback: >-
          נכון. שיפוע הנפח של S הוא P/T, ולכן האיבר ln V לבדו נותן P V = N k_B T. משוואת המצב
          מעולם לא הוכנסה; היא נקראה מתוך היחס היסודי.
      - text: הלחץ P עצמו, P = N k_B / V.
        correct: false
        feedback: >-
          השיפוע dS/dV הוא P/T, לא P. בדקו את היחידות: אנטרופיה ליחידת נפח היא J/(K m^3),
          שהיא לחץ חלקי טמפרטורה.
      - text: שום דבר פיזיקלי; רק לשיפוע האנרגיה של S יש משמעות.
        correct: false
        feedback: >-
          לכל שלושת השיפועים של S(U, V, N) יש משמעות: 1/T, P/T, -mu/T. העובדה ששיפוע הנפח
          הוא P/T נבדקה בעמוד הזה באמצעות דחיסה אדיאבטית הפיכה.
      - text: קיבול החום בנפח קבוע.
        correct: false
        feedback: >-
          קיבולי חום מתקבלים מנגזרות שניות של S לפי U: העקמומיות
          d^2S/dU^2 = -1/(T^2 C_V). נגזרת ראשונה לפי V נותנת P/T.
