module: 02-equations-of-state
questions:
  - id: Q-02-1
    type: multiple-choice
    objectives: [OBJ-02-1]
    prompt: >-
      The state postulate says a simple compressible substance's equilibrium states form a
      single two-dimensional surface in (P, v, T) space. Given the values of any two
      independent intensive variables -- say P and T -- what does the state postulate say
      about the rest?
    choices:
      - text: >-
          v (and every other equilibrium property) is already fixed -- the two you chose pick
          out one point on the surface, and a point on a surface has no remaining freedom.
        correct: true
        feedback: >-
          Right. That is exactly what "a single two-dimensional surface" means: two
          coordinates locate a point on it, and the third coordinate is then read off, not
          separately chosen.
      - text: P, v and T are three fully independent knobs, so all three must be measured separately.
        correct: false
        feedback: >-
          This is what the state postulate denies. If P, v and T were independent, equilibrium
          states would fill a three-dimensional volume, not sit on a two-dimensional surface --
          and there would be no such thing as "the equation of state".
      - text: Only extensive variables like V and N determine the state; P and T alone are not enough.
        correct: false
        feedback: >-
          Backwards. P and T (both intensive) are exactly what the state postulate says
          suffices to fix v; N sets how much substance you have, not which point on the
          per-particle surface it occupies.
      - text: This is true only for the ideal gas; real gases need a third independent variable.
        correct: false
        feedback: >-
          The state postulate is a general claim about any simple compressible substance's
          equilibrium surface -- the van der Waals gas included. It does not add a degree of
          freedom the ideal gas lacked.

  - id: Q-02-2
    type: multiple-choice
    objectives: [OBJ-02-2]
    misconception: doubling-doubles-everything
    prompt: >-
      You have a gas bottle at (N, V, T). You open a valve to an identical second bottle at
      the same state, merging into one system with twice the gas, in twice the volume, at the
      same T. Which of the following correctly lists what changes?
    choices:
      - text: V, N and U (the internal energy) double; P and T stay exactly the same.
        correct: true
        feedback: >-
          Correct -- the doubling test: extensive quantities (V, N, U) double, intensive
          quantities (P, T, and v = V/N) do not move at all.
      - text: P, V, T and N all double.
        correct: false
        feedback: >-
          Doubling P and T along with V and N would make "the pressure of the gas" depend on
          how much gas happened to be in the room -- which cannot be right, since two adjacent
          litres of the same gas at the same temperature must report the same pressure.
      - text: Nothing changes -- joining two identical systems just makes a bigger version of the same state.
        correct: false
        feedback: >-
          V, N and U genuinely double; the two halves really do add up to twice the substance.
          Only the intensive quantities (P, T, v) stay fixed, not everything.
      - text: Only T changes, since heat flows between the two halves until they equilibrate.
        correct: false
        feedback: >-
          The two halves start at the same T, so there is nothing to equilibrate -- T was
          never going to move, and neither was P.

  - id: Q-02-3
    type: numeric
    objectives: [OBJ-02-3]
    prompt: >-
      A room measures 30 m^3 and holds air at 101325 Pa and 293 K. Using P V = N k_B T with
      k_B = 1.381e-23 J/K, how many gas particles does the room contain?
    answer: 7.51e+26
    tolerance: 2.0e+24
    feedback: >-
      N = P V / (k_B T) = (101325)(30) / [(1.381e-23)(293)] = 7.51e26 particles -- the same
      calculation as P V = N k_B T, solved for N instead of P.

  - id: Q-02-4
    type: multiple-choice
    objectives: [OBJ-02-3]
    misconception: ideal-gas-universal
    prompt: >-
      CO2 gas at 280 K is compressed slowly at fixed temperature, well past several times its
      critical volume. Which best describes what a pressure gauge on the container actually
      reads, compared with the ideal-gas prediction P = k_B T / v?
    choices:
      - text: >-
          The measured pressure climbs more slowly than the ideal prediction, then plateaus at
          the substance's saturation pressure while the ideal prediction keeps climbing
          without limit.
        correct: true
        feedback: >-
          Right -- this is exactly what the NIST CO2 isotherm data in this module shows: the
          real gas departs from P = k_B T / v well before condensation, and then flattens into
          a plateau the ideal law has no mechanism to produce at all.
      - text: The measured pressure tracks P = k_B T / v exactly at any density, since every gas obeys the ideal gas law.
        correct: false
        feedback: >-
          This is exactly the claim the module's NIST CO2 data falsifies. The ideal gas law
          contains no substance-specific constant, so it cannot know that CO2 condenses --
          real CO2's measured pressure departs sharply from the ideal prediction long before
          the plateau, let alone during it.
      - text: The measured pressure rises faster than the ideal prediction at every volume.
        correct: false
        feedback: >-
          Attraction dominates over most of the compression, which *lowers* the measured
          pressure below the ideal prediction, not raises it -- only deep in the compressed
          liquid does pressure rise steeply.
      - text: The measured pressure drops to zero once the substance starts to condense.
        correct: false
        feedback: >-
          Condensation holds the pressure at a constant, nonzero value -- the saturation
          pressure -- not zero. A pressure of zero would mean no gas left at all.

  - id: Q-02-5
    type: numeric
    objectives: [OBJ-02-4]
    prompt: >-
      Using a, b fit from CO2's measured critical point (T_c = 304.13 K, P_c = 7.3773e6 Pa,
      via a = 27(k_B T_c)^2/(64 P_c), b = k_B T_c/(8 P_c)), compute the van der Waals pressure
      at a molar volume of 1.2e-3 m^3/mol (per-particle v = V_m/N_A) and T = 280 K. Give the
      signed fractional deviation from the ideal prediction k_B T/v at the same state
      (negative if the van der Waals pressure is lower).
    answer: -0.094
    tolerance: 0.01
    feedback: >-
      Ideal: P = k_B T/v ~= 1.940e6 Pa. Van der Waals: P ~= 1.758e6 Pa. The attraction term
      a/v^2 dominates at this density -- the excluded-volume correction 1/(v-b) is still
      close to 1/v since v is far larger than b here -- so the net shift is negative, about
      -9.4%, well before condensation is anywhere in sight.

  - id: Q-02-6
    type: numeric
    objectives: [OBJ-02-5]
    prompt: >-
      A gas has per-particle van der Waals constants a = 1.0037e-48 Pa m^6 and
      b = 7.0855e-29 m^3 (converted from independently published textbook molar constants for
      CO2, not fit from its critical point). Using k_B T_c = 8a/(27b), compute T_c in kelvin.
    answer: 304.0
    tolerance: 1.0
    feedback: >-
      T_c = 8a/(27 k_B b) ~= 304.0 K -- within 0.1% of CO2's measured critical temperature,
      304.13 K, even though a and b here came from an independent fit, not from the critical
      point itself. P_c = a/(27 b^2) ~= 7.40e6 Pa lands within about half a percent of the
      measured 7.3773e6 Pa the same way.

  - id: Q-02-7
    type: multiple-choice
    objectives: [OBJ-02-6]
    prompt: >-
      Two different gases -- say CO2 and N2 -- are held at the same reduced temperature T_r
      and the same reduced pressure P_r, even though their critical points (and their a, b)
      are completely different numbers. Do the two gases have the same compressibility factor
      Z, or does Z depend on which gas it is?
    choices:
      - text: >-
          The same Z -- the law of corresponding states says any van der Waals substance at a
          given (T_r, P_r) has the same reduced volume v_r, and Z is built entirely out of
          reduced quantities once P_c v_c/(k_B T_c) = 3/8 is used to eliminate the substance-
          specific constants.
        correct: true
        feedback: >-
          Correct. P_r = 8T_r/(3v_r - 1) - 3/v_r^2 has no a, b or N_A left in it at all, so
          fixing (T_r, P_r) fixes v_r -- and hence Z -- the same way for every van der Waals
          substance, regardless of its own critical point.
      - text: Z depends on the gas's chemistry, so it is never the same for two different gases.
        correct: false
        feedback: >-
          This is true of the *un-reduced* pressure -- two gases at the same (v, T) generally
          have different P, because a and b differ. But once P, v and T are measured in units
          of each gas's own critical point, that substance-specific information cancels out
          of the reduced equation entirely.
      - text: >-
          The same Z, but only because CO2 and N2 happen to have similar molecular masses --
          for a very different pair of gases it would not hold.
        correct: false
        feedback: >-
          The law of corresponding states does not depend on molecular mass, or on any
          property of the two gases matching -- it follows from a, b cancelling out of the
          reduced van der Waals equation algebraically, for any pair of substances at all.
      - text: Only if both gases are measured at exactly their own critical points, T_r = P_r = 1.
        correct: false
        feedback: >-
          The reduced equation holds at every (T_r, P_r), not only at the critical point --
          T_r = P_r = 1 is just the one point every reduced isotherm is required to pass
          through, by construction.

  - id: Q-02-8
    type: short-answer
    objectives: [OBJ-02-1, OBJ-02-4]
    prompt: >-
      In a few sentences: explain why a real substance's P-v-T surface can fold below its
      critical temperature while the ideal-gas surface never can, naming the physical role
      that a and b each play in producing the fold.
    discussion: >-
      The ideal-gas surface P = k_B T/v is smooth and monotonically falling in v at every
      fixed T, for the simple reason that it has no substance-specific information in it at
      all -- nothing in the formula can produce a region where pressure rises with volume. The
      van der Waals correction adds two such pieces of information: b, the excluded volume,
      which diverges the pressure as v approaches b from above; and a, the mean-field
      attraction, which pulls the pressure down at larger v. Below T_c, the competition
      between a rapidly rising 1/(v-b) term at small v and a slowly falling a/v^2 term at
      larger v produces a genuine non-monotonic region -- the fold, and its wiggle -- that
      cannot exist without both ingredients: setting either a or b to zero removes the
      critical point entirely (Problem 5(d) on the problem set makes this precise).
