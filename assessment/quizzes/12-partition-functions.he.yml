module: 12-partition-functions
questions:
  - id: Q-12-1
    type: multiple-choice
    objectives: [OBJ-12-1, OBJ-12-2]
    prompt: >-
      מערכת בעלת רמות אנרגיה קבועות נמצאת במגע עם אמבט. מהו -d(ln Z)/d(beta), כאשר
      beta = 1/(k_B T)?
    choices:
      - text: האנרגיה הממוצעת U של המערכת.
        correct: true
        feedback: >-
          נכון. גזירה של Z = sum_s exp(-beta E_s) מורידה -E_s בכל איבר, והחלוקה ב-Z -- וזה מה
          שהלוגריתם עושה -- הופכת את הסכום הזה לממוצע: -d(ln Z)/d(beta) = sum_s E_s P_s = U.
          הנגזרת השנייה נותנת את השונות של האנרגיה.
      - text: האנרגיה החופשית F של המערכת.
        correct: false
        feedback: >-
          האנרגיה החופשית היא -k_B T ln Z עצמו, בלי לגזור דבר. גזירה של ln Z לפי beta נותנת את
          האנרגיה הממוצעת; U ו-F נבדלים ב-TS.
      - text: שום דבר פיזיקלי -- Z רק מנרמל את ההסתברויות, ולכן לנגזרת שלו אין משמעות.
        correct: false
        feedback: >-
          Z הוא פונקציה של beta, לא מספר יחיד, והצורה שלו נושאת את התפלגות האנרגיה. הנגזרת
          הראשונה של הלוגריתם שלו היא -U והשנייה היא השונות של E: ln Z הוא הפונקציה היוצרת של
          התפלגות האנרגיה הקנונית.
      - text: האנטרופיה S של המערכת, מחולקת ב-k_B.
        correct: false
        feedback: >-
          האנטרופיה דורשת גם את ln Z וגם את הנגזרת שלו: S = k_B (ln Z + beta U). הנגזרת לבדה
          היא -U.

  - id: Q-12-2
    type: numeric
    objectives: [OBJ-12-2]
    prompt: >-
      למערכת דו-רמתית יש רמות 0 ו-Delta, כאשר Delta = 2 k_B T. בעזרת U = -d(ln Z)/d(beta),
      מהי האנרגיה הממוצעת שלה, ככפולה של Delta?
    answer: 0.1192
    tolerance: 0.002
    feedback: >-
      ln Z = ln(1 + exp(-beta Delta)), ולכן U = Delta exp(-beta Delta)/(1 + exp(-beta Delta)) =
      Delta/(exp(2) + 1) = 0.119 Delta. אם ענית 0.135, נתת את יחס האוכלוסיות exp(-2), ולא את
      החלק המעורר. אם ענית 0.5, נתת את הגבול של טמפרטורה אינסופית.

  - id: Q-12-3
    type: multiple-choice
    objectives: [OBJ-12-4]
    misconception: free-energy-formula-definition
    prompt: >-
      מה מעמדה של הטענה F = -k_B T ln Z?
    choices:
      - text: משפט -- היא נכונה משום שנבדק שהאנטרופיה הנובעת ממנה מקיימת dS = dQ/T ושווה לספירת המיקרו-מצבים של גיבס, ולכן זו F = U - TS של מודול 10.
        correct: true
        feedback: >-
          נכון. מודול 10 הגדיר F = U - TS לפני שהיה צבר כלשהו. היה צריך להראות שהביטוי -k_B T ln Z
          שווה לה: האנטרופיה שלה, k_B (ln Z + beta U), מקיימת את dS = dQ/T של קלאוזיוס ברמות
          קבועות ושווה לסכום -k_B sum P ln P. המעבדה מחשבת את -k_B T ln Z ואת U - TS באופן בלתי
          תלוי ומוצאת שהם שווים עד כדי עיגול.
      - text: הגדרה -- המכניקה הסטטיסטית מגדירה את האנרגיה החופשית כביטוי -k_B T ln Z.
        correct: false
        feedback: >-
          זו התפיסה השגויה ש-F = -k_B T ln Z היא הגדרה. האנרגיה החופשית כבר הוגדרה, באופן
          תרמודינמי, כ-U - TS. לקרוא לנוסחה הגדרה פירושו לדלג על הצעד שמחבר את שני התיאורים:
          הבדיקה שהאנטרופיה הנובעת ממנה היא האנטרופיה התרמודינמית.
      - text: קירוב, התקף רק למערכות גדולות.
        correct: false
        feedback: >-
          שום דבר בגזירה אינו דורש מערכת גדולה: היא מתקיימת בדיוק לכל מערכת בעלת רמות קבועות
          במגע עם אמבט, אפילו למערכת דו-רמתית אחת.
      - text: חוק אמפירי, שנמצא על ידי מדידת אנרגיות חופשיות.
        correct: false
        feedback: >-
          היא נגזרת, לא נמדדת: מהתפלגות בולצמן ועוד שתי בדיקות של האנטרופיה. ניסויים בודקים את
          רמות המודל, לא את הנוסחה.

  - id: Q-12-4
    type: multiple-choice
    objectives: [OBJ-12-7]
    misconception: negative-t-colder
    prompt: >-
      המומנטים המגנטיים של גביש הוכנו כך שיותר מהם מצביעים נגד השדה מאשר בכיוונו, ולכן
      הטמפרטורה שלהם שלילית. הגביש מובא במגע עם גוש נחושת בטמפרטורת החדר. לאיזה כיוון זורם
      החום?
    choices:
      - text: מן המומנטים אל הנחושת -- מערכת בטמפרטורה שלילית חמה יותר מכל מערכת בטמפרטורה חיובית.
        correct: true
        feedback: >-
          נכון. האנטרופיה הכוללת משתנה ב-k_B (beta_1 - beta_2) dU_1, והיא חייבת לגדול. כאשר
          beta_1 < 0 < beta_2, הדבר מחייב dU_1 < 0. במעבדה, פרמגנט הפוך מוסר אנרגיה למוצק
          ב-0.56 K, ב-14 K וב-1344 K באותה מידה. בסידור לפי חום, טמפרטורות שליליות נמצאות מעל
          T = infinity.
      - text: אל המומנטים -- טמפרטורה שלילית קרה יותר מהאפס המוחלט, ולכן הם קרים יותר מהנחושת.
        correct: false
        feedback: >-
          זו התפיסה השגויה שטמפרטורה שלילית פירושה קר יותר מהאפס המוחלט. המומנטים מחזיקים יותר
          אנרגיה מאשר בכל טמפרטורה חיובית -- ב-T = infinity הם מתחלקים חצי-חצי, וכאן יותר מהם
          מצביעים נגד השדה. הם מוסרים אנרגיה לכל דבר בטמפרטורה חיובית, חם ככל שיהיה.
      - text: לא זורם חום, משום שאי אפשר להשוות בין שתי הטמפרטורות.
        correct: false
        feedback: >-
          אפשר להשוות ביניהן באמצעות beta = (1/k_B) dS/dU, שעובר ברציפות מערכים חיוביים דרך
          אפס לערכים שליליים. חום זורם מה-beta הקטן אל הגדול.
      - text: זה תלוי בשאלה אם הנחושת חמה יותר מהערך המוחלט של הטמפרטורה השלילית.
        correct: false
        feedback: >-
          הערך המוחלט אינו משנה. כל beta שלילי קטן מכל beta חיובי, ולכן אנרגיה עוזבת את
          המומנטים תהיה הטמפרטורה של הנחושת אשר תהיה -- המוצק של המעבדה ב-1344 K עדיין לוקח
          אנרגיה מפרמגנט בטמפרטורה -0.79 K.

  - id: Q-12-5
    type: numeric
    objectives: [OBJ-12-6]
    prompt: >-
      פרמגנט נמצא בשדה חלש, mu B << k_B T. הטמפרטורה שלו מחולקת בשניים בשדה קבוע. באיזה
      גורם משתנה המגנוט שלו?
    answer: 2.0
    tolerance: 0.05
    feedback: >-
      בתחום של קירי M = N mu^2 B/(k_B T), ולכן חלוקת T בשניים מכפילה את M. המעבדה מוצאת גורם
      של 1.99999 בין 300 K ל-150 K בשדה של 1 T. אם ענית 1, חשבת על רוויה, שבה כל מומנט כבר
      מכוון. אם ענית 4, העלית את הטמפרטורה בריבוע: חוק קירי הוא 1/T, לא 1/T^2.

  - id: Q-12-6
    type: multiple-choice
    objectives: [OBJ-12-8]
    misconception: dulong-petit-always
    prompt: >-
      מתנד הרמוני עם מרווח רמות hbar*omega נמצא במגע עם אמבט שבו
      k_B T = hbar*omega/20. מהו קיבול החום שלו?
    choices:
      - text: קטן מעריכית, בערך k_B (hbar*omega/(k_B T))^2 exp(-hbar*omega/(k_B T)) -- המתנד עבר קפיאה.
        correct: true
        feedback: >-
          נכון. ב-k_B T << hbar*omega הרמה המעוררת הראשונה אינה בהישג יד, וכמות האנרגיה
          הקטנה ביותר שהמתנד יכול לקבל היא קוונט שלם שהאמבט כמעט אף פעם אינו מספק. כאן
          C = 400 exp(-20) k_B, בערך 8e-7 k_B.
      - text: k_B, כמו לכל מתנד בכל טמפרטורה -- ולכן למוצק יש C = 3 N k_B.
        correct: false
        feedback: >-
          זו התפיסה השגויה שערך דולונג–פטי מתקיים בכל הטמפרטורות. C = k_B למתנד הוא חלוקת
          האנרגיה השווה, הגבול של טמפרטורה גבוהה k_B T >> hbar*omega. בקור המתנד עובר קפיאה,
          וקיבולי החום של מוצקים יורדים לעבר אפס -- מודול 16 עוקב אחר זה במוצקים אמיתיים.
      - text: k_B / 2, משום שרק האנרגיה הקינטית עדיין נחשבת.
        correct: false
        feedback: >-
          קפיאה אינה עניין של אובדן איבר ריבועי אחד: המתנד כולו מפסיק לקלוט חום, משום
          שהרמות המעוררות שלו אינן בהישג יד. C יורד מעריכית, לא בחצי.
      - text: אינסופי, משום שהאנרגיה משתנה בפתאומיות בין רמות.
        correct: false
        feedback: >-
          האנרגיה הממוצעת הקנונית היא פונקציה חלקה של הטמפרטורה, ולכן C סופי; ובקור הוא
          זעיר, משום שכמעט אף מתנד אינו מעורר כלל.

  - id: Q-12-7
    type: numeric
    objectives: [OBJ-12-3]
    prompt: >-
      שני פרמגנטים נמצאים באותה טמפרטורה ובאותו שדה: לאחד יש N = 10^4 מומנטים, לשני
      N = 10^6. באיזה גורם הפלוקטואציה היחסית של האנרגיה sigma_E/|U| של הקטן גדולה מזו של
      הגדול?
    answer: 10.0
    tolerance: 0.2
    feedback: >-
      עבור מומנטים בלתי תלויים ln Z_N = N ln z, ולכן U גדל כמו N וגם השונות d^2(ln Z)/d(beta)^2
      גדלה כמו N; sigma_E גדל כמו sqrt(N) ו-sigma_E/|U| יורד כמו N^(-1/2). הגדלה של N פי מאה
      מחלקת אותו ב-10. אם ענית 100, השארת את sigma_E קבוע בזמן ש-U גדל; אם ענית 1, התייחסת
      לפיזור היחסי כאל תכונה של החומר ולא של גודל הדגימה.

  - id: Q-12-8
    type: multiple-choice
    objectives: [OBJ-12-5]
    prompt: >-
      את U משחזרים מתוך ln Z בעזרת ההפרש המרכזי -[ln Z(beta + h) - ln Z(beta - h)]/(2h).
      הצעד h מחולק בשניים, והוא עדיין גדול בהרבה מהצעד שבו שגיאת העיגול משנה. מה קורה
      לשגיאה?
    choices:
      - text: היא קטנה בגורם של בערך ארבעה, משום שההפרש המרכזי הוא מסדר שני.
        correct: true
        feedback: >-
          נכון. שגיאת הקטיעה של הפרש מרכזי פרופורציונלית ל-h^2. המעבדה מודדת סדר של
          2.002 +/- 0.001: כל חלוקה בשניים מחלקת את השגיאה ב-4.00.
      - text: היא קטנה בחצי, משום שהשגיאה פרופורציונלית לצעד.
        correct: false
        feedback: >-
          זה הפרש חד-צדדי, מסדר ראשון. הנוסחה הסימטרית מבטלת את האיבר של h, והשגיאה המובילה
          היא h^2 f'''/6.
      - text: היא אינה משתנה, משום שהנוסחה מדויקת לכל צעד.
        correct: false
        feedback: >-
          היא מדויקת רק כאשר ln Z ריבועי ב-beta, וכאן הוא אף פעם אינו כזה. השגיאה פרופורציונלית
          ל-h^2 ולנגזרת השלישית של ln Z.
      - text: היא גדלה, משום שצעד קטן יותר תמיד הופך את החיסור לפחות מדויק.
        correct: false
        feedback: >-
          זו שגיאת עיגול, והיא גוברת רק בצעדים קטנים מאוד -- במעבדה מתחת לבערך 1e-5 של beta
          עבור U. מעל זה שגיאת הקטיעה שולטת, וצעד קטן יותר עדיף.

  - id: Q-12-9
    type: short-answer
    objectives: [OBJ-12-1, OBJ-12-4]
    prompt: >-
      בשלושה או ארבעה משפטים: מדוע קבוע הנרמול Z קובע את התרמודינמיקה של מערכת, ומה היה צריך
      לבדוק לפני שכותבים F = -k_B T ln Z?
    discussion: >-
      Z הוא פונקציה של beta, וכל איבר exp(-beta E_s) נושא את האנרגיה של המצב שלו במעריך, ולכן
      גזירה של ln Z לפי beta מפיקה ממוצעים על פני התפלגות בולצמן: הנגזרת הראשונה היא -U,
      והשנייה היא השונות של E, השווה ל-k_B T^2 C_V. לכן ln Z הוא הפונקציה היוצרת של התפלגות
      האנרגיה. לגבי F: האנרגיה החופשית כבר הוגדרה במודול 10 כ-U - TS, ולכן היה צריך להראות
      שהביטוי -k_B T ln Z שווה לה -- האנטרופיה הנובעת ממנה, k_B (ln Z + beta U), נבדקה ונמצא שהיא
      מקיימת dS = dQ/T ברמות קבועות ושווה לסכום של גיבס -k_B sum P ln P. תשובה חזקה מציינת את
      שתי הבדיקות וקוראת לתוצאה משפט.
