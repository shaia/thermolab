module: 01-equilibrium
questions:
  - id: Q-01-1
    type: multiple-choice
    objectives: [OBJ-01-1]
    prompt: >-
      גוף א' נמצא בשיווי משקל תרמי עם גוף ג', וגוף ב' נמצא בנפרד בשיווי משקל תרמי עם גוף ג'.
      מה ניתן להסיק על א' ו-ב'?
    choices:
      - text: א' ו-ב' נמצאים בשיווי משקל תרמי זה עם זה -- זו בדיוק הטענה של החוק האפס של התרמודינמיקה.
        correct: true
        feedback: >-
          נכון. זו הסיבה המדויקת לכך שניתן לסמוך על תרמומטר מכויל יחיד (בתפקיד ג') כשהוא נוגע
          בשני עצמים בזה אחר זה -- בלי החוק האפס, קריאות זהות בתרמומטר על שני עצמים לא היו
          אומרות דבר על כך שהעצמים עצמם מסכימים זה עם זה.
      - text: שום דבר אינו נובע מכך -- שיווי משקל אינו בהכרח טרנזיטיבי.
        correct: false
        feedback: >-
          זה בדיוק מה שהחוק האפס שולל. הוא מנוסח כאקסיומה אמפירית בדיוק משום שהטרנזיטיביות
          אינה נובעת בהכרח מדבר בסיסי יותר -- זוהי עובדה על האופן שבו מגע תרמי אמיתי מתנהג.
      - text: לא' ו-ב' חייב להיות אותו קיבול חום.
        correct: false
        feedback: >-
          קיבול חום אינו משחק כאן תפקיד. שני גופים יכולים להימצא באותה טמפרטורה בעלי קיבולי
          חום שונים לגמרי -- זו בדיוק הסיבה שטמפרטורת שיווי המשקל של זוג גופים היא ממוצע
          משוקלל בקיבול החום, ולא טענה שבה C_A שווה ל-C_B.
      - text: א' ו-ב' כל אחד בשיווי משקל עם ג', אך ייתכן שתרמומטר יקרא ערך שונה על א' לעומת ב'.
        correct: false
        feedback: >-
          תרמומטר מכויל כראוי קורא אותו ערך על כל שני גופים באותה טמפרטורה. העקביות הזו היא
          בדיוק מה שהחוק האפס מבטיח, לא משהו שהוא משאיר פתוח.

  - id: Q-01-2
    type: multiple-choice
    objectives: [OBJ-01-2]
    misconception: instant-equilibrium
    prompt: >-
      שני גושי מתכת זהים, אחד חם ואחד קר, נלחצים זה אל זה ולאחר מכן מבודדים משאר העולם. נכון
      או לא נכון: הם מגיעים לאותה טמפרטורה ברגע המגע עצמו.
    choices:
      - text: לא נכון -- הטמפרטורות מתקרבות זו לזו בהדרגה, על פני זמן רלקסציה שנקבע על ידי קיבולי החום ואיכות המגע.
        correct: true
        feedback: >-
          נכון. למגע תרמי אמיתי יש מוליכות סופית, kappa, ולכן הפער T_A - T_B דועך כמו
          exp(-t/tau) ולא קורס לאפס ברגע המגע.
      - text: נכון -- מגע לבדו מספיק כדי להשוות את הטמפרטורה מיידית.
        correct: false
        feedback: >-
          זה מתעלם מכך שחום חייב לזרום דרך המגע בפועל, בקצב שנקבע על ידי kappa. שום מגע אמיתי
          אינו בעל מוליכות אינסופית, ולכן השוואת הטמפרטורות תמיד אורכת זמן רלקסציה סופי, תהיה
          אשר תהיה קצרה.
      - text: נכון, אך רק אם שני הגושים עשויים מאותו חומר.
        correct: false
        feedback: >-
          התאמת החומרים אינה מבטלת את הצורך של החום לזרום דרך המגע בקצב סופי. היא עשויה לקצר
          את tau, אך אינה יכולה להפוך אותו לאפס בדיוק.
      - text: לא נכון -- אך רק משום שהגושים מוצקים; נוזלים וגזים היו משתווים מיידית.
        correct: false
        feedback: >-
          כל מצב צבירה מעביר חום בקצב סופי. נוזלים וגזים יכולים להשתוות מהר יותר בעזרת זרימת
          חום, אך "מיידית" אינה מושגת בפועל באף מצב צבירה.

  - id: Q-01-3
    type: numeric
    objectives: [OBJ-01-3]
    prompt: >-
      לגוף א' קיבול חום של 300 J/K, והוא מתחיל בטמפרטורה של 80 מעלות צלזיוס. לגוף ב' קיבול
      חום של 900 J/K, והוא מתחיל ב-20 מעלות צלזיוס. הזוג מבודד יחד. מצאו את טמפרטורת שיווי
      המשקל במעלות צלזיוס.
    answer: 35
    tolerance: 0.5
    feedback: >-
      T_eq = (C_A T_A + C_B T_B)/(C_A + C_B) = (300*80 + 900*20)/1200 = 42000/1200 = 35 מעלות
      צלזיוס. לגוף ב' קיבול חום גדול פי שלושה מזה של א', ולכן שיווי המשקל יושב בשלושה-רבעים
      מהדרך מהערך ההתחלתי של א' לזה של ב' -- קרוב הרבה יותר ל-20 מעלות מאשר לאמצע הפשוט,
      50 מעלות.

  - id: Q-01-4
    type: multiple-choice
    objectives: [OBJ-01-3]
    misconception: equal-weight-equilibrium
    prompt: >-
      שני גופים בעלי קיבולי חום שונים מאוד מובאים למגע ומגיעים לשיווי משקל. איזו טענה נכונה?
    choices:
      - text: T_eq הוא ממוצע משוקלל בקיבול החום של שתי הטמפרטורות ההתחלתיות, כך שהגוף בעל ה-C הגדול יותר מושך את T_eq קרוב יותר לערך ההתחלתי שלו.
        correct: true
        feedback: >-
          נכון: T_eq = (C_A T_A + C_B T_B)/(C_A+C_B). קיבול חום גדול יותר לגוף א' פירושו
          שהטמפרטורה שלו צריכה לזוז פחות כדי לשמר את האנרגיה הכוללת של הזוג -- באותו אופן
          שמסה גדולה יותר זזה פחות באיזון מוטה של מנוף.
      - text: T_eq הוא תמיד בדיוק הממוצע החשבוני של T_A ו-T_B, ללא תלות בשני קיבולי החום.
        correct: false
        feedback: >-
          זה נכון רק במקרה הפרטי שבו C_A = C_B. באופן כללי, הטמפרטורה ההתחלתית של כל גוף
          משוקללת בקיבול החום שלו, ולא נספרת באופן שווה.
      - text: T_eq שווה לטמפרטורה ההתחלתית של הגוף בעל קיבול החום הגדול יותר.
        correct: false
        feedback: >-
          זו הפרזה בכיוון הנגדי. הגוף בעל ה-C הגדול מושך את T_eq לכיוונו אך אינו קובע אותו שם
          בדיוק, אלא אם קיבול החום שלו גדול לאין שיעור מזה של הגוף השני.
      - text: T_eq תלוי רק במי מהגופים היה חם יותר, ולא בשני קיבולי החום.
        correct: false
        feedback: >-
          T_eq תמיד יושב בין T_A(0) ל-T_B(0), אך המיקום המדויק בתוך התחום הזה תלוי ביחס
          C_A:C_B, ולא רק במי היה חם יותר.

  - id: Q-01-5
    type: multiple-choice
    objectives: [OBJ-01-4]
    prompt: >-
      שני גופים מתחילים עם פער טמפרטורה של 100 קלווין. בערך מהו גודל הפער לאחר זמן רלקסציה
      tau אחד בדיוק?
    choices:
      - text: כ-37 קלווין -- פי 1/e קטן מהפער ההתחלתי.
        correct: true
        feedback: >-
          נכון. T_A(t) - T_B(t) = (T_A(0) - T_B(0)) exp(-t/tau), ו-exp(-1) = 0.368, כך שלאחר
          tau אחד הפער יורד לכ-37% מהערך ההתחלתי -- היחס הזה הוא בדיוק ההגדרה של tau.
      - text: 0 קלווין -- שיווי המשקל מושג למעשה לאחר זמן רלקסציה אחד.
        correct: false
        feedback: >-
          זמן רלקסציה אחד מקטין את הפער בפקטור של כ-1/e, לא לאפס. הפונקציה האקספוננציאלית
          אינה מגיעה לאפס באופן פורמלי; לאחר כמה tau הפער הופך זניח, אך tau עצמו אינו "הגעה".
      - text: 50 קלווין -- זמן רלקסציה אחד מחצה את הפער.
        correct: false
        feedback: >-
          חציית הפער אורכת ln(2)*tau, כ-0.69 tau, לא בדיוק tau אחד. tau מוגדר על ידי הפקטור
          1/e, לא על ידי פקטור חצי.
      - text: עדיין 100 קלווין או יותר -- הפער אינו מתחיל להצטמצם עד שכמה זמני רלקסציה חלפו.
        correct: false
        feedback: >-
          הפער מצטמצם באופן רציף מהרגע הראשון; אין עיכוב לפני שהדעיכה מתחילה.

  - id: Q-01-6
    type: prediction
    objectives: [OBJ-01-3, OBJ-01-4]
    prompt: >-
      לפני קריאת הגזירה: אתם מכפילים את שני קיבולי החום, C_A ו-C_B, תוך שמירה על שתי
      הטמפרטורות ההתחלתיות ועל מוליכות המגע kappa קבועות. נבאו מה קורה (א) לטמפרטורת שיווי
      המשקל T_eq, (ב) לזמן הרלקסציה tau.
    discussion: >-
      T_eq = (C_A T_A + C_B T_B)/(C_A+C_B) אינו משתנה: הכפלת C_A ו-C_B יחד מכפילה את המונה
      ואת המכנה באותו גורם, וזה מתבטל. tau = C_A C_B / (kappa(C_A+C_B)) מוכפל: המונה C_A C_B
      גדל פי 4 בעוד המכנה C_A+C_B גדל רק פי 2, ו-4/2 = 2. פיזיקלית, הכפלת שני קיבולי החום
      משאירה את היעד במקומו (היחס C_A:C_B לא השתנה) אך מכפילה את המסה התרמית שעל kappa
      הקבועה להזיז, ולכן לוקח פי שניים זמן להגיע.

  - id: Q-01-7
    type: short-answer
    objectives: [OBJ-01-2, OBJ-01-5]
    prompt: >-
      בשניים-שלושה משפטים, הסבירו מה ממשיך לקרות ברמה המיקרוסקופית לאחר ששני גופים מגיעים
      לשיווי משקל תרמי, ומדוע הטמפרטורות המאקרוסקופיות בכל זאת מפסיקות להשתנות.
    discussion: >-
      תשובה טובה אומרת שקוונטים של אנרגיה ממשיכים לקפוץ הלוך ושוב בין שני הגופים ללא הפסקה --
      שום דבר בחילופין המיקרוסקופי אינו נפסק. מה שמפסיק הוא הזרימה *הנטו*: ברגע ש-q_A/n_A
      שווה ל-q_B/n_B (טמפרטורות שוות), קוונט עובר מא' לב' בדיוק באותה סבירות כמו מב' לא', כך
      ששני הכיוונים מתאזנים והממוצע המאקרוסקופי נשאר יציב. תשובות המתארות את החילופין כאילו
      "נפסק" ולא "התאזן" לא הבחינו בין שני המקרים.

  - id: Q-01-8
    type: multiple-choice
    objectives: [OBJ-01-5]
    prompt: >-
      באיזה מצב המודל הבדיד של חילופי האנרגיה שבמודול הזה אמין פחות מכול לחיזוי ההתקדמות
      לשיווי משקל?
    choices:
      - text: שני גופים הקרובים שניהם לאפס המוחלט.
        correct: true
        feedback: >-
          נכון. בטמפרטורה נמוכה האוסצילטורים יוצאים מהתחום הקלאסי שעליו מתבסס
          T = (מספר קוונטים * קוונט אנרגיה)/(n k_B), וסטטיסטיקה קוונטית משתלטת -- בדיוק אופן
          הכישלון שצוין במפרט המודל.
      - text: שני גופים בטמפרטורות התחלתיות שונות מאוד זו מזו, שתיהן הרבה מעל קנה המידה הקוונטי האופייני שלהן.
        correct: false
        feedback: >-
          פער התחלתי גדול הוא בדיוק מה שהגזירה של המודול הזה מטפלת בו -- חוק הרלקסציה
          האקספוננציאלי נגזר עבור T_A(0)-T_B(0) שרירותי כלשהו, והמודל נשאר תקף כל עוד שני
          הגופים נמצאים בתחום הקלאסי.
      - text: שני גופים בגדלים שונים מאוד זה מזה (N_A גדול, N_B קטן).
        correct: false
        feedback: >-
          גדלים לא שווים הם בדיוק מה שהופך את הנוסחה המשוקללת בקיבול החום ל-T_eq למעניינת;
          המודל מטפל ב-N_A != N_B ללא כל טיפול מיוחד, כל עוד כל אחד מהם גדול מספיק כדי
          להיקרא מאקרוסקופי.
      - text: שני גופים העשויים מאותו חומר.
        correct: false
        feedback: >-
          התאמת חומרים אינה אופן כישלון של דבר במודל הזה -- אם כבר, היא מקלה ביותר להצדיק את
          ההנחה של גודל קוונט משותף.
