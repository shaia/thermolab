module: 07-second-law
questions:
  - id: Q-07-1
    type: multiple-choice
    objectives: [OBJ-07-2]
    misconception: efficiency-is-engineering
    prompt: >-
      An engine absorbs 1000 J of heat from a furnace each cycle and delivers 400 J of work.
      What is the status of the other 600 J?
    choices:
      - text: It must be dumped into a colder reservoir; no design can recover all of it.
        correct: true
        feedback: >-
          Right. Around a cycle dU = 0, so the work delivered is Q_h - Q_c, and the second law
          forces Q_c > 0 for any cyclic engine. The rejected heat is a structural requirement,
          not a leak — the best conceivable engine between these reservoirs still rejects
          Q_c/Q_h = T_c/T_h of what it took in.
      - text: It is lost to friction and heat leaks, and better engineering could recover most of it.
        correct: false
        feedback: >-
          This is the single most common misreading of the second law. Friction and leaks are
          real and do cost you, but they are not what the law is about: a perfectly
          frictionless, perfectly insulated engine with reversible strokes still rejects heat.
          Set every loss to zero and the bound 1 - T_c/T_h remains.
      - text: It is stored in the working substance and released on a later cycle.
        correct: false
        feedback: >-
          A cycle returns the working substance to exactly its starting state, so its internal
          energy is the same at the end as at the beginning. There is nowhere for energy to
          accumulate — that is precisely what makes the bookkeeping W = Q_h - Q_c exact.
      - text: It was never really absorbed; the 1000 J figure must be a measurement error.
        correct: false
        feedback: >-
          The heat drawn from the furnace and the work delivered are independently measurable
          and routinely differ by exactly this kind of factor. Nothing is wrong with the
          numbers; an efficiency of 0.4 is ordinary.

  - id: Q-07-2
    type: multiple-choice
    objectives: [OBJ-07-3]
    misconception: carnot-depends-on-substance
    prompt: >-
      Two engines run between the same furnace and the same river. One uses steam, the other
      helium. Which can be made more efficient?
    choices:
      - text: Neither — the maximum efficiency is the same, because it depends only on the two temperatures.
        correct: true
        feedback: >-
          Correct, and this is the surprising half of Carnot's theorem. The proof never opens
          either engine: it uses only that one produces work from two reservoirs and that the
          other can be reversed. Since the working substance never enters the argument, it
          cannot appear in the answer.
      - text: Steam, because its phase change lets it absorb much more heat per kilogram.
        correct: false
        feedback: >-
          Steam really does carry more heat per kilogram, and that matters enormously for the
          size and cost of a plant. But efficiency is a ratio of work to heat absorbed, and
          the extra heat appears in both the numerator and the denominator. The ceiling does
          not move.
      - text: Helium, because a monatomic gas has no internal modes to waste energy in.
        correct: false
        feedback: >-
          Energy in rotational or vibrational modes is not wasted — it is returned when the
          gas is compressed again, since the cycle closes. Work through the Carnot derivation
          and watch gamma cancel: the efficiency comes out at 1 - T_c/T_h for every f.
      - text: Whichever has the higher heat capacity, since it moves more energy per cycle.
        correct: false
        feedback: >-
          More energy per cycle means a more powerful engine, not a more efficient one. These
          are different questions, and conflating them is worth guarding against — power and
          efficiency are traded against each other in every real design.

  - id: Q-07-3
    type: multiple-choice
    objectives: [OBJ-07-5]
    misconception: refrigerator-lowers-total-entropy
    prompt: >-
      A refrigerator lowers the entropy of the food inside it. Does this violate the second
      law?
    choices:
      - text: No — the entropy dumped into the kitchen exceeds the entropy removed from the interior.
        correct: true
        feedback: >-
          Exactly. The second law constrains the total, not any one piece of it. The fridge
          rejects Q_c + W into the kitchen at the higher temperature, and the accounting comes
          out non-negative overall, with equality only for a reversible machine.
      - text: Yes, but only slightly, and real refrigerators are allowed a small violation.
        correct: false
        feedback: >-
          The second law admits no violations, small or otherwise. There is nothing to excuse
          here: the total entropy genuinely increases, because the heat rejected to the warm
          kitchen carries more entropy than the heat removed from the cold interior.
      - text: No, because entropy does not apply to objects as ordinary as food.
        correct: false
        feedback: >-
          Entropy is defined for any system in equilibrium, food very much included. The
          resolution is not that the law fails to apply but that the boundary was drawn too
          small — look at the fridge plus the kitchen.
      - text: Yes, which is why refrigerators require a continuous supply of electricity.
        correct: false
        feedback: >-
          The electricity is needed, and the intuition is pointing somewhere real, but the
          conclusion is backwards. The work input is what *allows* the machine to obey the
          Clausius statement, since moving heat from cold to hot is forbidden only as a *sole*
          result. Paying for it is what makes it legal.

  - id: Q-07-4
    type: numeric
    objectives: [OBJ-07-4]
    prompt: >-
      A power station's boiler is at 811 K and its condenser at 311 K. Compute the maximum
      possible efficiency, as a decimal fraction between 0 and 1.
    answer: 0.6165
    tolerance: 0.005
    feedback: >-
      eta_max = 1 - T_c/T_h = 1 - 311/811 = 0.6165. If you got 0.3835 you computed T_c/T_h and
      forgot to subtract it from 1. If you got something near 0.93 you used Celsius: the ratio
      of temperatures is only meaningful on an absolute scale, and this is the most expensive
      single mistake available in this module. The plant actually achieves about 0.40, and
      that gap is mostly deliberate — see the maximum-power efficiency.

  - id: Q-07-5
    type: multiple-choice
    objectives: [OBJ-07-1]
    prompt: >-
      Which of these machines, if built, would violate the Kelvin statement of the second law?
    choices:
      - text: A ship that draws heat from the ocean and converts it entirely to propulsion, cycle after cycle, changing nothing else.
        correct: true
        feedback: >-
          Correct: this is a cyclic machine whose sole result is heat drawn from a single
          reservoir appearing as work. Both qualifiers matter — it repeats, and nothing else
          anywhere is left changed. Note that energy is perfectly conserved, which is why the
          first law has nothing to say about it.
      - text: A gas expanding isothermally, absorbing heat and doing an equal amount of work.
        correct: false
        feedback: >-
          This converts heat entirely to work at 100%, and it is entirely legal — because it
          is not cyclic. The gas ends up larger and lower in pressure, so the trick cannot be
          repeated without first paying to compress it back.
      - text: A refrigerator moving heat from its cold interior to the warmer kitchen.
        correct: false
        feedback: >-
          Legal, and sitting in your kitchen. The Clausius statement forbids this only as a
          *sole* result; a refrigerator also consumes electricity, so something else is left
          changed.
      - text: An engine achieving an efficiency of 0.35 between reservoirs at 600 K and 300 K.
        correct: false
        feedback: >-
          Perfectly legal: 0.35 sits below the bound of 1 - 300/600 = 0.50. The second law
          sets a ceiling, and this engine is under it.

  - id: Q-07-6
    type: numeric
    objectives: [OBJ-07-5]
    prompt: >-
      A heat pump warms a house at 295 K using outside air at 273 K. Compute its maximum
      possible coefficient of performance (heat delivered per unit work input).
    answer: 13.41
    tolerance: 0.2
    feedback: >-
      COP_pump = T_h/(T_h - T_c) = 295/22 = 13.41. If you got 12.41 you computed the
      refrigerator's coefficient T_c/(T_h - T_c) = 273/22, which differs by exactly 1 — the
      work input also arrives as heat on the hot side. A value far above 1 is not an error:
      nothing is being converted here, energy is being moved, and moving it costs less than
      the amount moved.

  - id: Q-07-7
    type: multiple-choice
    objectives: [OBJ-07-6]
    prompt: >-
      Why can the ratio of heats exchanged by a reversible engine be used to define a
      temperature scale?
    choices:
      - text: Because Carnot's theorem makes that ratio the same for every reversible engine between the same two reservoirs, whatever it is made of.
        correct: true
        feedback: >-
          Exactly. A definition must not depend on the apparatus used to apply it, and this
          ratio provably does not. Fixing one reference point then fixes the whole scale, and
          the result refers to no material at all — which is what "absolute" means here.
      - text: Because heat is easier to measure accurately than temperature.
        correct: false
        feedback: >-
          It is generally the other way round, and in any case a reversible engine takes
          infinitely long per cycle and cannot be built. The value of the definition is
          conceptual: it says what temperature *is*, independently of any thermometer.
      - text: Because the ideal gas law already relates pressure and temperature linearly.
        correct: false
        feedback: >-
          That gives the ideal-gas scale, which is a perfectly good empirical thermometer but
          depends on a substance behaving ideally. The point of the thermodynamic definition
          is to need no substance whatever.
      - text: Because entropy is defined as heat divided by temperature.
        correct: false
        feedback: >-
          This reverses the logic. The reversible heat ratio comes first and defines the
          temperature scale; entropy is then constructed from delta-Q over that T. Using
          entropy to define T here would be circular.

  - id: Q-07-8
    type: prediction
    objectives: [OBJ-07-7]
    prompt: >-
      Before reading the advanced section: an engine between reservoirs at 600 K and 300 K has
      imperfect heat exchangers, so its gas sits at 560 K while absorbing and 340 K while
      rejecting. Every stroke it performs is internally reversible. Predict (a) its
      efficiency, (b) whether the loop integral of delta-Q over the reservoir temperature is
      zero or negative, and (c) where the work it fails to deliver has gone.
    discussion: >-
      (a) The efficiency is set by the temperatures the *gas* works between, not the
      reservoirs': 1 - 340/560 = 0.393, against a Carnot bound of 0.500. (b) The loop integral
      is strictly negative, -0.357 J/K per 1000 J absorbed, because the denominators are the
      reservoir temperatures 600 and 300 rather than 560 and 340. Dividing by the gas's own
      temperature instead gives exactly zero for any closed cycle whatever and proves nothing
      — the entire inequality lives in the gap between the two temperatures. (c) The lost work
      is 500 - 393 = 107 J, and it equals T_c times the magnitude of the loop integral:
      300 * 0.357 = 107 J. Lost work and produced entropy are one quantity seen from two
      sides. If you predicted the efficiency from the reservoir temperatures, note what the
      engine can actually "see": it only ever touches its own gas.

  - id: Q-07-9
    type: short-answer
    objectives: [OBJ-07-2]
    prompt: >-
      In two or three sentences, explain why a cyclic heat engine must reject heat to a cold
      reservoir, in a way that does not appeal to friction, leaks, or imperfect engineering.
    discussion: >-
      A good answer runs through the cycle condition: closing the loop forces dU = 0, so the
      work delivered is exactly Q_h - Q_c, and the Kelvin statement forbids Q_c = 0 for a
      cyclic machine. Stronger answers add the quantitative version — Q_c/Q_h = T_c/T_h for a
      reversible engine, which is positive because absolute temperatures are — and note that
      this is why the rejected heat is structural rather than wasteful. Answers that say
      "some energy is always lost" have not distinguished the second law from sloppy
      engineering and should be pushed: ask them what a perfect, frictionless engine does.
