module: 13-chemical-potential
questions:
  - id: Q-13-1
    type: multiple-choice
    objectives: [OBJ-13-3, OBJ-13-4]
    misconception: particles-flow-concentration
    prompt: >-
      שתי קופסאות באותה טמפרטורה מחליפות חלקיקים דרך חור קטן. כשהחילוף נעצר בממוצע, איזה גודל
      בוודאות שווה בשתי הקופסאות?
    choices:
      - text: הפוטנציאל הכימי mu.
        correct: true
        feedback: >-
          נכון. מקסום האנטרופיה הכוללת ביחס לחלוקת החלקיקים נותן dS_1/dN_1 = dS_2/dN_2, ובטמפרטורה
          משותפת זה mu_1 = mu_2. במעבדה, שתי קופסאות שהרצפות שלהן נבדלות ב-2 k_B T מתייצבות
          בצפיפויות של שבעה לאחד, עם mu שווה.
      - text: הריכוז (חלקיקים ליחידת נפח).
        correct: false
        feedback: >-
          זו התפיסה השגויה שחלקיקים זורמים תמיד מריכוז גבוה לריכוז נמוך. הצפיפות נכנסת רק דרך
          החלק האנטרופי של mu, כלומר k_B T ln(n/n_Q); אם לחלקיק יש אנרגיה שונה בכל קופסה,
          הצפיפויות מסתיימות שונות -- ביחס exp(-Delta u/(k_B T)) -- ונשארות כך.
      - text: מספר החלקיקים.
        correct: false
        feedback: >-
          שום דבר אינו מעדיף מספרים שווים: שתי קופסאות בגדלים שונים ללא הפרש אנרגיה מסתיימות
          בצפיפויות שוות, ולכן הקופסה הגדולה מכילה יותר חלקיקים.
      - text: האנרגיה לחלקיק.
        correct: false
        feedback: >-
          לשתי קופסאות ללא רצפות וללא כוחות יש אותה אנרגיה לחלקיק כבר מההתחלה, ובכל זאת חלקיקים
          זורמים מהצפופה יותר. הפוטנציאל הכימי כולל איבר אנטרופי שאין באנרגיה לחלקיק.

  - id: Q-13-2
    type: numeric
    objectives: [OBJ-13-1]
    prompt: >-
      למערכת ב-U וב-V קבועים יש S/k_B = 1000.00 ב-N = 500 ו-S/k_B = 1004.00 ב-N = 502,
      בטמפרטורה T. העריכו את הפוטנציאל הכימי שלה, ביחידות של k_B T.
    answer: -2.0
    tolerance: 0.05
    feedback: >-
      mu = -T (dS/dN) ב-U וב-V קבועים. השיפוע הוא (1004.00 - 1000.00) k_B / 2 = 2 k_B לחלקיק,
      ולכן mu = -2 k_B T. אם ענית +2, השמטת את סימן המינוס שבהגדרה: הוספת חלקיקים שמוסיפים
      אנטרופיה הופכת את mu לשלילי.

  - id: Q-13-3
    type: multiple-choice
    objectives: [OBJ-13-2]
    prompt: >-
      עבור חומר טהור, G = mu N אבל F אינה mu N. מדוע?
    choices:
      - text: >-
          המשתנים הטבעיים של G, כלומר T ו-P, הם אינטנסיביים, ולכן לפי האקסטנסיביות G/N תלוי
          ב-T וב-P בלבד -- ויחס אוילר נותן G = U - TS + PV = mu N; ואילו F = U - TS = mu N - PV
          תלויה גם ב-V.
        correct: true
        feedback: >-
          נכון. יחס אוילר U = TS - PV + mu N, הנובע מאקסטנסיביות בלבד, נותן את שתי התוצאות.
          ל-G יש משתנה טבעי אקסטנסיבי אחד, N, ולכן היא N כפול פונקציה של משתנים אינטנסיביים --
          והפונקציה הזאת היא mu. ל-F יש שניים, V ו-N.
      - text: משום ש-mu מוגדר כ-dG/dN, בעוד של-F אין נגזרת לפי N.
        correct: false
        feedback: >-
          יש לה: גם mu = (dF/dN) ב-T וב-V קבועים. שתי הנגזרות נותנות את אותו mu; מה שנבדל הוא
          האם הפוטנציאל שווה ל-N כפול הנגזרת שלו, וזה תלוי בשאלה אילו משתנים אחרים הם
          אקסטנסיביים.
      - text: משום ש-G = mu N נכון רק עבור גז אידיאלי.
        correct: false
        feedback: >-
          זה מתקיים לכל מערכת חד-רכיבית שהאנטרופיה שלה אקסטנסיבית. הגז האידיאלי הוא רק המקרה
          שבו המעבדה בודקת זאת נומרית.
      - text: משום ש-F כוללת את האנרגיה הקינטית של החלקיקים ו-G אינה כוללת אותה.
        correct: false
        feedback: >-
          שתיהן מכילות את U. הן נבדלות ב-PV, שהוא בדיוק האיבר שהופך את F ל-mu N - PV.

  - id: Q-13-4
    type: multiple-choice
    objectives: [OBJ-13-3, OBJ-13-4]
    misconception: mu-energy-per-particle
    prompt: >-
      קופסה 1 מכילה גז בצפיפות 2 n_0 עם mu_1 = -6 k_B T; קופסה 2 מכילה גז מאותו סוג בצפיפות
      n_0 עם mu_2 = -4 k_B T. הטמפרטורות שוות. נפתח חור ביניהן. מה קורה?
    choices:
      - text: חלקיקים זורמים מקופסה 2 אל קופסה 1, הצפופה יותר, משום ש-mu_2 > mu_1.
        correct: true
        feedback: >-
          נכון. dS_tot = (mu_2 - mu_1) dN_1 / T > 0 עבור dN_1 > 0: חלקיקים זורמים מ-mu גבוה
          לנמוך, יהיו הצפיפויות אשר יהיו. לקופסה 1 חייבת להיות רצפה נמוכה יותר -- דופן מושכת,
          גובה נמוך יותר -- שהופכת את ה-mu שלה לנמוך יותר למרות הצפיפות.
      - text: חלקיקים זורמים מקופסה 1 אל קופסה 2, משום שקופסה 1 צפופה יותר.
        correct: false
        feedback: >-
          זה כלל הריכוז, והוא נכשל בכל פעם שהקופסאות נבדלות במשהו מלבד הצפיפות. הפוטנציאלים
          הכימיים מדורגים בכיוון ההפוך, והם שקובעים.
      - text: חלקיקים זורמים עד שהאנרגיה לחלקיק שווה בשתי הקופסאות, ואז נעצרים.
        correct: false
        feedback: >-
          זו התפיסה השגויה שהפוטנציאל הכימי הוא פשוט האנרגיה לחלקיק. אנרגיות שוות לחלקיק אינן
          עוצרות את הזרימה: במעבדה, שתי קופסאות ללא רצפות כלל -- אותה אנרגיה לחלקיק כבר
          מההתחלה -- עדיין מחליפות חלקיקים עד שהצפיפויות שלהן משתוות, משום של-mu יש חלק
          אנטרופי. הזרימה נעצרת כש-mu שווה.
      - text: שום דבר אינו זורם, משום שהטמפרטורות שוות.
        correct: false
        feedback: >-
          טמפרטורות שוות עוצרות את זרימת האנרגיה, לא את זרימת החלקיקים. חילוף חלקיקים דורש גם
          mu שווה.

  - id: Q-13-5
    type: numeric
    objectives: [OBJ-13-5]
    prompt: >-
      באטמוספרה איזותרמית של חנקן ב-288 K, גובה הסקאלה k_B T/(m g) הוא 8.72 km. בעזרת mu
      קבוע, מהו היחס בין הצפיפות בגובה 3.0 km לצפיפות בגובה פני הים?
    answer: 0.709
    tolerance: 0.005
    feedback: >-
      הביטוי k_B T ln n(z) + m g z זהה בשני הגבהים, ולכן n(z)/n(0) = exp(-z/H) =
      exp(-3.0/8.72) = 0.709. אם ענית 0.656, השתמשת ב-7.1 km, גובה סקאלה של גז קר יותר או
      כבד יותר, שהרי H = k_B T/(m g); אם 0.344, נתת את z/H עצמו ולא את האקספוננט.

  - id: Q-13-6
    type: multiple-choice
    objectives: [OBJ-13-6]
    prompt: >-
      המשקל הגרנד-קנוני P(s) ~ exp(-(E_s - mu N_s)/(k_B T)) הוא משפט. באילו הנחות הוא
      נזקק?
    choices:
      - text: >-
          מאגר גדול מספיק כדי שהטמפרטורה והפוטנציאל הכימי שלו יישארו קבועים כשהוא מוסר אנרגיה
          וחלקיקים, וצימוד חלש מספיק כדי שהאנרגיות ומספרי החלקיקים יתחברו.
        correct: true
        feedback: >-
          נכון. הגזירה מפתחת את האנטרופיה של המאגר לסדר ראשון באנרגיה ובחלקיקים שהוא מוסר;
          איברי הסדר השני שהוזנחו קטנים רק עבור מאגר גדול. הצימוד החלש הוא שמבטיח
          E_total = E_s + E_R.
      - text: כל מצב (E_s, N_s) של המערכת חייב להיות שווה הסתברות.
        correct: false
        feedback: >-
          ההפך: המצבים מקבלים משקלים שונים, exp(-(E_s - mu N_s)/(k_B T)). שוויון ההסתברויות
          שייך למערכת המבודדת יחד עם המאגר כשלם, לא למערכת הקטנה -- אותה מלכודת כמו לקרוא את
          הצבר הקנוני כשוויון הסתברויות.
      - text: המערכת חייבת להיות גז אידיאלי.
        correct: false
        feedback: >-
          שום דבר אינו מונח לגבי המערכת. המודול מפעיל את המשקל על אתר ספיחה יחיד, שאינו גז
          כלל.
      - text: המערכת חייבת להכיל חלקיקים רבים, כדי שקירוב סטירלינג יחול עליה.
        correct: false
        feedback: >-
          קירוב סטירלינג נחוץ עבור האנטרופיה החלקה של המאגר, לא עבור המערכת. המשקל מתקיים
          למערכת של אתר אחד המחזיק אפס חלקיקים או חלקיק אחד.

  - id: Q-13-7
    type: numeric
    objectives: [OBJ-13-6]
    prompt: >-
      אתר ספיחה בעל אנרגיית קשירה epsilon נמצא במגע עם גז בפוטנציאל כימי mu, כאשר
      (epsilon - mu)/(k_B T) = 1.5. מהו האכלוס הממוצע שלו?
    answer: 0.182
    tolerance: 0.003
    feedback: >-
      <n> = 1/(exp((epsilon - mu)/(k_B T)) + 1) = 1/(exp(1.5) + 1) = 1/(4.48 + 1) = 0.182. אם
      ענית 0.223, נתת את exp(-1.5), יחס בולצמן בלי ה-+1 של אכלוס יחיד; אם 0.818, הפכת את
      הסימן של epsilon - mu.

  - id: Q-13-8
    type: numeric
    objectives: [OBJ-13-7]
    prompt: >-
      מולקולות עוברות בין הצורות A ו-B. צורה B נמצאת 1.0 k_B T מעל צורה A, והריכוז הקוונטי
      שלה כפול מזה של A (שני מצבים פנימיים בעלי אנרגיה שווה). מהו n_B/n_A בשיווי משקל?
    answer: 0.736
    tolerance: 0.01
    feedback: >-
      mu_A = mu_B עם mu_X = k_B T ln(n_X/n_Q,X) + epsilon_X נותן n_B/n_A = (n_Q,B/n_Q,A)
      exp(-Delta epsilon/(k_B T)) = 2 exp(-1) = 0.736. אם ענית 0.368, השמטת את
      הגורם שתיים -- הדרכים הנוספות להיות B.

  - id: Q-13-9
    type: multiple-choice
    objectives: [OBJ-13-7]
    misconception: osmosis-solute-flow
    prompt: >-
      שקית דיאליזה המכילה תמיסת סוכרוז בריכוז 0.2 mol/L מוכנסת למים טהורים ב-298 K. דופן
      השקית מעבירה מים אך לא סוכרוז. מה קורה, ומה גודל הלחץ האוסמוטי?
    choices:
      - text: מים זורמים לתוך השקית, והיא מתנפחת; הלחץ האוסמוטי הוא בערך n_s k_B T = 5 bar.
        correct: true
        feedback: >-
          נכון. הסוכרוז מוריד את הפוטנציאל הכימי של המים בתוך השקית בערך בשיעור של -k_B T ln(1 - x),
          ולכן מים זורמים פנימה, אל ה-mu הנמוך יותר. הזרימה הייתה נעצרת רק אם בפנים היה לחץ
          גבוה יותר ב-Pi = n_s k_B T = 0.2 x 1000 x N_A x k_B x 298 = 5.0 x 10^5 Pa.
      - text: סוכרוז זורם החוצה מהשקית עד שהריכוזים משתווים; הלחץ הוא בערך 5 bar.
        correct: false
        feedback: >-
          זו התפיסה השגויה שאוסמוזה היא מומס הנדחף דרך הקרום. הסוכרוז אינו יכול לעבור כלל. המים
          הם שנעים, במורד הפרש הפוטנציאל הכימי שלהם עצמם.
      - text: מים זורמים החוצה מהשקית, והיא מתכווצת, משום שהתמיסה צפופה יותר.
        correct: false
        feedback: >-
          למים שבתמיסה יש הפוטנציאל הכימי הנמוך יותר, ולכן מים זורמים פנימה, לא החוצה. שקית של
          מים טהורים באמבט סוכר הייתה מתכווצת.
      - text: שום דבר אינו קורה, משום שאין משאבה.
        correct: false
        feedback: >-
          אין צורך במשאבה. מים זורמים במורד הפרש הפוטנציאל הכימי שלהם, כמו שחלקיקים בסימולציית
          שתי הקופסאות זורמים במורד ההפרש שלהם.

  - id: Q-13-10
    type: short-answer
    objectives: [OBJ-13-1, OBJ-13-5]
    prompt: >-
      בשלושה או ארבעה משפטים: מדוע הפוטנציאל הכימי של גז אידיאלי קלאסי שלילי, ועל מה היה
      מעיד mu של גז המתקרב לאפס?
    discussion: >-
      עבור הגז האידיאלי mu = k_B T ln(n/n_Q), כאשר n_Q הוא הריכוז הקוונטי, חלקיק אחד לכל אורך
      גל תרמי בחזקת שלוש. גז הוא קלאסי בדיוק כאשר n נמוך בהרבה מ-n_Q -- אוויר בתנאי החדר
      מדולל פי שישה מיליון -- ולכן הלוגריתם שלילי. מבחינה פיזיקלית, הוספת חלקיק לגז מדולל
      מוסיפה אנטרופיה (יש לו הרבה מאוד מקום), ו-mu = -T dS/dN שלילי בכל פעם ש-dS/dN חיובי.
      mu המתקרב לאפס פירושו n המתקרב ל-n_Q: אורכי הגל התרמיים חופפים, הספירה הקלאסית שמאחורי
      סאקור–טטרודה נכשלת, והסטטיסטיקה הקוונטית (מודול 17) נכנסת לתמונה. תשובה חזקה מציינת גם
      את הסיבה האנטרופית וגם את קריטריון n_Q.
