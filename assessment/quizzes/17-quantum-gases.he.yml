module: 17-quantum-gases
questions:
  - id: Q-17-1
    type: multiple-choice
    objectives: [OBJ-17-1]
    prompt: >-
      שני חלקיקים חולקים שני מצבים חד-חלקיקיים, a ו-b. כמה מצבים שונים של שני החלקיקים יש אם
      החלקיקים קלאסיים (מסומנים), בוזונים זהים או פרמיונים זהים?
    choices:
      - text: 4, 3 ו-1 -- החלפה של חלקיקים מסומנים יוצרת מצב חדש; החלפה של חלקיקים זהים אינה יוצרת, ופרמיונים אינם רשאים לחלוק מצב.
        correct: true
        feedback: >-
          נכון. באופן קלאסי: שניהם ב-a, שניהם ב-b, ו-"1 ב-a, 2 ב-b" יחד עם ההחלפה שלו -- 4.
          בוזונים זהים: שניהם ב-a, שניהם ב-b, אחד בכל מצב -- 3, כי החלפה של חלקיקים זהים היא
          אותו מצב. פרמיונים זהים: רק אחד בכל מצב -- 1. במשקלים שווים, הסיכוי למצוא את שניהם
          באותו מצב הוא 1/2, 2/3 ו-0: בוזונים מתקבצים ופרמיונים מתרחקים זה מזה, בלי שום כוח
          מעורב.
      - text: 4 בכל המקרים -- כל חלקיק עדיין בוחר אחד משני מצבים.
        correct: false
        feedback: >-
          זו ספירה של חלקיקים זהים כאילו נשאו תוויות. פוסטולט הסימטריה קובע שמצב של חלקיקים
          זהים נקבע כולו על ידי מספרי האכלוס שלו, ולכן "1 ב-a, 2 ב-b" וההחלפה שלו הם מצב אחד, לא
          שניים. ספירה לפי תוויות היא פיזיקה קלאסית.
      - text: 3, 3 ו-1 -- החלפה לעולם אינה יוצרת מצב חדש, ופרמיונים אינם רשאים לחלוק מצב.
        correct: false
        feedback: >-
          עבור חלקיקים זהים זה נכון, אבל חלקיקים קלאסיים מסומנים: "חלקיק 1 ב-a, חלקיק 2 ב-b"
          וההפך הם מיקרו-מצבים נפרדים, ולכן הספירה הקלאסית נותנת 4. ההבדל הזה הוא בדיוק מה
          שהחלוקה ב-N! של מודול 12 באה לתקן.
      - text: 4, 2 ו-2 -- בוזונים חייבים לחלוק מצב, ופרמיונים אסור להם לחלוק.
        correct: false
        feedback: >-
          לבוזונים מותר לחלוק מצב, אבל הם אינם חייבים: אחד בכל מצב הוא מצב בוזוני תקין לחלוטין.
          פרמיונים אוסרים רק אכלוס כפול, וזה משאיר את המצב היחיד שבו יש פרמיון אחד בכל מצב.

  - id: Q-17-2
    type: multiple-choice
    objectives: [OBJ-17-2]
    prompt: >-
      בגז של בוזונים הפוטנציאל הכימי חייב להיות מתחת לאנרגיה eps_0 של המצב הנמוך ביותר של חלקיק
      בודד. מדוע?
    choices:
      - text: הסכום הגרנד-קנוני של המצב הנמוך ביותר, הסכום על n של exp(-n (eps_0 - mu)/(k_B T)), מתכנס רק אם mu < eps_0; כאשר mu מתקרב ל-eps_0, האכלוס הממוצע של המצב הזה גדל ללא גבול.
        correct: true
        feedback: >-
          נכון. בוזונים יכולים להיערם במצב ללא גבול, ולכן המשקלים של מצב יוצרים טור הנדסי, שמתכנס
          רק אם כל איבר קטן מקודמו: exp(-(eps - mu)/(k_B T)) < 1, כלומר mu < eps, לכל מצב ולכן
          גם לנמוך ביותר. ב-mu = eps_0 המצב הנמוך ביותר היה מחזיק אינסוף חלקיקים -- ואל החסם
          הזה נלחץ עיבוי בוזה–איינשטיין.
      - text: מפני שהפוטנציאל הכימי של כל גז הוא שלילי.
        correct: false
        feedback: >-
          הוא אינו כזה. לגז קלאסי mu = k_B T ln(n lambda^3), שלילי רק כשהגז מדולל, ולגז פרמי
          מנוון יש mu קרוב ל-eps_F, כמה אלקטרון-וולט מעל תחתית התיבה במתכת. החסם ייחודי
          לבוזונים.
      - text: מפני שעקרון פאולי אוסר על שני בוזונים להימצא במצב הנמוך ביותר.
        correct: false
        feedback: >-
          עקרון האיסור חל על פרמיונים, לא על בוזונים, ואכלוס פרמי–דיראק אינו זקוק לשום חסם על mu,
          כי כל מצב מחזיק לכל היותר חלקיק אחד, יהא mu אשר יהא.
      - text: מפני שמאגר אינו יכול לספק חלקיקים באנרגיה הנמוכה מ-eps_0.
        correct: false
        feedback: >-
          המאגר מספק חלקיקים בכל אנרגיה שיש למצבים. החסם נובע מהסכום על מספר החלקיקים שמצב אחד
          יכול להחזיק, לא מהאנרגיות המוצעות.

  - id: Q-17-3
    type: numeric
    objectives: [OBJ-17-2, OBJ-17-3]
    prompt: >-
      מצב חד-חלקיקי נמצא 2 k_B T מעל הפוטנציאל הכימי. מהו האכלוס הממוצע שלו בגז של
      בוזונים? (תנו שלוש ספרות אחרי הנקודה העשרונית.)
    answer: 0.157
    tolerance: 0.002
    feedback: >-
      n_BE = 1/(e^2 - 1) = 1/6.389 = 0.157. לשם השוואה, n_MB = e^-2 = 0.135 וכן
      n_FD = 1/(e^2 + 1) = 0.119: באותו (eps - mu)/(k_B T) הסדר הוא תמיד BE > MB > FD, כי
      e^x - 1 < e^x < e^x + 1. ב-2 k_B T הם עדיין נבדלים בעשרות אחוזים; ב-(eps - mu) = 4.6 k_B T
      (e^x = 100) הם מסכימים בתוך 1%.

  - id: Q-17-4
    type: multiple-choice
    objectives: [OBJ-17-3]
    misconception: quantum-only-cold
    prompt: >-
      בנחושת יש 8.5e28 אלקטרוני הולכה למטר מעוקב. ב-300 K, מהו בקירוב פרמטר הניוון n lambda^3 של
      גז האלקטרונים הזה, והאם הוא קלאסי או קוונטי?
    choices:
      - text: כ-7000 -- עמוק בתחום הקוונטי. אורך הגל התרמי של אלקטרון ב-300 K הוא כ-4 nm, פי תשעה עשר מהמרווח בין האלקטרונים.
        correct: true
        feedback: >-
          נכון. lambda = h/sqrt(2 pi m k_B T) = 4.3 nm עבור המסה הזעירה של האלקטרון, וכן
          n lambda^3 = 8.5e28 x (4.3e-9)^3 = 6800. באופן שקול, T/T_F = 300/81 700 = 0.004. מה
          שמכריע הוא n lambda^3 -- הצפיפות והמסה, ולא רק הטמפרטורה: לגז הליום באותה טמפרטורה
          ובלחץ אטמוספרי יש n lambda^3 = 4e-6.
      - text: כ-1e-5 -- בטמפרטורת החדר הכול קלאסי; לסטטיסטיקה קוונטית יש חשיבות רק קרוב לאפס המוחלט.
        correct: false
        feedback: >-
          זו התפיסה השגויה שאפקטים קוונטיים דורשים קור. הניוון נקבע על ידי n lambda^3, לא על ידי
          T לבדו. לגז הליום ב-300 K יש n lambda^3 = 4e-6 והוא קלאסי, אבל אלקטרונים קלים פי 7300,
          ואלה של נחושת צפופים פי 3500 מהגז הזה, וה-n lambda^3 שלהם הוא כ-7000. קיבול החום
          הנמדד שלהם, קטן פי מאה מהערך הקלאסי, מאשר זאת.
      - text: כ-1 -- גבולי; טמפרטורת החדר נמצאת בדיוק בתחום המעבר.
        correct: false
        feedback: >-
          המעבר הוא ב-n lambda^3 מסדר גודל 1, אבל האלקטרונים של נחושת רחוקים ממנו מאוד: חשבו
          lambda = h/sqrt(2 pi m_e k_B T) = 4.3e-9 m והעלו בחזקה שלישית. מאחר ש-n lambda^3 יורד
          כמו T^(-3/2), הם היו מגיעים ל-n lambda^3 = 1 רק בסביבות 100 000 K.
      - text: אי אפשר להכריע -- הטמפרטורה של האלקטרונים גבוהה בהרבה מ-300 K, כי הם נעים במהירות 1.6e6 m/s.
        correct: false
        feedback: >-
          האלקטרונים נמצאים בשיווי משקל עם הסריג ב-300 K. המהירויות הגבוהות שלהם אינן תרמיות: הן
          מהירות פרמי, שנכפית עליהם מפני שהמצבים בעלי האנרגיה הנמוכה כבר מלאים. זו תוצאה של
          הניוון, לא עדות לטמפרטורה גבוהה.

  - id: Q-17-5
    type: multiple-choice
    objectives: [OBJ-17-4]
    prompt: >-
      גז מקורר בצפיפות קבועה. לאיזה כיוון נע הפוטנציאל הכימי שלו, עבור גז פרמי ועבור גז בוזה
      (כשהאנרגיות נמדדות מתחתית התיבה)?
    choices:
      - text: שניהם מטפסים. ה-mu של גז פרמי עולה לעבר eps_F ומתייצב שם כאשר T -> 0; ה-mu של גז בוזה עולה לעבר 0, ומתחת ל-T_c נשאר ב-0.
        correct: true
        feedback: >-
          נכון. n lambda^3 גדל כמו T^(-3/2), ולכן אינטגרל האכלוס F(mu/k_B T) חייב לגדול,
          ו-mu/k_B T מטפס. פרמיונים יכולים להמשיך לטפס: mu שואף ל-eps_F, פני הים המלא. בוזונים
          פוגעים בחסם שלהם mu < eps_0 = 0 ב-n lambda^3 = 2.612 ונעצרים; העודף עובר למצב היסוד.
      - text: שניהם צוללים לעבר מינוס אינסוף, כמו הפוטנציאל הכימי של גז קלאסי.
        correct: false
        feedback: >-
          ה-mu = k_B T ln(n lambda^3) של גז קלאסי שלילי מאוד כשהגז חם ומדולל, ועולה כשמקררים
          אותו, כי n lambda^3 גדל. קירור בצפיפות קבועה דוחף את ה-mu/k_B T של כל גז כלפי מעלה, לא
          כלפי מטה.
      - text: שניהם שואפים לאפס, כי mu פרופורציונלי ל-k_B T.
        correct: false
        feedback: >-
          mu אינו פרופורציונלי ל-k_B T. עבור פרמיונים הוא שואף לאנרגיה הקבועה eps_F, שתלויה רק
          בצפיפות; עבור בוזונים הוא אפס בדיוק מתחת ל-T_c. היחס mu/k_B T הוא מה שהצפיפות קובעת,
          והוא אינו קבוע כש-T משתנה.
      - text: שניהם מטפסים ללא גבול, כי n lambda^3 גדל ללא גבול.
        correct: false
        feedback: >-
          עבור פרמיונים mu מטפס עד שהוא מגיע ל-eps_F, אנרגיה סופית. עבור בוזונים הטיפוס נעצר
          באנרגיה הנמוכה ביותר, 0, כי mu אינו רשאי לעלות מעל האנרגיה של שום מצב בוזוני; מכאן
          והלאה החלקיקים העודפים מתעבים.

  - id: Q-17-6
    type: numeric
    objectives: [OBJ-17-5]
    prompt: >-
      לגז אחיד של אטומי רובידיום-87 (מסה 1.443e-25 kg, g_s = 1) יש צפיפות של 1.0e20 למטר
      מעוקב. מהי טמפרטורת עיבוי בוזה–איינשטיין שלו, בננו-קלווין?
    answer: 398
    tolerance: 10
    feedback: >-
      k_B T_c = (2 pi hbar^2/m)(n/2.612)^(2/3). כאן 2 pi hbar^2/m = 4.84e-43 J m^2 וכן
      (n/2.612)^(2/3) = (3.83e19)^(2/3) = 1.14e13 למטר רבוע, ולכן k_B T_c = 5.50e-30 J
      ו-T_c = 398 nK. במחצית הטמפרטורה הזו, 1 - 0.5^(3/2) = 65% מהאטומים נמצאים במצב היחיד
      הנמוך ביותר. ניסויים אמיתיים מחזיקים אטומים במלכודות הרמוניות ולא בתיבות, וחלק הקונדנסט
      שלהם מתנהג במקום זאת לפי 1 - (T/T_c)^3.

  - id: Q-17-7
    type: numeric
    objectives: [OBJ-17-6]
    prompt: >-
      בנחושת יש 8.5e28 אלקטרוני הולכה למטר מעוקב (g_s = 2). מהי אנרגיית פרמי שלהם,
      באלקטרון-וולט?
    answer: 7.05
    tolerance: 0.1
    feedback: >-
      eps_F = (hbar^2/2m)(3 pi^2 n)^(2/3) = 6.10e-39 J m^2 x 1.85e20 למטר רבוע = 1.13e-18 J = 7.05 eV,
      ולכן T_F = 81 800 K. לחץ הניוון (2/5) n eps_F הוא 3.8e10 Pa -- 380 000 אטמוספרות, יותר
      מפי מאה מה-n k_B T הקלאסי ב-300 K -- והוא קיים גם באפס המוחלט.

  - id: Q-17-8
    type: multiple-choice
    objectives: [OBJ-17-7]
    prompt: >-
      גז קלאסי של אלקטרוני הולכה היה מוסיף (3/2) R למול לקיבול החום של מתכת. בטמפרטורת החדר
      התרומה האלקטרונית הנמדדת קטנה מ-1% מזה. מדוע?
    choices:
      - text: רק לאלקטרונים שנמצאים בטווח של כ-k_B T מאנרגיית פרמי יש בקרבתם מצבים ריקים שאליהם הם יכולים לעבור; הם חלק מסדר גודל T/T_F מכלל האלקטרונים, כ-0.004 בנחושת.
        correct: true
        feedback: >-
          נכון. אלקטרון עמוק בתוך ים פרמי אינו יכול לקלוט אנרגיה k_B T, כי כל מצב שנמצא בטווח
          k_B T מהמצב שלו מלא. רק הקליפה העליונה יכולה להגיב, ולכן C_el ~ N k_B T/T_F --
          (pi^2/2) N k_B T/T_F במדויק -- לינארי ב-T וזעיר בהשוואה ל-(3/2) N k_B כל עוד
          T << T_F = 82 000 K.
      - text: מעט מאוד אלקטרונים חופשיים -- הרבה פחות מאחד לאטום -- וכל אחד מהם נושא (3/2) k_B T כרגיל.
        correct: false
        feedback: >-
          זה התיקון הקלאסי שאינו עובד. בנחושת יש אלקטרון הולכה אחד לאטום -- את הצפיפות הזו מודדות
          המוליכות שלה, אפקט הול שלה ואנרגיית פרמי שלה -- ועם (3/2) k_B לכל אחד הם היו מוסיפים
          50% לערך של דולונג–פטי. המספר נכון; האנרגיה לאלקטרון היא מה שהתורה הקלאסית טועה בו.
      - text: הדחייה בין האלקטרונים נועלת אותם במקומם, ולכן הם אינם יכולים לקלוט אנרגיה.
        correct: false
        feedback: >-
          לגז פרמי האידיאלי אין שום אינטראקציות, והוא עדיין נותן קיבול חום זעיר ולינארי. גם
          האלקטרונים אינם נעולים: הם נעים במהירויות של עד 1.6e6 m/s, ולכן מתכות מוליכות. מה
          שמגביל את קיבול החום הוא שהמצבים סביב רוב האלקטרונים תפוסים, לא כוח.
      - text: האלקטרונים קפואים כמו מתנד בתדירות גבוהה במודול 16, כי קוונט יחיד של התנועה שלהם עולה על k_B T.
        correct: false
        feedback: >-
          המרווחים בין הרמות של האלקטרונים במתכת קטנים בהרבה מ-k_B T -- רצף. לקפיאה כאן יש סיבה
          אחרת: האיסור. האנרגיות זמינות; המצבים שאליהם הן היו מובילות תפוסים.

  - id: Q-17-9
    type: short-answer
    objectives: [OBJ-17-8]
    prompt: >-
      בשלושה או ארבעה משפטים: מדוע לפוטונים בחלל יש פוטנציאל כימי אפס, ולמקרה פרטי של מה זה הופך
      את הספקטרום של פלאנק?
    discussion: >-
      הדפנות בולעות ופולטות פוטונים בחופשיות, ולכן מספר הפוטונים אינו נשמר: הוא אינו אילוץ שיש
      להחזיק קבוע אלא משתנה, וב-T וב-V קבועים הוא מתייצב היכן שהאנרגיה החופשית מינימלית, שם
      (dF/dN) = mu = 0. פוטונים הם בוזונים, ולכן כל אופן של החלל מחזיק בממוצע
      n_BE = 1/(exp(h nu/(k_B T)) - 1) פוטונים עם mu = 0. הכפלה בצפיפות האופנים של הפוטונים,
      8 pi nu^2/c^3, ובאנרגיה h nu של כל פוטון נותנת את חוק פלאנק: זו התפלגות בוזה–איינשטיין
      ב-mu = 0. תשובה חזקה מוסיפה שמאותה סיבה גז פוטונים אינו יכול לעבור עיבוי -- אין מספר קבוע
      שידחק את mu אל החסם שלו -- ושהמעבדה משחזרת את העקומה של מודול 16 מתוך פונקציית
      בוזה–איינשטיין עד הספרה האחרונה.

  - id: Q-17-10
    type: multiple-choice
    objectives: [OBJ-17-5]
    misconception: bec-atoms-stop
    prompt: >-
      גז בוזה אידיאלי מקורר למחצית מטמפרטורת העיבוי שלו, ו-65% מהאטומים שלו נמצאים כעת במצב
      החד-חלקיקי הנמוך ביותר. איזה מהתיאורים הבאים מתאים לגז?
    choices:
      - text: הוא עדיין מפעיל לחץ, P = 1.341 k_B T/lambda^3, שנישא על ידי 35% שבמצבים המעוררים; הוספת אטומים באותו T לא הייתה משנה אותו.
        correct: true
        feedback: >-
          נכון. המצבים המעוררים מחזיקים בדיוק כמה אטומים שהם יכולים להחזיק בטמפרטורה הזו,
          2.612 V/lambda^3, ואלה נעים ופוגעים בדפנות כמו קודם. רק הם נושאים אנרגיה, ולכן
          P = (2/3) U/V = zeta(5/2) k_B T/lambda^3, שתלוי ב-T בלבד. אטומים נוספים מצטרפים
          לקונדנסט, שאינו מעביר שום תנע לדפנות.
      - text: כל האטומים הפסיקו לנוע, ולכן הלחץ הוא אפס.
        correct: false
        feedback: >-
          זו התפיסה השגויה שעיבוי הוא עצירה של התנועה. הוא טענה על אכלוס: 65% מהאטומים חולקים
          מצב אחד, ו-35% האחרים פרושים על פני המצבים המעוררים ונעים. הלחץ הוא
          1.341 k_B T/lambda^3 -- ב-T_c, 51% מה-n k_B T הקלאסי -- והוא יורד לאפס רק כאשר
          T -> 0.
      - text: הלחץ שלו הוא n k_B T, כמו לכל גז אידיאלי.
        correct: false
        feedback: >-
          n k_B T הוא הלחץ של גז אידיאלי קלאסי. לגז בוזה מנוון יש פחות: האטומים שבקונדנסט שלו
          אינם תורמים דבר, ואפילו המעוררים נדחקים לאנרגיות נמוכות. מתחת ל-T_c, P אינו תלוי
          ב-n כלל.
      - text: הלחץ שלו גדול מ-n k_B T, כי בוזונים מתקבצים יחד ודוחפים חזק יותר על הדפנות.
        correct: false
        feedback: >-
          ההתקבצות דוחקת בוזונים למצבים בעלי אנרגיה נמוכה, וזה מוריד את הלחץ, לא מעלה אותו.
          האטומים שבקונדנסט נמצאים במצב של אנרגיה קינטית אפס ואינם דוחפים דבר.

  - id: Q-17-11
    type: multiple-choice
    objectives: [OBJ-17-6]
    misconception: pauli-exclusion-force
    prompt: >-
      מודל גז פרמי האידיאלי מנבא לחץ של 3.8e10 Pa לאלקטרונים בנחושת אפילו באפס המוחלט. במודל
      הזה, מה יוצר אותו?
    choices:
      - text: אנרגיה קינטית. האיסור כופה על האלקטרונים מצבים של תנע גבוה -- עד תנע פרמי -- והם מעבירים את התנע הזה לדפנות בדיוק כפי שעושות המולקולות של מודול 04. המודל אינו מכיל שום כוחות בין האלקטרונים.
        correct: true
        feedback: >-
          נכון. P = (2/3) U/V לכל גז אידיאלי, ולים פרמי יש U = (3/5) N eps_F אפילו ב-T = 0.
          סחיטת הים מעלה כל רמה, ולכן היא דורשת עבודה, והעבודה הזו נאגרת כאנרגיה קינטית. שורת
          "מוזנח" במפרט המודל מונה כל אינטראקציה; הלחץ שורד בכל זאת. זו ספירה ועוד אנרגיה קינטית,
          לא כוח.
      - text: כוח דוחה, "כוח פאולי", בין אלקטרונים, שמונע מכל שניים מהם לחלוק מצב.
        correct: false
        feedback: >-
          זו התפיסה השגויה שהמודול מתעמת איתה. אין כוח כזה במודל -- שורת "מוזנח" שלו מונה את כל
          האינטראקציות -- והלחץ עדיין קיים. עקרון האיסור מגביל את המצבים שמותר לאכלס; הלחץ הוא
          האנרגיה הקינטית של המצבים שהוא כופה על האלקטרונים.
      - text: דחייה אלקטרוסטטית בין האלקטרונים.
        correct: false
        feedback: >-
          אלקטרונים אמיתיים אכן דוחים זה את זה, אבל גז פרמי האידיאלי משמיט את הדחייה ועדיין מנבא
          3.8e10 Pa. במתכת אמיתית הדחייה בין האלקטרונים מקוזזת ברובה על ידי היונים החיוביים, וזו
          הסיבה שמודל האלקטרונים החופשיים מצליח כל כך.
      - text: התנועה התרמית של האלקטרונים, כמו בגז קלאסי.
        correct: false
        feedback: >-
          באפס המוחלט אין תנועה תרמית, והלחץ הקלאסי n k_B T היה אפס. ב-300 K הוא 3.5e8 Pa, קטן
          פי מאה מלחץ הניוון, שכמעט אינו משתנה עם הטמפרטורה כל עוד T << T_F.
