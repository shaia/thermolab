[project]
name = "thermolab"
version = "0.1.0"
description = "ThermoLab: interactive bilingual (EN/HE) university thermal & statistical physics course"
authors = [
    { name = "shaia", email = "shaia@outlook.com" }
]
# 3.12 pinned to match Pyodide (JupyterLite kernel) so notebooks behave identically in-browser
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipywidgets>=8.1.8",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pint>=0.25.3",
    "scipy>=1.18.0",
    "sympy>=1.14.0",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dimensional: pint dimensional-consistency checks (accuracy framework category 1)",
    "conservation: energy / particle-number conservation (category 2)",
    "analytic_limit: known analytic special cases and limits (category 3)",
    "large_n: large-N scaling behaviour, e.g. fluctuations ~ N^-1/2 (category 4)",
    "convergence: numerical convergence under step refinement (category 5)",
    "seed_independence: results independent of RNG seed within statistical error (category 6)",
    "slow: long-running tests, excluded from quick runs",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "NPY", "B"]

[dependency-groups]
dev = [
    "hypothesis>=6.165.2",
    "jupyterlab>=4.6.2",
    "jupyterlite-core>=0.8.1",
    "jupyterlite-pyodide-kernel>=0.8.2",
    "jupyterquiz>=2.9.6.4",
    "nbformat>=5.11.0",
    "nbmake>=1.5.5",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.2",
]
