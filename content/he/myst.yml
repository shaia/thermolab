version: 1
project:
  id: thermolab-he
  title: "ThermoLab — תרמו-מעבדה"
  description: "לחקור, לגזור ולדמות פיזיקה תרמית — קורס אוניברסיטאי אינטראקטיבי"
  keywords: [תרמודינמיקה, מכניקה סטטיסטית, פיזיקה]
  numbering:
    heading_2: false
  math:
    '\dbar': '\delta'
    '\Won': 'W_{\mathrm{on}}'
    '\kB': 'k_{\mathrm{B}}'
  toc:
    - file: index.md
    - title: תרמודינמיקה
      children:
        - file: thermodynamics/04-pressure.md
        - file: thermodynamics/04-pressure-problems.md
        - file: thermodynamics/05-work-paths.md
        - file: thermodynamics/05-work-paths-problems.md
    - title: מכניקה סטטיסטית
      children:
        - file: statistical-mechanics/08-multiplicity.md
        - file: statistical-mechanics/08-multiplicity-problems.md
    - title: פיתוח
      children:
        - file: dev/bidi-test.md
    - title: "English"
      url: /en/
site:
  template: book-theme
  # Without an explicit site title the book theme's header falls back to "Made with MyST".
  title: "ThermoLab — תרמו-מעבדה"
  options:
    hide_outline: false
    folders: true
    # thermolab.css is generated by scripts/build_css.py and carries the RTL rules — the
    # theme loads it itself, which is the only styling hook that survives hydration.
    style: thermolab.css
